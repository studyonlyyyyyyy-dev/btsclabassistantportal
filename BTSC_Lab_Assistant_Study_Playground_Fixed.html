{id:"u4t1",t:"DBMS basics, schema, instances, three-level architecture",html:`
<h4>Why a DBMS</h4>
<ul class="bul">
<li>Controls redundancy through normalisation and shared data.</li>
<li>Enforces integrity and access rules centrally.</li>
<li>Gives concurrent access with isolation, plus backup and recovery.</li>
<li>Provides a query language (SQL) instead of hand-written file code.</li>
</ul>
<h4>Three-level architecture</h4>
<table class="tbl"><tr><th>Level</th><th>Describes</th><th>Who cares</th></tr>
<tr><td>External (view)</td><td>What each user sees</td><td>Application and user</td></tr>
<tr><td>Conceptual (logical)</td><td>All entities, relationships and constraints</td><td>DBA and designer</td></tr>
<tr><td>Internal (physical)</td><td>How data is stored: files, indexes, pages</td><td>DBMS</td></tr></table>
<p><b>Data independence:</b> logical independence lets the conceptual schema change without touching views; physical independence lets storage change without touching the conceptual schema.</p>
<h4>Vocabulary</h4>
<ul class="bul">
<li><b>Schema</b> = the structure (rarely changes). <b>Instance</b> = the data at a moment in time.</li>
<li><b>Degree</b> = number of attributes (columns). <b>Cardinality</b> = number of tuples (rows).</li>
<li><b>Domain</b> = the set of legal values for an attribute.</li>
<li><b>DML</b> manipulates data (SELECT, INSERT, UPDATE, DELETE); <b>DDL</b> defines structure (CREATE, ALTER, DROP, TRUNCATE).</li>
</ul>
<div class="mn"><b>Exam tip:</b> TRUNCATE is DDL in most DBMSs, DELETE is DML. TRUNCATE cannot be filtered with WHERE and is not logged row by row.</div>`},
{id:"u4t2",t:"SQL: SELECT, WHERE, GROUP BY, HAVING, ORDER BY, joins",html:`
<svg viewBox="0 0 520 60" class="dia" role="img" aria-label="SQL clause evaluation order">
<g font-size="11" fill="var(--ink)">
<rect x="6" y="16" width="66" height="28" rx="6" fill="var(--brand)" opacity=".18" stroke="var(--brand)"/><text x="39" y="34" text-anchor="middle">FROM</text>
<rect x="82" y="16" width="66" height="28" rx="6" fill="var(--brand)" opacity=".18" stroke="var(--brand)"/><text x="115" y="34" text-anchor="middle">WHERE</text>
<rect x="158" y="16" width="80" height="28" rx="6" fill="var(--brand)" opacity=".18" stroke="var(--brand)"/><text x="198" y="34" text-anchor="middle">GROUP BY</text>
<rect x="248" y="16" width="66" height="28" rx="6" fill="var(--brand)" opacity=".18" stroke="var(--brand)"/><text x="281" y="34" text-anchor="middle">HAVING</text>
<rect x="324" y="16" width="70" height="28" rx="6" fill="var(--brand)" opacity=".18" stroke="var(--brand)"/><text x="359" y="34" text-anchor="middle">SELECT</text>
<rect x="404" y="16" width="60" height="28" rx="6" fill="var(--brand)" opacity=".18" stroke="var(--brand)"/><text x="434" y="34" text-anchor="middle">ORDER</text>
<rect x="474" y="16" width="42" height="28" rx="6" fill="var(--brand)" opacity=".18" stroke="var(--brand)"/><text x="495" y="34" text-anchor="middle">LIMIT</text>
</g>
</svg>
<h4>The general form</h4>
<p><code>SELECT [DISTINCT] columns FROM table [JOIN ...] WHERE condition GROUP BY cols HAVING condition ORDER BY cols [ASC|DESC] LIMIT n;</code></p>
<h4>Joins</h4>
<table class="tbl"><tr><th>Join</th><th>Result</th><th>Unmatched rows</th></tr>
<tr><td>INNER</td><td>Only matching pairs</td><td>Dropped</td></tr>
<tr><td>LEFT</td><td>All left rows plus matches</td><td>Right side padded with NULL</td></tr>
<tr><td>RIGHT</td><td>All right rows plus matches</td><td>Left side padded with NULL</td></tr>
<tr><td>FULL OUTER</td><td>Everything</td><td>Both sides padded</td></tr>
<tr><td>CROSS</td><td>Cartesian product</td><td>|R| &times; |S| rows</td></tr>
<tr><td>SELF</td><td>Table joined with itself</td><td>Needs aliases</td></tr></table>
<h4>Aggregates and NULL</h4>
<ul class="bul">
<li>SUM, AVG, MIN, MAX and COUNT(column) all <b>ignore NULL</b>; COUNT(*) counts rows.</li>
<li>marks = 50, 60, NULL, 70 &rarr; AVG = 60, COUNT(marks) = 3, COUNT(*) = 4.</li>
<li>Comparison with NULL gives UNKNOWN; use IS NULL / IS NOT NULL.</li>
<li>GROUP BY treats all NULLs as one group; WHERE cannot contain aggregates.</li>
</ul>
<div class="warn"><b>Order matters:</b> WHERE filters rows before grouping, HAVING filters groups after. Using an aggregate in WHERE is an error, not a style choice.</div>`},
{id:"u4t3",t:"SQL: INSERT, UPDATE, DELETE, DDL vs DML commands",html:`
<table class="tbl"><tr><th>Command</th><th>Class</th><th>Purpose</th></tr>
<tr><td>CREATE / ALTER / DROP / TRUNCATE</td><td>DDL</td><td>Define or change structure</td></tr>
<tr><td>SELECT / INSERT / UPDATE / DELETE</td><td>DML</td><td>Read or change data</td></tr>
<tr><td>COMMIT / ROLLBACK / SAVEPOINT</td><td>TCL</td><td>Transaction control</td></tr>
<tr><td>GRANT / REVOKE</td><td>DCL</td><td>Privileges</td></tr></table>
<h4>Statement syntax</h4>
<ul class="bul">
<li><code>INSERT INTO emp (id, name, salary) VALUES (1, 'Ravi', 40000);</code></li>
<li><code>UPDATE emp SET salary = salary * 1.1 WHERE dept = 'HR';</code> — SET comes before WHERE.</li>
<li><code>DELETE FROM emp WHERE id = 5;</code> — without WHERE it deletes every row.</li>
<li><code>ALTER TABLE emp ADD COLUMN email VARCHAR(60);</code></li>
</ul>
<h4>DELETE vs TRUNCATE vs DROP</h4>
<table class="tbl"><tr><th>Point</th><th>DELETE</th><th>TRUNCATE</th><th>DROP</th></tr>
<tr><td>Removes</td><td>Selected rows</td><td>All rows</td><td>Table itself</td></tr>
<tr><td>WHERE allowed</td><td>Yes</td><td>No</td><td>No</td></tr>
<tr><td>Rollback</td><td>Yes (logged)</td><td>Usually not</td><td>Not</td></tr>
<tr><td>Speed</td><td>Slow, row by row</td><td>Fast</td><td>Fast</td></tr></table>
<div class="mn"><b>Safe habit:</b> run the same predicate as a SELECT before an UPDATE or DELETE, and wrap it in a transaction so a mistake is reversible.</div>`},
{id:"u4t4",t:"Relational algebra: selection, projection, join, set operations",html:`
<table class="tbl"><tr><th>Symbol</th><th>Name</th><th>Meaning</th><th>SQL equivalent</th></tr>
<tr><td>&sigma;</td><td>Selection</td><td>Filter rows</td><td>WHERE</td></tr>
<tr><td>&pi;</td><td>Projection</td><td>Choose columns, remove duplicates</td><td>SELECT DISTINCT</td></tr>
<tr><td>&times;</td><td>Cartesian product</td><td>All pairs</td><td>CROSS JOIN</td></tr>
<tr><td>&#8904;</td><td>Natural join</td><td>Equi-join on common attributes</td><td>NATURAL JOIN</td></tr>
<tr><td>&theta;-join</td><td>Theta join</td><td>Join on any condition</td><td>JOIN ... ON</td></tr>
<tr><td>&rho;</td><td>Rename</td><td>Rename relation or attribute</td><td>AS</td></tr>
<tr><td>&cup; &cap; &minus;</td><td>Union, intersection, difference</td><td>Set operations</td><td>UNION, INTERSECT, EXCEPT</td></tr></table>
<h4>Rules that decide the answer</h4>
<ul class="bul">
<li>Set operations need <b>union compatibility</b>: same number of attributes and compatible domains.</li>
<li>Projection is set based, so it eliminates duplicates — that is why &pi; maps to SELECT DISTINCT.</li>
<li>A natural join removes the duplicate common column, so degree = deg(R) + deg(S) &minus; 1.</li>
<li>Join then select is not the same as select then join, but the result is equal when the predicate touches only one relation (a useful optimisation rule).</li>
</ul>
<h4>Counting rows</h4>
<p>R has 3 tuples, S has 4 &rarr; R &times; S has 12. If the join attribute matches (1,x) twice and (2,y) once, the natural join returns 3 tuples.</p>
<div class="mn"><b>Tip:</b> translate the expression inside-out. Innermost operator first, then rename, then the outer selection.</div>`},
{id:"u4t5",t:"Keys: primary, candidate, foreign, super key; integrity constraints",html:`
<svg viewBox="0 0 520 150" class="dia" role="img" aria-label="Primary key and foreign key relationship">
<g font-size="11" fill="var(--ink)">
<rect x="14" y="24" width="200" height="104" rx="8" fill="var(--brand)" opacity=".1" stroke="var(--brand)"/>
<text x="114" y="44" text-anchor="middle" font-weight="700">dept</text>
<line x1="14" y1="52" x2="214" y2="52" stroke="var(--brand)" opacity=".4"/>
<text x="30" y="70" font-weight="700" text-decoration="underline">dept_id</text><text x="120" y="70" font-size="9" fill="var(--muted)">PK</text>
<text x="30" y="92">dname</text>
<text x="30" y="114">location</text>
<rect x="300" y="24" width="206" height="104" rx="8" fill="var(--brand)" opacity=".1" stroke="var(--brand)"/>
<text x="403" y="44" text-anchor="middle" font-weight="700">employee</text>
<line x1="300" y1="52" x2="506" y2="52" stroke="var(--brand)" opacity=".4"/>
<text x="316" y="70" font-weight="700" text-decoration="underline">emp_id</text><text x="380" y="70" font-size="9" fill="var(--muted)">PK</text>
<text x="316" y="92">name</text>
<text x="316" y="114">dept_id</text><text x="380" y="114" font-size="9" fill="var(--muted)">FK</text>
<path d="M214 66 C 250 66, 260 106, 300 106" stroke="var(--accent)" stroke-width="2" fill="none" marker-end="url(#fk)"/>
<text x="258" y="60" text-anchor="middle" font-size="9" fill="var(--muted)">references</text>
<defs><marker id="fk" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--accent)"/></marker></defs>
</g></svg>

<table class="tbl"><tr><th>Key</th><th>Definition</th><th>Allows NULL</th></tr>
<tr><td>Super key</td><td>Any attribute set that uniquely identifies a tuple</td><td>Depends</td></tr>
<tr><td>Candidate key</td><td>Minimal super key, no proper subset works</td><td>No (if chosen as PK)</td></tr>
<tr><td>Primary key</td><td>The chosen candidate key</td><td>Never</td></tr>
<tr><td>Alternate key</td><td>Candidate keys not chosen as primary</td><td>Usually unique</td></tr>
<tr><td>Foreign key</td><td>References a candidate key of another (or same) relation</td><td>Yes, if the relationship is optional</td></tr>
<tr><td>Composite key</td><td>Key made of two or more attributes</td><td>—</td></tr></table>
<h4>Constraints</h4>
<ul class="bul">
<li><b>Entity integrity:</b> primary key is unique and NOT NULL.</li>
<li><b>Referential integrity:</b> a foreign key value must exist in the referenced table or be NULL.</li>
<li><b>Domain integrity:</b> type, range, CHECK conditions.</li>
<li><b>User-defined:</b> business rules such as salary &le; manager salary.</li>
</ul>
<h4>Counting keys</h4>
<p>If ABC is the only candidate key, the only superkey is ABC itself. With AB and BC as candidate keys, every superset of either counts: AB, ABC, BC.</p>
<div class="warn"><b>Trap:</b> a UNIQUE constraint may allow multiple NULLs in some DBMSs, but a PRIMARY KEY never allows even one. Do not treat them as identical.</div>`},
{id:"u4t6",t:"Functional dependencies, closure, Armstrong's axioms",html:`
<h4>Definitions</h4>
<ul class="bul">
<li><b>X &rarr; Y</b> means each X value determines exactly one Y value.</li>
<li><b>Trivial FD:</b> Y is a subset of X.</li>
<li><b>Partial dependency:</b> a non-key attribute depends on only part of a composite key.</li>
<li><b>Transitive dependency:</b> A &rarr; B and B &rarr; C with B not a key.</li>
</ul>
<h4>Armstrong's axioms</h4>
<table class="tbl"><tr><th>Axiom</th><th>Rule</th></tr>
<tr><td>Reflexivity</td><td>If Y &sube; X then X &rarr; Y</td></tr>
<tr><td>Augmentation</td><td>If X &rarr; Y then XZ &rarr; YZ</td></tr>
<tr><td>Transitivity</td><td>If X &rarr; Y and Y &rarr; Z then X &rarr; Z</td></tr>
<tr><td>Union</td><td>X &rarr; Y and X &rarr; Z give X &rarr; YZ</td></tr>
<tr><td>Decomposition</td><td>X &rarr; YZ gives X &rarr; Y and X &rarr; Z</td></tr>
<tr><td>Pseudo-transitivity</td><td>X &rarr; Y and WY &rarr; Z give WX &rarr; Z</td></tr></table>
<h4>Closure algorithm</h4>
<ol class="num">
<li>Start with result = X.</li>
<li>For every FD A &rarr; B where A is inside result, add B.</li>
<li>Repeat until nothing changes. If result contains every attribute, X is a superkey.</li>
</ol>
<p>For R(A,B,C,D) with AB&rarr;C, C&rarr;D, D&rarr;A: (AB)<sup>+</sup>, (BC)<sup>+</sup> and (BD)<sup>+</sup> all give ABCD, so there are three candidate keys.</p>
<div class="mn"><b>Shortcut:</b> attributes that never appear on the right side of any FD must be part of every candidate key. Start from there.</div>`},
{id:"u4t7",t:"Normalisation: 1NF, 2NF, 3NF, BCNF, 4NF",html:`
<svg viewBox="0 0 520 190" class="dia" role="img" aria-label="Normalisation ladder">
<g font-size="11.5">
<rect x="10" y="140" width="96" height="40" rx="6" fill="var(--brand)" opacity=".22" stroke="var(--brand)"/><text x="58" y="165" text-anchor="middle" fill="var(--ink)">1NF: atomic</text>
<rect x="118" y="104" width="110" height="40" rx="6" fill="var(--brand)" opacity=".22" stroke="var(--brand)"/><text x="173" y="129" text-anchor="middle" fill="var(--ink)">2NF: no partial</text>
<rect x="240" y="68" width="118" height="40" rx="6" fill="var(--brand)" opacity=".22" stroke="var(--brand)"/><text x="299" y="93" text-anchor="middle" fill="var(--ink)">3NF: no transitive</text>
<rect x="370" y="32" width="140" height="40" rx="6" fill="var(--brand)" opacity=".22" stroke="var(--brand)"/><text x="440" y="57" text-anchor="middle" fill="var(--ink)">BCNF: determinant = key</text>
<path d="M106 160 L114 140" stroke="var(--brand)" stroke-width="2"/><path d="M228 124 L236 104" stroke="var(--brand)" stroke-width="2"/><path d="M358 88 L366 68" stroke="var(--brand)" stroke-width="2"/>
</g>
</svg>
<table class="tbl"><tr><th>Form</th><th>Removes</th><th>Test question</th></tr>
<tr><td>1NF</td><td>Multivalued or composite attributes</td><td>Is every cell atomic?</td></tr>
<tr><td>2NF</td><td>Partial dependency</td><td>Does a non-key attribute depend on part of the key?</td></tr>
<tr><td>3NF</td><td>Transitive dependency</td><td>Does a non-key attribute determine another non-key attribute?</td></tr>
<tr><td>BCNF</td><td>Any FD with a non-superkey determinant</td><td>Is every determinant a candidate key?</td></tr>
<tr><td>4NF</td><td>Multivalued dependency</td><td>Are independent multivalued facts separated?</td></tr></table>
<h4>Decomposition rules</h4>
<ul class="bul">
<li><b>Lossless join:</b> the common attributes of the two pieces must be a superkey of at least one piece.</li>
<li><b>Dependency preservation:</b> every original FD should be checkable inside one relation. 3NF guarantees it; BCNF may not.</li>
<li>3NF is a good practical target when dependency preservation matters; BCNF removes all FD redundancy but may lose dependencies.</li>
</ul>
<div class="mn"><b>Mnemonic:</b> <b>1</b> cell, <b>2</b> whole key, <b>3</b> nothing but the key, <b>BCNF</b> every determinant a key.</div>`},
{id:"u4t8",t:"ER model: entities, attributes, relationships, cardinality",html:`
<h4>Symbols</h4>
<table class="tbl"><tr><th>Symbol</th><th>Meaning</th></tr>
<tr><td>Rectangle</td><td>Entity set</td></tr>
<tr><td>Double rectangle</td><td>Weak entity</td></tr>
<tr><td>Ellipse</td><td>Attribute</td></tr>
<tr><td>Double ellipse</td><td>Multivalued attribute</td></tr>
<tr><td>Dashed ellipse</td><td>Derived attribute</td></tr>
<tr><td>Diamond</td><td>Relationship</td></tr>
<tr><td>Double diamond</td><td>Identifying relationship for a weak entity</td></tr>
<tr><td>Underlined attribute</td><td>Key attribute</td></tr></table>
<h4>Cardinality</h4>
<ul class="bul">
<li><b>1:1</b> — one person holds one passport.</li>
<li><b>1:N</b> — one department has many employees.</li>
<li><b>M:N</b> — students enrol in many courses; needs a separate table with both keys.</li>
<li><b>Participation:</b> total (double line, every entity must participate) vs partial (single line).</li>
</ul>
<h4>Weak entity</h4>
<p>It has no key of its own and is identified through its owner: a <i>dependent</i> entity is identified by (employee id, dependent name). It always has total participation in the identifying relationship.</p>
<h4>ER to tables</h4>
<ol class="num">
<li>Strong entity &rarr; one table with its key.</li>
<li>1:N relationship &rarr; put the "one" side's key as a foreign key in the "many" table.</li>
<li>M:N relationship &rarr; a new table with both keys, plus any relationship attributes.</li>
<li>Multivalued attribute &rarr; a separate table.</li>
<li>Weak entity &rarr; a table with the owner key plus the partial key.</li>
</ol>
<div class="tip"><b>Generalisation vs aggregation:</b> generalisation abstracts common features into a superclass; aggregation treats a relationship as a single higher-level entity.</div>`},
{id:"u4t9",t:"Transactions: ACID, concurrency control, locking, recovery",html:`
<svg viewBox="0 0 540 130" class="dia" role="img" aria-label="Transaction states">
<g font-size="11" fill="var(--ink)">
<rect x="6" y="44" width="92" height="38" rx="19" fill="var(--brand)" opacity=".18" stroke="var(--brand)"/><text x="52" y="68" text-anchor="middle">Active</text>
<rect x="150" y="10" width="150" height="34" rx="17" fill="var(--brand)" opacity=".2" stroke="var(--brand)"/><text x="225" y="32" text-anchor="middle">Partially committed</text>
<rect x="352" y="10" width="110" height="34" rx="17" fill="var(--brand)" opacity=".26" stroke="var(--brand)"/><text x="407" y="32" text-anchor="middle">Committed</text>
<rect x="150" y="86" width="110" height="34" rx="17" fill="var(--brand)" opacity=".16" stroke="var(--brand)"/><text x="205" y="108" text-anchor="middle">Failed</text>
<rect x="352" y="86" width="110" height="34" rx="17" fill="var(--brand)" opacity=".16" stroke="var(--brand)"/><text x="407" y="108" text-anchor="middle">Aborted</text>
<path d="M100 56 L146 34" stroke="var(--brand)" stroke-width="1.8" marker-end="url(#tx)"/>
<path d="M302 27 H348" stroke="var(--brand)" stroke-width="1.8" marker-end="url(#tx)"/>
<path d="M100 72 L146 96" stroke="var(--brand)" stroke-width="1.8" marker-end="url(#tx)"/>
<path d="M262 103 H348" stroke="var(--brand)" stroke-width="1.8" marker-end="url(#tx)"/>
<path d="M300 44 C 320 44, 320 70, 300 70" stroke="var(--brand)" stroke-width="1.4" fill="none" stroke-dasharray="3 3" marker-end="url(#tx)"/>
<text x="322" y="62" font-size="9" fill="var(--muted)">rollback</text>
<text x="470" y="30" font-size="9" fill="var(--muted)">log flushed</text>
<text x="470" y="108" font-size="9" fill="var(--muted)">undo log</text>
<defs><marker id="tx" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--brand)"/></marker></defs>
</g></svg>

<h4>ACID</h4>
<table class="tbl"><tr><th>Property</th><th>Guarantee</th><th>Broken by</th></tr>
<tr><td>Atomicity</td><td>All or nothing</td><td>Partial commit</td></tr>
<tr><td>Consistency</td><td>Constraints hold before and after</td><td>Invalid intermediate state</td></tr>
<tr><td>Isolation</td><td>Concurrent transactions do not interfere</td><td>Dirty read, lost update</td></tr>
<tr><td>Durability</td><td>Committed data survives a crash</td><td>Missing log flush</td></tr></table>
<h4>States</h4>
<p>Active &rarr; partially committed (last statement done) &rarr; committed (log flushed), or Active &rarr; failed &rarr; aborted (rolled back).</p>
<h4>Concurrency problems</h4>
<ul class="bul">
<li><b>Dirty read:</b> reading uncommitted data that may be rolled back.</li>
<li><b>Lost update:</b> two transactions overwrite each other's change.</li>
<li><b>Non-repeatable read:</b> the same row reads differently within one transaction.</li>
<li><b>Phantom read:</b> a re-run query returns new rows inserted by another transaction.</li>
</ul>
<h4>Locking and serialisability</h4>
<ul class="bul">
<li>Shared (S) lock for reading, exclusive (X) lock for writing.</li>
<li><b>2PL:</b> growing phase acquires all locks, shrinking phase releases them &rarr; conflict serialisable, but can deadlock.</li>
<li><b>Strict 2PL</b> holds X locks until commit &rarr; prevents cascading rollback.</li>
<li><b>Precedence graph:</b> a cycle means not conflict serialisable.</li>
<li><b>Timestamp ordering</b> is deadlock free but may starve; <b>MVCC</b> lets readers avoid blocking writers.</li>
</ul>
<h4>Recovery</h4>
<ul class="bul">
<li><b>Log records:</b> start, write, commit, abort. Undo uncommitted, redo committed.</li>
<li><b>Checkpoint:</b> all committed updates are on disk, so recovery starts from there.</li>
<li><b>Shadow paging:</b> keep a shadow page table and switch atomically at commit.</li>
</ul>
<div class="mn"><b>Deadlock handling in DBMS:</b> wait-for graph cycle detection, or a timeout, with a victim transaction rolled back.</div>`}
]});
