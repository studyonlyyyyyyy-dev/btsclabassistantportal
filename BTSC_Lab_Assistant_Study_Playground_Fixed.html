 n)","O(n)","O(n²)"],"a":0,"e":"Each element is moved at most once between the stacks, so the amortised cost per operation is constant."},{"u":3,"d":"m","q":"The load factor of a hash table is defined as:","o":["Number of keys divided by table size","Table size divided by number of keys","Number of collisions divided by probes","Number of buckets divided by chains"],"a":0,"e":"Load factor alpha = n/m; higher alpha means more collisions and slower operations."},{"u":3,"d":"m","q":"Searching in a skewed binary search tree with n nodes takes, in the worst case:","o":["O(1)","O(log n)","O(n)","O(n log n)"],"a":2,"e":"A degenerate chain behaves like a linked list, so the search is linear; balanced trees restore O(log n)."},{"u":3,"d":"m","q":"The balance factor of a node in an AVL tree is:","o":["Height of left subtree minus height of right subtree","Number of nodes in the left subtree","Depth of the node from the root","Difference between key and its parent key"],"a":0,"e":"For every AVL node the balance factor must be -1, 0 or +1."},{"u":3,"d":"m","q":"Which traversal uses a queue as its auxiliary data structure?","o":["Preorder traversal of a binary tree","Inorder traversal of a binary search tree","Postorder traversal of a binary tree","Breadth first search"],"a":3,"e":"BFS enqueues neighbours and dequeues them level by level; DFS uses a stack."},{"u":3,"d":"m","q":"In an array-based binary heap, the parent of the element at index i (i > 0) is at:","o":["(i-1)/2","i/2 + 1","2i","2i + 1"],"a":0,"e":"Children of index i are 2i+1 and 2i+2, so the parent is floor((i-1)/2)."},{"u":3,"d":"m","q":"Which is an advantage of a doubly linked list over a singly linked list?","o":["Backward traversal is possible in O(1) per step","It uses less memory per node than a singly linked list","It allows direct random access to any node by index","It never needs null pointers at either end of the list"],"a":0,"e":"The prev pointer allows traversal in both directions, at the cost of one extra pointer per node."},{"u":3,"d":"m","q":"The postfix expression for the infix expression (A + B) * (C - D) is:","o":["A B + C D - *","A B C D + - *","A B + C D * -","A B C + D - *"],"a":0,"e":"Parenthesised sub-expressions convert to A B + and C D -, then the * operator follows both."},{"u":3,"d":"m","q":"Which sorting algorithm is stable and has O(n log n) worst-case time but O(n) extra space?","o":["Merge sort","Quicksort","Heap sort","Selection sort"],"a":0,"e":"Merge sort preserves the relative order of equal keys and needs an auxiliary array."},{"u":3,"d":"h","q":"The number of distinct binary search trees that can be formed with 4 distinct keys is:","o":["14","8","16","24"],"a":0,"e":"The count is the Catalan number C4 = (2x4)!/(5!x4!) = 14."},{"u":3,"d":"h","q":"The minimum number of nodes in an AVL tree of height 3 (height measured in edges) is:","o":["7","8","6","15"],"a":0,"e":"Using N(h) = N(h-1) + N(h-2) + 1 with N(0)=1 and N(1)=2 gives N(2)=4 and N(3)=7."},{"u":3,"d":"h","q":"Building a heap from an unsorted array of n elements takes:","o":["O(n)","O(n log n)","O(log n)","O(n²)"],"a":0,"e":"Floyd's bottom-up heapify runs in linear time because most nodes are near the leaves."},{"u":3,"d":"h","q":"For the recurrence T(n) = 2T(n/2) + n, the solution is:","o":["O(n log n)","O(n)","O(n²)","O(log n)"],"a":0,"e":"By the master theorem with a = 2, b = 2 and f(n) = n, the solution is Θ(n log n)."},{"u":3,"d":"h","q":"The maximum number of swaps performed by selection sort on n elements is:","o":["n-1","n","n(n-1)/2","n log n"],"a":0,"e":"Each pass performs at most one swap, and there are n-1 passes."},{"u":3,"d":"h","q":"The worst-case number of comparisons in binary search on n = 2ᵏ − 1 elements is:","o":["k","k-1","2k","n/2"],"a":0,"e":"The search space halves each time until one element remains, giving exactly k = log2(n+1) comparisons."},{"u":3,"d":"h","q":"The infix form of the postfix expression A B C * + D - is:","o":["A + B * C - D","A + B * (C - D)","(A + B) * C - D","A * B + C - D"],"a":0,"e":"B C * becomes B*C, A B C * + becomes A + B*C, and subtracting D gives (A + B*C) - D."},{"u":3,"d":"h","q":"Dijkstra's shortest path algorithm with a binary heap runs in:","o":["O((V + E) log V)","O(V² E)","O(E log E)","O(V³)"],"a":0,"e":"Each edge relaxation may cost a heap update of O(log V), and the matrix version costs O(V²)."},{"u":3,"d":"h","q":"Topological sorting is possible only for:","o":["Directed acyclic graphs","Undirected graphs","Complete graphs","Graphs with cycles"],"a":0,"e":"A cycle creates a circular dependency, so no linear ordering of vertices can exist."},{"u":3,"d":"h","q":"By Cayley's formula, the number of spanning trees of the complete graph K4 is:","o":["16","8","12","24"],"a":0,"e":"nⁿ⁻² = 4² = 16 spanning trees."},{"u":3,"d":"h","q":"Linear probing in open addressing suffers mainly from:","o":["Primary clustering","Secondary clustering","Unbounded chains","Infinite recursion"],"a":0,"e":"Consecutive occupied slots merge into long runs, which increases probe lengths; quadratic probing reduces this."},{"u":3,"d":"h","q":"Which structure is best suited for prefix-based autocomplete search?","o":["Trie","Min heap","Circular queue","Adjacency list"],"a":0,"e":"A trie stores keys character by character, so a prefix walk reaches all completions quickly."},{"u":3,"d":"h","q":"The maximum depth of recursion in merge sort on n elements is:","o":["log2 n","n","n log n","sqrt(n)"],"a":0,"e":"The array is halved at each level, so there are about log2 n nested calls."},{"u":3,"d":"h","q":"Appending to a dynamic array that doubles its capacity has an amortised cost of:","o":["O(1)","O(log n)","O(n)","O(n²)"],"a":0,"e":"The occasional O(n) copy is spread over n insertions, so the average per insertion is constant."},{"u":3,"d":"h","q":"In a min-heap of 7 distinct elements, the second smallest element must be at:","o":["Index 1 or index 2","Index 7","The last index","Index 3 or 4"],"a":0,"e":"Only the two children of the root can be the next smallest, since every other node has a larger ancestor."},{"u":3,"d":"h","q":"The average-case time complexity of quicksort is:","o":["O(n log n)","O(n)","O(n²)","O(log n)"],"a":0,"e":"Random pivots give balanced partitions on average, so the recursion depth is about log n with linear work per level."},{"u":3,"d":"h","q":"A preorder traversal of an expression tree yields the:","o":["Prefix expression","Infix expression","Postfix expression","Reverse polish form"],"a":0,"e":"Root-operator-first traversal produces prefix (Polish) notation; postorder yields postfix."},{"u":3,"d":"h","q":"The maximum number of nodes at level k of a binary tree (root at level 0) is:","o":["2ᵏ","2k","2ᵏ⁺¹ − 1","k²"],"a":0,"e":"Each node has at most two children, so the level count doubles each time."},{"u":3,"d":"h","q":"The minimum number of edges required to make a graph with n vertices connected is:","o":["n-1","n","n+1","n(n-1)/2"],"a":0,"e":"A connected graph needs at least a spanning tree, which has exactly n-1 edges."},{"u":3,"d":"h","q":"The number of distinct permutations of the push sequence 1,2,3 that are obtainable from a stack is:","o":["5","6","4","3"],"a":0,"e":"It is the Catalan number C3 = 5; the only impossible output order is 3,1,2."},{"u":4,"d":"e","q":"SQL stands for:","o":["Structured Query Language","Sequential Query Language","Standard Query Logic","Structured Question Language"],"a":0,"e":"SQL is the standard Structured Query Language for relational databases."},{"u":4,"d":"e","q":"Which SQL command is used to retrieve data from a table?","o":["INSERT","SELECT","UPDATE","ALTER"],"a":1,"e":"SELECT is the DML statement that returns a result set without modifying data."},{"u":4,"d":"e","q":"A primary key of a relation can:","o":["Contain NULL values","Never contain NULL values","Contain duplicate values","Have at most two attributes"],"a":1,"e":"Entity integrity requires every primary key attribute to be NOT NULL and unique."},{"u":4,"d":"e","q":"Which of the following is a DDL command?","o":["CREATE","INSERT","UPDATE","DELETE"],"a":0,"e":"DDL statements such as CREATE, ALTER and DROP define or change schema objects."},{"u":4,"d":"e","q":"In ACID properties, the A stands for:","o":["Availability","Atomicity","Authentication","Aggregation"],"a":1,"e":"Atomicity means a transaction is executed completely or not at all."},{"u":4,"d":"e","q":"Which SQL clause is used to filter rows?","o":["GROUP BY","HAVING","WHERE","ORDER BY"],"a":2,"e":"WHERE filters individual rows before grouping; HAVING filters groups after aggregation."},{"u":4,"d":"e","q":"In an ER diagram, an entity set is represented by a:","o":["Rectangle","Ellipse","Diamond","Triangle"],"a":0,"e":"Rectangles denote entities, ellipses attributes, diamonds relationships and double rectangles weak entities."},{"u":4,"d":"e","q":"First Normal Form requires that:","o":["Every attribute holds atomic values","There is no transitive dependency","Every determinant is a candidate key","All tables are joined"],"a":0,"e":"1NF forbids multivalued or composite attributes in a single cell."},{"u":4,"d":"e","q":"Which SQL command removes a table along with its structure?","o":["DELETE","TRUNCATE","DROP","REMOVE"],"a":2,"e":"DROP TABLE deletes the definition, data, indexes and constraints; DELETE and TRUNCATE keep the table."},{"u":4,"d":"e","q":"Which aggregate function counts the number of rows?","o":["SUM()","COUNT()","AVG()","MAX()"],"a":1,"e":"COUNT(*) counts all rows; COUNT(column) ignores NULL values in that column."},{"u":4,"d":"e","q":"A foreign key in a table references:","o":["A primary key of another (or the same) table","Only the first column of the table","An index name","A view definition"],"a":0,"e":"The foreign key enforces referential integrity by pointing to a candidate key value."},{"u":4,"d":"e","q":"In relational algebra, the select (restriction) operation is denoted by:","o":["Pi","Sigma","Rho","Join symbol"],"a":1,"e":"Sigma selects rows satisfying a predicate; Pi projects specified columns."},{"u":4,"d":"e","q":"The number of attributes in a relation is called its:","o":["Cardinality","Degree","Domain","Schema"],"a":1,"e":"Degree = number of columns; cardinality = number of tuples."},{"u":4,"d":"e","q":"The DISTINCT keyword in SQL is used to:","o":["Remove duplicate rows from the result","Sort the result set in ascending order by default","Rename a column in the output of the query","Filter out rows in which any column holds a NULL"],"a":0,"e":"SELECT DISTINCT returns each combination of selected values only once."},{"u":4,"d":"e","q":"Which statement removes all rows from a table but keeps its structure?","o":["DROP TABLE","ALTER TABLE","DELETE FROM table","RENAME TABLE"],"a":2,"e":"DELETE FROM removes rows only; DROP removes the table itself."},{"u":4,"d":"e","q":"Which of the following is NOT a DML statement?","o":["INSERT","UPDATE","DELETE","ALTER"],"a":3,"e":"ALTER changes the schema and is a DDL statement, not data manipulation."},{"u":4,"d":"e","q":"A JOIN in SQL is used to:","o":["Combine rows from two or more tables based on a condition","Sort the rows of a single table by one or more columns","Delete duplicate rows that exist inside one table","Create an index on the join column of a table"],"a":0,"e":"Joins match related rows across tables using a join condition, usually key equality."},{"u":4,"d":"e","q":"Which statement permanently saves the changes of a transaction?","o":["ROLLBACK","COMMIT","SAVEPOINT","UNDO"],"a":1,"e":"COMMIT makes all changes of the transaction durable; ROLLBACK undoes them."},{"u":4,"d":"e","q":"To test whether a column value is NULL, SQL uses:","o":["= NULL","IS NULL","== NULL","NULL()"],"a":1,"e":"NULL is unknown, so comparisons with = return UNKNOWN; IS NULL must be used."},{"u":4,"d":"e","q":"Which normal form eliminates partial dependency?","o":["1NF","2NF","3NF","BCNF"],"a":1,"e":"2NF requires the relation to be in 1NF and every non-key attribute to be fully dependent on the whole candidate key."},{"u":4,"d":"m","q":"Table marks contains 50, 60, NULL and 70. SELECT AVG(marks), COUNT(marks) returns:","o":["60 and 3","45 and 4","60 and 4","52.5 and 3"],"a":0,"e":"Aggregates ignore NULL, so AVG = 180/3 = 60 and COUNT(marks) = 3."},{"u":4,"d":"m","q":"R(A,B,C,D) has the FDs AB to C, C to D and D to A. How many candidate keys does R have?","o":["2","3","4","1"],"a":1,"e":"AB, BC and BD all determine every attribute, and no proper subset does, so there are three candidate keys."},{"u":4,"d":"m","q":"Third Normal Form removes:","o":["Multivalued attributes","Partial dependencies","Transitive dependencies","Join dependencies"],"a":2,"e":"3NF requires 2NF plus no non-key attribute determining another non-key attribute."},{"u":4,"d":"m","q":"A relation is in BCNF if:","o":["Every determinant is a candidate key","It has no NULL values","Every attribute is atomic only","It has exactly one key"],"a":0,"e":"BCNF strengthens 3NF by demanding that the left side of every non-trivial FD be a superkey."},{"u":4,"d":"m","q":"Which clause is used to filter groups formed by GROUP BY?","o":["WHERE","HAVING","ORDER BY","LIMIT"],"a":1,"e":"HAVING is evaluated after grouping and may contain aggregate functions."},{"u":4,"d":"m","q":"R has 3 tuples and S has 4 tuples. The Cartesian product R x S contains:","o":["7 tuples","12 tuples","1 tuple","4 tuples"],"a":1,"e":"The cross product pairs every tuple of R with every tuple of S: 3 x 4 = 12."},{"u":4,"d":"m","q":"In relational algebra, the projection operator:","o":["Selects specified columns and removes duplicates","Selects rows that satisfy a given predicate","Combines two relations on a common attribute","Renames the attributes of a relation"],"a":0,"e":"Pi keeps only the listed attributes and, being set based, eliminates duplicate tuples."},{"u":4,"d":"m","q":"Which query correctly finds the second highest salary in emp?","o":["SELECT MAX(salary) FROM emp WHERE salary \u003c (SELECT MAX(salary) FROM emp)","SELECT salary FROM emp ORDER BY salary ASC LIMIT 1","SELECT salary FROM emp WHERE salary = (SELECT MAX(salary) FROM emp)","SELECT DISTINCT salary FROM emp GROUP BY salary ORDER BY 1"],"a":0,"e":"The inner query finds the maximum, and the outer query finds the largest value below it."},{"u":4,"d":"m","q":"In an ER diagram, a weak entity set is shown by a:","o":["Double rectangle","Single ellipse","Diamond","Dashed ellipse"],"a":0,"e":"Weak entities have no key of their own and are drawn with a double rectangle, linked by a double diamond."},{"u":4,"d":"m","q":"Which is a domain integrity constraint?","o":["A column value must be of the declared data type and range","A foreign key value must exist in the referenced table","A primary key value must be unique and never NULL","A view must be updatable by the underlying tables"],"a":0,"e":"Domain constraints restrict the values an attribute may take, including type, range and CHECK conditions."},{"u":4,"d":"m","q":"The correct order of transaction states is:","o":["Active, partially committed, committed","Active, committed, partially committed","Partially committed, active, committed","Committed, active, partially committed"],"a":0,"e":"A transaction moves from active to partially committed after its last statement and to committed after the log is flushed."},{"u":4,"d":"m","q":"In two-phase locking, the two phases are:","o":["Growing (acquiring locks) and shrinking (releasing locks)","Reading (shared locks) and writing (exclusive locks)","Committing (flushing logs) and aborting (undoing work)","Beginning (allocating a TID) and ending (freeing it)"],"a":0,"e":"2PL requires all locks to be acquired before any is released, which guarantees conflict serializability."},{"u":4,"d":"m","q":"A view in SQL is:","o":["A virtual table derived from a query","A physical copy of a table stored on disk","An index structure built on one or more columns","A stored procedure that returns a result set"],"a":0,"e":"A view stores only its definition; rows are computed when the view is queried."},{"u":4,"d":"m","q":"A functional dependency X to Y is called trivial if:","o":["Y is a subset of X","X is a subset of Y","X and Y are disjoint","Y is NULL"],"a":0,"e":"If Y is already contained in X the dependency adds no new information."},{"u":4,"d":"m","q":"The default sort order of ORDER BY in SQL is:","o":["Ascending","Descending","Random","Order of insertion"],"a":0,"e":"ORDER BY col is ascending; DESC must be written explicitly for descending order."},{"u":4,"d":"m","q":"The number of tuples in a relation is called its:","o":["Degree","Cardinality","Domain","Arity"],"a":1,"e":"Cardinality counts rows, while degree counts columns."},{"u":4,"d":"m","q":"Which normal form deals with multivalued dependencies?","o":["2NF","3NF","4NF","5NF"],"a":2,"e":"4NF requires the relation to be in BCNF and free of non-trivial multivalued dependencies."},{"u":4,"d":"m","q":"Which SQL statement adds a new row to a table?","o":["INSERT INTO table VALUES (...)","UPDATE table SET ...","ALTER TABLE table ADD ...","CREATE ROW ..."],"a":0,"e":"INSERT adds tuples; UPDATE changes existing ones and ALTER changes structure."},{"u":4,"d":"h","q":"R(A,B) has the FD A to B. The number of superkeys of R is:","o":["1","2","3","4"],"a":0,"e":"AB is the only candidate key, so its only superkey is AB itself, giving one superkey."},{"u":4,"d":"h","q":"R(A,B) = {(1,x),(2,y),(3,z)} and S(B,C) = {(x,p),(x,q),(y,r)}. The number of tuples in the natural join R join S is:","o":["3","4","5","6"],"a":0,"e":"(1,x) matches two S tuples, (2,y) matches one and (3,z) matches none, giving three result tuples."},{"u":4,"d":"m","q":"Which key can accept NULL values but still uniquely identifies rows when present?","o":["Unique key","Primary key","Foreign key","Super key"],"a":0,"e":"A UNIQUE constraint allows NULLs (in most DBMSs) while a primary key forbids them entirely."},{"u":4,"d":"m","q":"The SQL statement to remove all rows from emp and free the space is:","o":["TRUNCATE TABLE emp","DELETE FROM emp WHERE 1=0","DROP COLUMN emp","ALTER TABLE emp"],"a":0,"e":"TRUNCATE deallocates pages and resets the table, unlike row-by-row DELETE."},{"u":4,"d":"h","q":"Which anomaly is prevented by strict two-phase locking?","o":["Lost update due to dirty reads","Phantom reads only","Deadlock","Cascading rollback"],"a":3,"e":"Holding exclusive locks until commit prevents other transactions from reading uncommitted data, so cascading rollback cannot occur."},{"u":4,"d":"h","q":"A schedule is conflict serializable if its precedence graph:","o":["Has no cycle","Is connected","Is a tree","Has exactly one cycle"],"a":0,"e":"A cycle indicates conflicting operations in both directions, so no equivalent serial order exists."},{"u":4,"d":"h","q":"In a LEFT OUTER JOIN where a left row has no matching right row, the right-side columns contain:","o":["NULL","Zero","The previous row values","An error is raised"],"a":0,"e":"Outer joins pad the non-matching side with NULLs to preserve the unmatched rows."},{"u":4,"d":"h","q":"Which operation is NOT expressible in basic relational algebra without aggregation?","o":["Selecting rows that satisfy a predicate","Projecting a subset of the columns","Computing COUNT of tuples","Joining two relations naturally"],"a":2,"e":"Basic relational algebra is set based; aggregate functions require the extended aggregate operator."},{"u":4,"d":"h","q":"In the wait-for graph used for deadlock detection, a cycle indicates:","o":["A deadlock exists","A transaction has committed","A lock is free","A serial schedule"],"a":0,"e":"If T1 waits for T2 and T2 waits for T1, neither can proceed, so a cycle means deadlock."},{"u":4,"d":"h","q":"A checkpoint in a DBMS log helps recovery by:","o":["Restricting the portion of the log that must be scanned","Compressing the database files after every transaction","Removing all indexes so that queries run faster","Deleting old transactions permanently from the catalog"],"a":0,"e":"At a checkpoint all committed updates are on disk, so redo/undo work starts from the checkpoint."},{"u":4,"d":"h","q":"Which statement about HAVING and WHERE is correct?","o":["WHERE filters rows before grouping, HAVING filters groups after aggregation","HAVING filters rows before grouping, WHERE filters groups afterwards","Both clauses are interchangeable in every SQL query","WHERE can contain aggregate functions but HAVING cannot"],"a":0,"e":"Aggregates are not allowed in WHERE because grouping has not happened yet."},{"u":4,"d":"h","q":"The closure of the attribute set {A} under the FDs A to B, B to C is:","o":["{A,B,C}","{A,B}","{A}","{A,C}"],"a":0,"e":"A determines B and B determines C, so the closure includes all three attributes."},{"u":4,"d":"h","q":"The main practical advantage of BCNF over 3NF is that BCNF:","o":["Removes redundancy from every functional dependency","Always preserves every functional dependency of the schema","Never requires the relation to be decomposed at all","Allows NULL values inside the candidate keys of a relation"],"a":0,"e":"BCNF removes all FD-based redundancy, though decomposition may lose some dependencies - a trade-off with 3NF."},{"u":4,"d":"h","q":"Which SQL statement correctly updates only employees in the HR department?","o":["UPDATE emp SET salary = salary * 1.1 WHERE dept = 'HR'","UPDATE emp WHERE dept = 'HR' SET salary = salary * 1.1","UPDATE emp SET dept = 'HR'","SELECT * FROM emp WHERE dept = 'HR'"],"a":0,"e":"The SET clause must precede WHERE, and WHERE restricts the affected rows."},{"u":4,"d":"h","q":"In a table where a GROUP BY column contains NULLs, SQL treats all NULLs as:","o":["One single group","Separate groups","Ignored rows","An error"],"a":0,"e":"Grouping treats NULLs as equal for the purpose of forming groups."},{"u":4,"d":"h","q":"A relation with 4 attributes and one candidate key of 2 attributes, decomposed into BCNF, may result in a maximum of:","o":["Two relations","One relation","Four relations","Eight relations"],"a":0,"e":"The violating dependency splits the relation into at most two relations, which are then checked recursively."},{"u":4,"d":"h","q":"Which query lists employees whose department is not present in the dept table?","o":["SELECT * FROM emp WHERE dept NOT IN (SELECT dname FROM dept)","SELECT * FROM emp WHERE dept IN (SELECT dname FROM dept)","SELECT * FROM emp JOIN dept ON emp.dept = dept.dname","SELECT dept FROM emp"],"a":0,"e":"NOT IN with a subquery returns rows whose key is absent from the referenced set."},{"u":4,"d":"h","q":"A B+ tree index is preferred in databases because:","o":["All keys are in leaf nodes linked for range scans","It uses far less memory than a simple hash index","It removes the need for any disk access at all","It stores every row directly inside the root node"],"a":0,"e":"B+ trees keep data pointers in linked leaves, giving efficient range queries and logarithmic search."},{"u":4,"d":"h","q":"A trigger in SQL is:","o":["A procedure executed automatically on a specified event","A user-defined view stored permanently in the catalog","A special type of index maintained by the optimizer","A saved join that the database reuses for queries"],"a":0,"e":"Triggers fire on INSERT, UPDATE or DELETE events and are used for auditing and enforcing rules."},{"u":4,"d":"h","q":"Which property is violated if a transaction reads uncommitted data of another transaction?","o":["Isolation","Atomicity","Durability","Consistency"],"a":0,"e":"This is a dirty read, which breaks isolation; it can be prevented by avoiding read-uncommitted isolation levels."},{"u":4,"d":"h","q":"In a relation with 3 attributes, the maximum number of possible superkeys when all attributes together form the only candidate key is:","o":["1","3","7","8"],"a":0,"e":"If ABC is the only candidate key, only ABC itself contains it, so there is exactly one superkey."},{"u":4,"d":"h","q":"The degree of the relation produced by R(A,B) natural join S(B,C) is:","o":["3","4","2","1"],"a":0,"e":"The common attribute B appears once, so the result has A, B and C: degree 3."},{"u":5,"d":"e","q":"A network covering a single office building is classified as a:","o":["LAN","WAN","MAN","PAN"],"a":0,"e":"A LAN spans a limited area such as a room, building or campus and is usually owned privately."},{"u":5,"d":"e","q":"An IPv4 address is how many bits long?","o":["32","48","64","128"],"a":0,"e":"IPv4 uses 32 bits written as four dotted decimal octets; IPv6 uses 128 bits."},{"u":5,"d":"e","q":"An IPv6 address is how many bits long?","o":["32","64","128","256"],"a":2,"e":"IPv6 uses 128-bit addresses written as eight groups of four hexadecimal digits."},{"u":5,"d":"e","q":"Which device forwards packets between different networks?","o":["Hub","Switch","Router","Repeater"],"a":2,"e":"A router examines the destination IP address and forwards packets between networks."},{"u":5,"d":"e","q":"A hub operates at which OSI layer?","o":["Physical","Data link","Network","Transport"],"a":0,"e":"A hub simply repeats electrical signals to all ports, which is physical-layer behaviour."},{"u":5,"d":"e","q":"A switch operates at which OSI layer?","o":["Physical","Data link","Network","Session"],"a":1,"e":"A switch forwards frames using MAC addresses, which is the data link layer."},{"u":5,"d":"e","q":"The default port number for HTTP is:","o":["80","443","21","25"],"a":0,"e":"HTTP uses TCP port 80; HTTPS uses 443."},{"u":5,"d":"e","q":"The default port number for HTTPS is:","o":["80","8080","443","22"],"a":2,"e":"HTTPS runs over TLS on TCP port 443."},{"u":5,"d":"e","q":"DNS is used to:","o":["Translate domain names into IP addresses","Assign IP addresses dynamically","Encrypt web traffic","Route packets between networks"],"a":0,"e":"DNS is the domain name system that resolves names such as example.com into IP addresses."},{"u":5,"d":"e","q":"Which transport protocol is connection-oriented and reliable?","o":["UDP","TCP","ICMP","ARP"],"a":1,"e":"TCP performs a handshake, sequences data and retransmits lost segments."},{"u":5,"d":"e","q":"The default subnet mask of a class C address is:","o":["255.0.0.0","255.255.0.0","255.255.255.0","255.255.255.128"],"a":2,"e":"Class C uses 24 network bits, so the mask is 255.255.255.0 or /24."},{"u":5,"d":"e","q":"The loopback address in IPv4 is:","o":["127.0.0.1","0.0.0.0","255.255.255.255","192.168.0.1"],"a":0,"e":"The entire 127.0.0.0/8 range is reserved for loopback, with 127.0.0.1 used most often."},{"u":5,"d":"e","q":"FTP uses which port by default for control?","o":["20","21","23","25"],"a":1,"e":"FTP control uses TCP 21 and data uses TCP 20 in active mode."},{"u":5,"d":"e","q":"SMTP is used for:","o":["Sending e-mail","Downloading e-mail","File transfer","Name resolution"],"a":0,"e":"SMTP pushes mail from client to server and between servers; IMAP and POP3 retrieve it."},{"u":5,"d":"e","q":"The OSI reference model has how many layers?","o":["4","5","7","8"],"a":2,"e":"OSI has seven layers from Physical up to Application."},{"u":5,"d":"e","q":"Routing of packets between networks happens at the:","o":["Data link layer","Network layer","Transport layer","Session layer"],"a":1,"e":"Layer 3 handles logical addressing and path selection."},{"u":5,"d":"e","q":"A MAC address is how many bits long?","o":["32","48","64","128"],"a":1,"e":"MAC addresses are 48 bits, usually written as six hexadecimal pairs."},{"u":5,"d":"e","q":"Wi-Fi is specified by the IEEE standard:","o":["802.3","802.11","802.15","802.16"],"a":1,"e":"802.11 is wireless LAN; 802.3 is Ethernet and 802.15.1 is Bluetooth."},{"u":5,"d":"e","q":"Bluetooth is best described as a:","o":["Wireless personal area network","Wide area network","Metropolitan area network","Satellite network"],"a":0,"e":"Bluetooth connects devices within about 10 metres, forming a personal area network."},{"u":5,"d":"e","q":"Which of the following is a private IPv4 address?","o":["192.168.1.10","8.8.8.8","203.0.113.5","172.32.0.1"],"a":0,"e":"192.168.0.0/16 is one of the three private ranges, along with 10.0.0.0/8 and 172.16.0.0/12."},{"u":5,"d":"m","q":"A /26 subnet provides how many usable host addresses?","o":["62","64","30","126"],"a":0,"e":"/26 leaves 6 host bits: 64 addresses minus network and broadcast gives 62 usable."},{"u":5,"d":"m","q":"Subnetting a /24 network into /27 subnets produces how many subnets?","o":["4","8","16","32"],"a":1,"e":"Three borrowed bits give 2³ = 8 subnets of 32 addresses each."},{"u":5,"d":"m","q":"Encryption, compression and character encoding are functions of the:","o":["Session layer","Presentation layer","Application layer","Transport layer"],"a":1,"e":"Layer 6 translates data formats and performs encryption and compression."},{"u":5,"d":"m","q":"Which transport protocol is normally used for DNS queries?","o":["UDP","TCP","ICMP","FTP"],"a":0,"e":"DNS uses UDP port 53 for small queries because the overhead of a TCP handshake is unnecessary."},{"u":5,"d":"m","q":"The port number used by DNS is:","o":["53","25","69","110"],"a":0,"e":"DNS listens on port 53 for both UDP and TCP."},{"u":5,"d":"m","q":"DHCP is used to:","o":["Assign IP configuration automatically","Resolve host names into IP addresses for clients","Encrypt the session between a client and a server","Synchronise the clocks of all hosts on the network"],"a":0,"e":"DHCP hands out IP address, mask, gateway and DNS server to clients dynamically."},{"u":5,"d":"m","q":"The default subnet mask of a class B address is:","o":["255.0.0.0","255.255.0.0","255.255.255.0","255.255.255.240"],"a":1,"e":"Class B uses 16 network bits, giving the mask 255.255.0.0."},{"u":5,"d":"m","q":"The network address of 192.168.10.50/26 is:","o":["192.168.10.0","192.168.10.32","192.168.10.48","192.168.10.64"],"a":0,"e":"A /26 block is 64 addresses, so 50 falls in the 0-63 block: network 192.168.10.0."},{"u":5,"d":"m","q":"The directed broadcast address of 192.168.1.0/24 is:","o":["192.168.1.255","192.168.1.0","192.168.1.1","192.168.0.255"],"a":0,"e":"The broadcast is the highest address in the block, with all host bits set to 1."},{"u":5,"d":"m","q":"Which device regenerates and amplifies a weakened signal?","o":["Repeater","Router","Bridge","Gateway"],"a":0,"e":"A repeater works at the physical layer to extend cable distance."},{"u":5,"d":"m","q":"A /30 subnet provides how many usable host addresses?","o":["2","4","6","1"],"a":0,"e":"Four addresses minus network and broadcast leaves 2, which is why /30 is used on point-to-point links."},{"u":5,"d":"m","q":"ARP is used to map:","o":["IP address to MAC address","MAC address to IP address","Domain name to IP address","Port to process"],"a":0,"e":"ARP broadcasts a request asking which MAC owns a given IPv4 address; RARP does the reverse."},{"u":5,"d":"m","q":"Which feature of TCP ensures reliable delivery?","o":["Acknowledgements and retransmission","Best-effort forwarding without any acknowledgement","Broadcast addressing to every host on the subnet","Port multiplexing across the application processes"],"a":0,"e":"Sequence numbers and ACKs let the sender detect loss and retransmit."},{"u":5,"d":"m","q":"5G networks are designed mainly to provide:","o":["High data rate with low latency","Only voice calls over the circuit switched network","Coverage limited to a single building or campus","Wired access to replace the existing LAN cables"],"a":0,"e":"5G targets enhanced mobile broadband, ultra-reliable low latency and massive machine-type communication."},{"u":5,"d":"m","q":"The HTTP status code 404 means:","o":["Not Found","Internal Server Error","Unauthorised","Moved Permanently"],"a":0,"e":"404 indicates the requested resource does not exist on the server."},{"u":5,"d":"m","q":"Which of the following is an application layer protocol?","o":["SMTP","TCP","IP","Ethernet"],"a":0,"e":"SMTP, HTTP, FTP and DNS all operate at the application layer."},{"u":5,"d":"m","q":"The traceroute utility works mainly by using:","o":["ICMP time-exceeded messages","DNS queries sent to the root name servers","ARP broadcasts on the local network segment","FTP commands issued to each router in turn"],"a":0,"e":"It sends packets with increasing TTL values and records the routers that return ICMP time-exceeded."},{"u":5,"d":"m","q":"The subnet mask 255.255.255.224 corresponds to:","o":["/27","/26","/28","/25"],"a":0,"e":"224 is 11100000, i.e. three extra bits, so 24 + 3 = 27."},{"u":5,"d":"m","q":"Which physical topology connects all devices to a central device?","o":["Star","Ring","Bus","Mesh"],"a":0,"e":"In a star topology every node has a dedicated link to a central hub or switch."},{"u":5,"d":"m","q":"The minimum size of an IPv4 header is:","o":["20 bytes","16 bytes","24 bytes","40 bytes"],"a":0,"e":"The fixed part is 20 bytes; options may extend it up to 60 bytes."},{"u":5,"d":"h","q":"How many /20 subnets can be created from the 172.16.0.0/16 network?","o":["16","8","32","4"],"a":0,"e":"Four bits are borrowed (20 - 16), giving 2⁴ = 16 subnets."},{"u":5,"d":"h","q":"A subnet must support at least 500 hosts. The minimum number of host bits required is:","o":["9","8","10","7"],"a":0,"e":"2⁹ = 512 gives 510 usable addresses, which is the first size that covers 500."},{"u":5,"d":"h","q":"To create at least 1000 subnets from 10.0.0.0/8, the new prefix length must be:","o":["/18","/17","/16","/19"],"a":0,"e":"Ten bits give 1024 subnets, so 8 + 10 = 18 bits of prefix are required."},{"u":5,"d":"h","q":"The correct sequence of the TCP three-way handshake is:","o":["SYN, SYN-ACK, ACK","SYN, ACK, SYN-ACK","ACK, SYN, SYN-ACK","SYN-ACK, SYN, ACK"],"a":0,"e":"The client sends SYN, the server replies SYN-ACK and the client confirms with ACK."},{"u":5,"d":"h","q":"At the network layer, the protocol data unit is called a:","o":["Packet","Segment","Frame","Bit"],"a":0,"e":"Transport PDU is a segment, network PDU a packet, data link PDU a frame."},{"u":5,"d":"h","q":"The private address range 172.16.0.0/12 covers:","o":["172.16.0.0 to 172.31.255.255","172.16.0.0 to 172.16.255.255","172.0.0.0 to 172.255.255.255","172.16.0.0 to 172.24.255.255"],"a":0,"e":"The /12 mask covers the second octet from 16 to 31 inclusive."},{"u":5,"d":"h","q":"The broadcast address of the network 192.168.4.0/22 is:","o":["192.168.7.255","192.168.5.255","192.168.4.255","192.168.8.255"],"a":0,"e":"A /22 block covers 192.168.4.0 to 192.168.7.255, so the broadcast is 192.168.7.255."},{"u":5,"d":"h","q":"A sliding window protocol improves performance mainly by:","o":["Allowing multiple frames in flight before acknowledgement","Compressing the headers of every outgoing frame","Encrypting the payload of each frame before sending","Reducing the maximum frame size on the link"],"a":0,"e":"Pipelining keeps the link busy instead of waiting for an ACK after every frame."},{"u":5,"d":"h","q":"NAT allows:","o":["Many private hosts to share one public IP address","Two separate networks to merge into a single subnet","MAC addresses to be reused on different segments","DNS lookups to be bypassed entirely by clients"],"a":0,"e":"Network address translation rewrites private source addresses to a public address at the router."},{"u":5,"d":"h","q":"Which is a valid compressed form of the IPv6 address 2001:0db8:0000:0000:0000:0000:0000:0001?","o":["2001:db8::1","2001:db8:0:1","2001:db8:::1","2001:0db8::0001::"],"a":0,"e":"Leading zeros are dropped and one run of zero groups is replaced by ::, giving 2001:db8::1."},{"u":5,"d":"h","q":"An ARP request is sent as:","o":["A broadcast frame","A unicast frame to the router","A multicast frame to all routers","A TCP segment"],"a":0,"e":"The sender does not yet know the destination MAC, so it broadcasts the request on the local segment."},{"u":5,"d":"h","q":"Secure remote login to a Linux server is normally done with:","o":["SSH on port 22","Telnet on port 23","FTP on port 21","HTTP on port 80"],"a":0,"e":"SSH encrypts the session; Telnet sends everything including passwords in clear text."},{"u":5,"d":"h","q":"In the TCP/IP model, the network access layer corresponds to which OSI layers?","o":["Physical and data link","Network and transport","Session and presentation","Application only"],"a":0,"e":"TCP/IP has four layers; its lowest layer merges OSI layers 1 and 2."},{"u":5,"d":"h","q":"A typical Ethernet MTU of 1500 bytes refers to:","o":["The maximum payload size of a frame","The maximum cable length","The maximum number of hosts","The maximum TTL value"],"a":0,"e":"IP packets larger than the MTU must be fragmented or dropped."},{"u":5,"d":"h","q":"A /29 subnet provides how many usable host addresses?","o":["6","8","14","4"],"a":0,"e":"Eight addresses minus network and broadcast leaves six usable hosts."},{"u":5,"d":"h","q":"The address range 169.254.0.0/16 is used for:","o":["Link-local addressing when DHCP fails","Public internet hosts that need global reachability","Multicast streaming to a group of subscribed hosts","Loopback testing inside a single physical machine"],"a":0,"e":"APIPA assigns 169.254.x.x automatically when no DHCP server is reachable."},{"u":5,"d":"h","q":"Bluetooth devices connected in a small network form a:","o":["Piconet","Subnet","VLAN","Gateway"],"a":0,"e":"One master with up to seven active slaves forms a piconet; several piconets form a scatternet."},{"u":5,"d":"h","q":"Which DNS record type specifies the mail server for a domain?","o":["MX","A","CNAME","NS"],"a":0,"e":"MX records point to the mail exchangers for a domain; A records map names to IPv4 addresses."},{"u":5,"d":"h","q":"Which statement about the 200.1.2.0/25 network is correct?","o":["It has 126 usable hosts and broadcast 200.1.2.127","It has 254 usable hosts and broadcast 200.1.2.255","It has 62 usable hosts and broadcast 200.1.2.63","It has 128 usable hosts and broadcast 200.1.2.128"],"a":0,"e":"A /25 has 128 addresses; two are reserved, leaving 126 usable, with broadcast at .127."},{"u":5,"d":"h","q":"A host with address 192.168.1.130 and mask 255.255.255.192 belongs to which subnet?","o":["192.168.1.128/26","192.168.1.64/26","192.168.1.0/26","192.168.1.192/26"],"a":0,"e":"Blocks of 64 give ranges 0-63, 64-127 and 128-191, so 130 lies in 192.168.1.128/26."},{"u":6,"d":"e","q":"A malware program that attaches itself to a legitimate file and spreads when that file runs is a:","o":["Virus","Worm","Trojan","Rootkit"],"a":0,"e":"Viruses need a host file and user action to spread, unlike worms that self-replicate over networks."},{"u":6,"d":"e","q":"Which malware self-replicates across networks without any host program?","o":["Virus","Worm","Trojan","Spyware"],"a":1,"e":"A worm spreads by exploiting network services on its own, without attaching to a file."},{"u":6,"d":"e","q":"A trojan is best described as:","o":["Malicious code hidden inside apparently useful software","A program that copies itself across the network without help","A hardware fault that corrupts data on the disk","A firewall rule that blocks outgoing traffic silently"],"a":0,"e":"Trojans trick the user into installing them by posing as legitimate software."},{"u":6,"d":"e","q":"Phishing is an attack that:","o":["Tricks users into revealing credentials through fake messages","Floods a server with traffic until it stops responding","Encrypts the files of a user and demands a payment","Sniffs the packets travelling on an open Wi-Fi network"],"a":0,"e":"Phishing is social engineering, usually by e-mail or a cloned login page."},{"u":6,"d":"e","q":"DoS stands for:","o":["Denial of Service","Data over Secure","Distributed Open System","Dynamic Operating System"],"a":0,"e":"A DoS attack makes a service unavailable to legitimate users, often by exhausting resources."},{"u":6,"d":"e","q":"MD5 produces a hash of length:","o":["128 bits","160 bits","256 bits","512 bits"],"a":0,"e":"MD5 gives a 128-bit digest; it is considered broken for security use because of practical collisions."},{"u":6,"d":"e","q":"SHA-256 produces a hash of length:","o":["128 bits","160 bits","256 bits","512 bits"],"a":2,"e":"SHA-256 is part of SHA-2 and returns a 256-bit digest."},{"u":6,"d":"e","q":"Which of the following is a symmetric key algorithm?","o":["RSA","AES","ECC","Diffie-Hellman"],"a":1,"e":"AES uses the same key for encryption and decryption; RSA, ECC and DH are asymmetric."},{"u":6,"d":"e","q":"Which of the following is an asymmetric key algorithm?","o":["DES","AES","RSA","Blowfish"],"a":2,"e":"RSA uses a public and a private key pair based on the difficulty of factoring large numbers."},{"u":6,"d":"e","q":"A firewall primarily:","o":["Filters network traffic according to rules","Removes viruses from the files stored on the disk","Encrypts the entire hard disk of the host machine","Backs up the data of the server on a schedule"],"a":0,"e":"Firewalls inspect packets against allow or deny rules at network boundaries."},{"u":6,"d":"e","q":"Antivirus software mainly detects malware by:","o":["Matching known signatures and behaviour patterns","Changing the file permissions of suspicious programs","Encrypting the disk so that malware cannot read it","Blocking every download that comes from the internet"],"a":0,"e":"Signature matching plus heuristic and behavioural analysis is the standard approach."},{"u":6,"d":"e","q":"SSL/TLS is used mainly to:","o":["Encrypt data in transit and authenticate the server","Compress images before they are sent to the browser","Assign IP addresses to clients that join the network","Store user passwords in the database securely"],"a":0,"e":"TLS provides confidentiality and integrity for protocols such as HTTPS."},{"u":6,"d":"e","q":"A digital certificate is issued by a:","o":["Certificate Authority","Router on the local network segment","DNS server of the internet service provider","Web browser installed on the client machine"],"a":0,"e":"A trusted CA signs the certificate, binding a public key to an identity."},{"u":6,"d":"e","q":"Which is the strongest password among the following?","o":["T7#kL9@vQ2!m","password123","Anamika2019","qwertyuiop"],"a":0,"e":"Length plus a mix of upper case, lower case, digits and symbols gives the highest entropy."},{"u":6,"d":"e","q":"Two-factor authentication combines:","o":["Something you know with something you have","Two different passwords typed one after the other","A password with the username that goes with it","Two usernames registered on the same account"],"a":0,"e":"For example a password plus an OTP on a registered device counts as two independent factors."},{"u":6,"d":"e","q":"Ransomware typically:","o":["Encrypts user files and demands payment for the key","Slows down the CPU by running many hidden processes","Deletes the operating system silently without any message","Copies files to a remote server without encrypting them"],"a":0,"e":"Modern ransomware encrypts data and demands cryptocurrency for the decryption key."},{"u":6,"d":"e","q":"Which of the following is NOT malware?","o":["Firewall","Worm","Spyware","Keylogger"],"a":0,"e":"A firewall is a defensive control, not malicious software."},{"u":6,"d":"e","q":"HTTPS runs on which port by default?","o":["443","80","21","25"],"a":0,"e":"HTTPS uses TCP 443 with TLS encryption."},{"u":6,"d":"e","q":"In public key cryptography, the key that must be kept secret is the:","o":["Private key","Public key","Session key only","Hash key"],"a":0,"e":"The public key is distributed openly; the private key must never be shared."},{"u":6,"d":"e","q":"A digital signature mainly provides:","o":["Authentication and integrity","Confidentiality of the message body","Compression","Availability"],"a":0,"e":"Signing a hash with the private key lets anyone verify origin and detect tampering."},{"u":6,"d":"m","q":"A key property of a cryptographic hash function is that it is:","o":["One-way and collision resistant","Reversible with the key","Faster than any encryption","Able to compress files"],"a":0,"e":"Given the digest you cannot recover the input, and finding two inputs with the same digest must be infeasible."},{"u":6,"d":"m","q":"The output length of SHA-1 is:","o":["160 bits","128 bits","256 bits","512 bits"],"a":0,"e":"SHA-1 produces 160 bits; it is deprecated because collisions have been demonstrated."},{"u":6,"d":"m","q":"Using a Caesar cipher with shift 3, the plaintext CAT becomes:","o":["FDW","DBT","CAT","ZXY"],"a":0,"e":"Each letter moves three places forward: C to F, A to D and T to W."},{"u":6,"d":"m","q":"The main practical problem with symmetric encryption is:","o":["Secure distribution of the shared key","Its very slow speed when encrypting bulk data","The large size of the resulting ciphertext","It cannot encrypt plain text, only binary data"],"a":0,"e":"Both parties must share the same secret key safely, which is why hybrid schemes use asymmetric keys for exchange."},{"u":6,"d":"m","q":"PKI consists of a CA, registration authority, certificate repository and:","o":["Certificate revocation mechanism","Antivirus engine that scans the certificates","Packet sniffer placed in front of the CA server","Router that forwards certificate requests"],"a":0,"e":"Revocation lists or OCSP let clients check whether a certificate is still valid."},{"u":6,"d":"m","q":"In a man-in-the-middle attack, the attacker:","o":["Intercepts and possibly alters communication between two parties","Deletes the entire database of the target server at once","Physically steals the hard disk from the data centre","Sends bulk spam e-mail to thousands of recipients"],"a":0,"e":"The attacker relays traffic between victim and server while impersonating each side."},{"u":6,"d":"m","q":"The best defence against SQL injection is:","o":["Parameterised queries and prepared statements","Hiding the name of the database from the client","Using shorter table and column names in the schema","Disabling the browser cache on the login page"],"a":0,"e":"Binding user input as data, not SQL code, prevents it from changing the query structure."},{"u":6,"d":"m","q":"Cross-site scripting (XSS) allows an attacker to:","o":["Inject script that runs in another user's browser","Read the private key stored on the server's disk","Overwrite the kernel of the target operating system","Change the firmware of the network router directly"],"a":0,"e":"Unescaped user input is stored or reflected, and the victim's browser executes the script in the site's origin."},{"u":6,"d":"m","q":"A salt is added to a password hash to:","o":["Defeat precomputed rainbow tables","Compress the password","Encrypt the password reversibly","Make the hash shorter"],"a":0,"e":"A unique random salt per user makes precomputed tables useless, even for common passwords."},{"u":6,"d":"m","q":"Which measure best mitigates online password guessing?","o":["Account lockout after repeated failures","Using longer usernames that are hard to guess","Sharing one strong password across the team","Disabling HTTPS so that pages load faster"],"a":0,"e":"Rate limiting and lockouts make brute force impractical."},{"u":6,"d":"m","q":"A TCP SYN flood is an example of:","o":["A denial of service attack","A phishing attack","A buffer overflow","A privilege escalation"],"a":0,"e":"Half-open connections exhaust the server's backlog queue so genuine clients cannot connect."},{"u":6,"d":"m","q":"A VPN provides security by:","o":["Tunnelling and encrypting traffic over an untrusted network","Blocking all incoming packets at the network edge","Replacing DNS with a local hosts file on each host","Removing malware from the files that are downloaded"],"a":0,"e":"The VPN encrypts the payload between the client and the VPN gateway."},{"u":6,"d":"m","q":"Which protocol is the successor of SSL?","o":["TLS","SSH","IPSec","WEP"],"a":0,"e":"TLS 1.0 onwards replaced SSL 3.0; the term SSL is still used loosely for TLS."},{"u":6,"d":"m","q":"A digital signature is created using the sender's:","o":["Private key","Public key","Session key","Password hash"],"a":0,"e":"Signing with the private key means only the holder could have produced it, and anyone can verify with the public key."},{"u":6,"d":"m","q":"A digital certificate essentially binds:","o":["A public key to an identity","A private key to a password","An IP address to a MAC address","A domain to a port"],"a":0,"e":"The CA's signature attests that the public key belongs to the named subject."},{"u":6,"d":"m","q":"3DES applies DES three times, giving an effective key strength of about:","o":["112 bits","168 bits","56 bits","256 bits"],"a":0,"e":"Because of meet-in-the-middle attacks, three-key 3DES offers about 112 bits of security."},{"u":6,"d":"m","q":"An attacker who steals a valid session cookie is performing:","o":["Session hijacking","SQL injection","Privilege escalation","Port scanning"],"a":0,"e":"Possession of the session token lets the attacker act as the logged-in user."},{"u":6,"d":"m","q":"A zero-day vulnerability is one that:","o":["Is exploited before a patch exists","Was patched yesterday","Affects only old software","Cannot be exploited remotely"],"a":0,"e":"Defenders have no fix and often no signature when the exploit first appears."},{"u":6,"d":"m","q":"The principle of least privilege means:","o":["Users get only the access needed for their task","All users are made administrators to avoid delays","Passwords are shared so that anyone can log in","Audit logs are disabled to improve performance"],"a":0,"e":"Limiting rights reduces the damage a compromised account can cause."},{"u":6,"d":"m","q":"A packet-filtering firewall decides on the basis of:","o":["Source and destination IP, port and protocol","The file contents of every packet that passes through","The behaviour of the user over the last few minutes","Hash values computed over the payload of the packet"],"a":0,"e":"Stateless packet filters inspect header fields against an access control list."},{"u":6,"d":"h","q":"Hashing differs from encryption in that hashing is:","o":["One-way and not meant to be reversed","Always reversible with a key","Slower than encryption","Used only for images"],"a":0,"e":"Encryption is reversible with the key; a hash is a fixed-size digest from which the input cannot be recovered."},{"u":6,"d":"h","q":"The security of RSA depends on the difficulty of:","o":["Factoring the product of two large primes","Sorting large arrays","Computing square roots of integers","Finding hash collisions"],"a":0,"e":"Given n = p x q, recovering p and q is believed to be computationally infeasible for large keys."},{"u":6,"d":"h","q":"The Diffie-Hellman algorithm is used to:","o":["Agree on a shared secret over an insecure channel","Sign documents so that the sender cannot deny them","Hash passwords before storing them in a database","Compress traffic before it is sent over the link"],"a":0,"e":"Each side combines its private value with the other's public value to derive the same secret key."},{"u":6,"d":"h","q":"The chain of trust in PKI means:","o":["A certificate is trusted because it is signed by a trusted CA up to a root","Every certificate is self-signed and therefore trusted on its own","Certificates never expire, so no renewal is ever needed","Only one certificate can exist inside a browser at a time"],"a":0,"e":"Browsers trust root CAs, which sign intermediate CAs, which sign end-entity certificates."},{"u":6,"d":"h","q":"Which security service is provided by a digital signature but NOT by a plain hash?","o":["Non-repudiation","Integrity checking","Compression","Availability"],"a":0,"e":"A bare hash proves integrity only; a signature binds the message to the signer's private key."},{"u":6,"d":"h","q":"A message authentication code (MAC) differs from a digital signature because a MAC:","o":["Uses a shared secret key","Uses a private key","Provides non-repudiation","Cannot detect tampering"],"a":0,"e":"Both parties share the MAC key, so either could have produced it, unlike a signature."},{"u":6,"d":"h","q":"Collision resistance of a hash function means it is hard to find:","o":["Two different inputs with the same digest","One input starting from its own digest value","A longer input that produces a shorter digest","A faster implementation of the same algorithm"],"a":0,"e":"A collision breaks the binding property, which is why MD5 and SHA-1 are no longer trusted."},{"u":6,"d":"h","q":"AES has a block size of 128 bits and supports key lengths of:","o":["128, 192 and 256 bits","56, 112 and 168 bits","64 and 128 bits","256 and 512 bits"],"a":0,"e":"AES is defined for three key sizes with a fixed 128-bit block."},{"u":6,"d":"h","q":"A rainbow table attack is defeated by:","o":["Adding a unique random salt to each password hash","Using MD5 instead of SHA-256 for the password hash","Storing the passwords in plain text inside the database","Shortening the hash so that it is easier to compare"],"a":0,"e":"Precomputed tables cannot be reused when every hash is salted differently."},{"u":6,"d":"h","q":"IPSec provides security at the:","o":["Network layer","Application layer","Physical layer","Session layer"],"a":0,"e":"IPSec protects IP packets and is used mainly for site-to-site VPNs."},{"u":6,"d":"h","q":"The same-origin policy in browsers restricts:","o":["Scripts from one origin reading data of another origin","Cookies from being stored on the client machine at all","HTTPS connections from being opened by the browser","DNS resolution of names outside the local network"],"a":0,"e":"It blocks cross-origin reads unless the target explicitly allows them through CORS."},{"u":6,"d":"h","q":"In a CSRF attack, the attacker:","o":["Makes a victim's browser send an authenticated request","Steals the entire database of the target web server","Injects SQL statements into a login form field","Sniffs the Wi-Fi traffic of an unsecured network"],"a":0,"e":"The browser automatically attaches cookies, so the forged request appears legitimate; anti-CSRF tokens prevent it."},{"u":6,"d":"h","q":"Which technique best mitigates a buffer overflow?","o":["Bounds checking and non-executable stack protections","Using longer passwords and changing them frequently","Disabling logging so that the attacker cannot be traced","Using HTTP instead of HTTPS for internal traffic"],"a":0,"e":"Safe string functions, stack canaries, ASLR and DEP all reduce exploitability."},{"u":6,"d":"h","q":"Which algorithm is designed for hashing and not for encryption?","o":["MD5","AES","RSA","Blowfish"],"a":0,"e":"MD5 is a digest algorithm with no decryption path."},{"u":6,"d":"h","q":"Passwords should be stored as:","o":["Salted slow hashes such as bcrypt or Argon2","Plain text so that the support team can read them","Base64 encoded text inside the users table","AES ciphertext encrypted with a public key"],"a":0,"e":"Slow, memory-hard salted hashes make offline cracking expensive."},{"u":6,"d":"h","q":"Kerberos authenticates users by issuing:","o":["Time-limited tickets from a trusted server","Static passwords stored in a local configuration file","Public certificates signed by an external authority","Session cookies kept in the browser's local storage"],"a":0,"e":"The KDC issues a ticket-granting ticket that clients present to services."},{"u":6,"d":"h","q":"Injection flaws appear in the OWASP Top 10 mainly because:","o":["Untrusted input is concatenated into commands or queries","Databases are too fast for the application to validate","Firewalls are misconfigured at the network perimeter","Certificates expire without any warning to the user"],"a":0,"e":"Separating code from data through validation and parameterisation removes the flaw."},{"u":6,"d":"h","q":"Certificate revocation is checked using:","o":["CRL or OCSP","DNS TXT records","ARP tables","MAC filters"],"a":0,"e":"CRLs are published lists of revoked serial numbers; OCSP queries the status online."},{"u":6,"d":"h","q":"DNS cache poisoning aims to:","o":["Insert a forged mapping so users are sent to an attacker's server","Encrypt the disk of the DNS server so it cannot answer","Slow down name resolution without changing any answer","Delete the root ymorphism."},{"u":7,"d":"h","q":"In C, the expression 5 & 3 evaluates to:","o":["1","7","6","0"],"a":0,"e":"101 AND 011 = 001, which is 1."},{"u":8,"d":"e","q":"SDLC stands for:","o":["Software Development Life Cycle","System Design Logic Cycle","Software Debugging Level Check","Structured Data Life Cycle"],"a":0,"e":"SDLC is the framework of phases used to build and maintain software."},{"u":8,"d":"e","q":"Which is the correct order of SDLC phases?","o":["Requirement, design, coding, testing, maintenance","Design, requirement, testing, coding, maintenance","Coding, design, requirement, testing, maintenance","Testing, coding, design, requirement, maintenance"],"a":0,"e":"Requirements are gathered first, then designed, implemented, verified and maintained."},{"u":8,"d":"e","q":"The Waterfall model is:","o":["Sequential with no overlap between phases","Iterative, with a daily build and continuous feedback","Based on repeated risk analysis spirals in each cycle","Used only for maintenance projects after release"],"a":0,"e":"Each phase must finish before the next begins, and going back is costly."},{"u":8,"d":"e","q":"Agile development emphasises:","o":["Iterative delivery in short sprints with customer feedback","A single big-bang release at the very end of the project","No documentation at all, since code is self-explanatory","Freezing the requirements before coding starts"],"a":0,"e":"Agile delivers working software in short increments and welcomes changing requirements."},{"u":8,"d":"e","q":"Testing a single function or module in isolation is called:","o":["Unit testing","Integration testing","System testing","Acceptance testing"],"a":0,"e":"Unit testing verifies the smallest testable pieces, often with stubs and drivers."},{"u":8,"d":"e","q":"Black-box testing is based on:","o":["Inputs and outputs without knowledge of internal code","Code structure and the paths executed inside each module","Compiler warnings and static analysis of the source","Database schemas and the indexes built on each table"],"a":0,"e":"The tester treats the program as a box and checks behaviour against requirements."},{"u":8,"d":"e","q":"White-box testing is also known as:","o":["Structural testing","Functional testing","Regression testing","Beta testing"],"a":0,"e":"It uses knowledge of the internal logic to design test cases that cover paths and conditions."},{"u":8,"d":"e","q":"Which phase is the most expensive to fix a defect in?","o":["Maintenance or post-release","Requirement analysis, before any design begins","The design phase, while modules are still being drawn","The coding phase, when the module is first written"],"a":0,"e":"Defect cost grows sharply with the phase in which it is found; post-release fixes are the costliest."},{"u":8,"d":"e","q":"Verification answers the question:","o":["Are we building the product right?","Are we building the right product?","Is the product fast?","Is the product cheap?"],"a":0,"e":"Verification checks conformance to specification; validation checks fitness for user needs."},{"u":8,"d":"e","q":"Which model is best suited when requirements are unclear and change frequently?","o":["Agile","Waterfall","V-model","Big bang"],"a":0,"e":"Short iterations allow learning and adjustment as requirements evolve."},{"u":8,"d":"e","q":"A build that is released to a limited set of real users before the final launch is a:","o":["Beta release","Alpha release","Patch","Service pack"],"a":0,"e":"Beta testing is done by real users outside the development team."},{"u":8,"d":"e","q":"Software maintenance includes:","o":["Corrective, adaptive, perfective and preventive work","Only bug fixing after the customer reports a problem","Only rewriting the code in a newer programming language","Only writing the user manual and training material"],"a":0,"e":"Maintenance covers fixes, environment changes, improvements and future-proofing."},{"u":8,"d":"e","q":"A software requirement specification (SRS) document is produced during:","o":["R  values that the tester will type in","Only the expected output, without any input values","Only the source code of the function under test"],"a":0,"e":"A complete test case makes the result reproducible and verifiable."},{"u":8,"d":"m","q":"Which model performs risk analysis in every cycle?","o":["Spiral","Waterfall","V-model","Big bang"],"a":0,"e":"Each spiral loop starts with risk analysis and ends with a prototype reviewed by the customer."},{"u":8,"d":"m","q":"Testing the complete system against the SRS is called:","o":["System testing","Unit testing","Integration testing","Regression testing"],"a":0,"e":"System testing validates the whole product as a black box."},{"u":8,"d":"m","q":"Which testing is done by the development team on their own code before release?","o":["Alpha testing","Beta testing","Acceptance testing","Field testing"],"a":0,"e":"Alpha testing happens in-house; beta testing is done by external users."},{"u":8,"d":"m","q":"Cyclomatic complexity is computed as:","o":["Edges - Nodes + 2P","Nodes + Edges","Edges / Nodes","Nodes - Edges"],"a":0,"e":"For a single connected component (P = 1) it equals E - N + 2, indicating the number of independent paths."},{"u":8,"d":"m","q":"Low coupling and high cohesion indicate:","o":["A well-designed modular system","A tightly coupled system","A system with many bugs","A monolithic design"],"a":0,"e":"Modules should be self-contained (high cohesion) and depend little on each other (low coupling)."},{"u":8,"d":"m","q":"Boundary value analysis tests:","o":["Values at the edges of input ranges","Random values picked from the whole input domain","Only valid values from the middle of each range","Only invalid values that the program must reject"],"a":0,"e":"Defects cluster at boundaries, so min, min-1, max and max+1 are tested."},{"u":8,"d":"m","q":"Which technique tests every possible combination of conditions?","o":["Equivalence partitioning","Decision table testing","Ad hoc testing","Smoke testing"],"a":1,"e":"A  design and execution","Deployment and release planning","Code refactoring and review"],"a":0,"e":"Use cases capture actors and their goals during analysis."},{"u":8,"d":"m","q":"Incremental delivery means:","o":["Building and delivering the system in usable parts","Delivering the whole system in a single final release","Delivering only the documentation before any software","Delivering the software without testing any module"],"a":0,"e":"Each increment adds usable functionality on top of the previous one."},{"u":8,"d":"m","q":"Which testing verifies behaviour under heavy user load?","o":["Load testing","Unit testing","Regression testing","Static analysis"],"a":0,"e":"Load and stress testing measure performance and stability under expected and extreme loads."},{"u":8,"d":"m","q":"Static analysis of code is performed:","o":["Without executing the program","Only after deployment","Only on compiled binaries","Only by users"],"a":0,"e":"Tools such as linters and analysers inspect source code for defects."},{"u":8,"d":"m","q":"The main deliverable at the end of the design phase is:","o":["Architecture and detailed design documents","Executable code for all the modules of the system","Test results for every module of the system","The user manual and the training material"],"a":0,"e":"Design documents describe modules, interfaces and data structures before coding."},{"u":8,"d":"m","q":"Which pair correctly matches the testing type with its level?","o":["Integration - interfaces between modules","Unit testing - the whole system end to end","System testing - a single function in isolation","Acceptance testing - code coverage of each module"],"a":0,"e":"Integration testing focuses on interfaces, not individual functions."},{"u":8,"d":"m","q":"The main advantage of Agile over Waterfall is:","o":["Early and continuous delivery of working software","Complete requirements are gathered before coding starts","Far fewer meetings are needed across the project","Testing becomes unnecessary once the code is reviewed"],"a":0,"e":"Frequent increments give early feedback and reduce risk."},{"u":8,"d":"h","q":"A program has 12 edges and 10 nodes in one connected component. Its cyclomatic complexity is:","o":["4","2","6","22"],"a":0,"e":"V = E - N + 2 = 12 - 10 + 2 = 4, meaning four independent paths."},{"u":8,"d":"h","q":"Which defect is most likely to be found by white-box but not black-box testing?","o":["An unreachable code branch","A wrong output for a valid input","A missing feature","A slow response time"],"a":0,"e":"Dead code and untested paths are visible only from the internal structure."},{"u":8,"d":"h","q":"For a field accepting values 1 to 100, boundary value analysis uses how many test values in the standard form?","o":["6","2","100","3"],"a":0,"e":"The standard set is 0, 1, 2, 99, 100 and 101 - six values around both boundaries."},{"u":8,"d":"h","q":"Which is a valid reason to prefer iterative over big-bang deployment?","o":["Risks and rollback scope are smaller per release","It removes the need for any testing before release","It removes the need for monitoring after release","It makes version control unnecessary for the team"],"a":0,"e":"Smaller releases limit blast radius and are easier to roll back."},{"u":8,"d":"h","q":"The relationship between phases in the V-model is that each design phase has a corresponding:","o":["Test phase at the same level of abstraction","Coding phase that follows it immediately afterwards","Maintenance phase that lasts for several years","Deployment phase that installs the product"],"a":0,"e":"High-level design pairs with system testing; detailed design pairs with integration testing."},{"u":8,"d":"h","q":"Equivalence partitioning reduces test cases by:","o":["Testing one representative value from each partition","Testing every possible value in the input domain","Testing only the boundary values of each range","Testing random values until no defect is found"],"a":0,"e":"Inputs in the same class are expected to behave alike, so one representative suffices."},{"u":8,"d":"h","q":"Which statement about Scrum ceremonies is correct?","o":["Daily stand-up is a short synchronisation meeting","The sprint review is held every day of the sprint","The retrospective replaces the daily stand-up","Sprint planning happens only once in the project"],"a":0,"e":"The stand-up is time-boxed to about 15 minutes for coordination."},{"u":8,"d":"h","q":"A defect found during acceptance testing usually indicates a failure in:","o":["Requirement analysis or validation","Compiler optimisation of the released binary","The hardware on which the system was tested","The network cabling used during the test run"],"a":0,"e":"If the system works as specified but not as needed, the requirements were wrong or incomplete."},{"u":8,"d":"h","q":"Reliability of software is commonly measured by:","o":["Mean time between failures","Number of lines of code written","Number of developers on the team","Size of the user documentation"],"a":0,"e":"MTBF and defect density are standard reliability indicators."},{"u":8,"d":"h","q":"Which model is the best fit for a well-understood project with fixed requirements and a fixed-price contract?","o":["Waterfall","Agile","Spiral","Prototype"],"a":0,"e":"Stable requirements make the sequential model predictable and easy to contract."},{"u":8,"d":"h","q":"In DevOps, continuous integration means:","o":["Merging and building code frequently with automated tests","Deploying to production on every commit without tests","Writing code continuously without review","Running one build per release"],"a":0,"e":"Frequent automated builds detect integration problems early."},{"u":8,"d":"h","q":"Which is an example of a non-functional test?","o":["Security penetration test","Login function test","Invoice calculation test","Password reset test"],"a":0,"e":"Security, performance and usability tests check quality attributes rather than features."},{"u":8,"d":"h","q":"A traceability matrix ference is written as:","o":["$A$1","A1","A$1 only","[A1]"],"a":0,"e":"Dollar signs lock both the column and the row when the formula is copied."},{"u":10,"d":"e","q":"Which Excel function looks up a value in the leftmost column of a table?","o":["VLOOKUP()","SUMIF()","COUNT()","CONCAT()"],"a":0,"e":"VLOOKUP searches the first column vertically and returns a value from a specified column."},{"u":10,"d":"e","q":"The Linux command to list directory contents is:","o":["ls","dir","list","show"],"a":0,"e":"ls lists files; dir also works in some shells but ls is standard on Linux."},{"u":10,"d":"e","q":"The Linux command to print the current working directory is:","o":["pwd","cd","cwd","path"],"a":0,"e":"pwd stands for print working directory."},{"u":10,"d":"e","q":"Which command creates a new directory in Linux?","o":["mkdir","makedir","newdir","md"],"a":0,"e":"mkdir creates a directory; md is the Windows equivalent."},{"u":10,"d":"e","q":"In MS Word, which shortcut saves the document?","o":["Ctrl + S","Ctrl + P","Ctrl + N","Ctrl + Z"],"a":0,"e":"Ctrl+S saves, Ctrl+P prints, Ctrl+N creates a new document and Ctrl+Z undoes."},{"u":10,"d":"e","q":"In PowerPoint, which key starts the slide show from the beginning?","o":["F5","F1","F7","F12"],"a":0,"e":"F5 starts the presentation; Shift+F5 starts from the current slide."},{"u":10,"d":"e","q":"A batch file in Windows typically has the extension:","o":[".bat",".sh",".exe",".cmd only"],"a":0,"e":".bat (and .cmd) files contain Windows batch commands."},{"u":10,"d":"e","q":"The first line of a bash script is usually:","o":["#!/bin/bash","#bash","/bin/bash","begin bash"],"a":0,"e":"The shebang tells the kernel which interpreter to use."},{"u":10,"d":"e","q":"Which Linux command changes file permissions?","o":["chmod","chown","chgrp","chperm"],"a":0,"e":"chmod changes mode bits; chown changes ownership."},{"u":10,"d":"e","q":"Which Windows command shows the IP configuration?","o":["ipconfig","ifconfig","netstat","ping"],"a":0,"e":"ipconfig displays and renews TCP/IP settings; ifconfig is the Linux equivalent."},{"u":10,"d":"e","q":"In Excel, a formula always begins with:","o":["=","+","@","#"],"a":0,"e":"An equals sign marks the cell content as a formula."},{"u":10,"d":"e","q":"Which device driver problem is most likely after a Windows update?","o":["A previously working device stops responding","The keyboard layout switches to a different regional language","The desktop wallpaper reverts to the default Windows image","The system clock resets to the date of manufacture of the PC"],"a":0,"e":"Incompatible updated drivers are a common cause of device failures after updates."},{"u":10,"d":"e","q":"POST (Power On Self Test) runs:","o":["When the computer is switched on","Only after the operating system has finished loading","Only when the computer is booted into Safe Mode","Only during a scheduled shutdown of the system"],"a":0,"e":"POST checks basic hardware before the boot loader starts."},{"u":10,"d":"e","q":"Which command in Linux displays the manual page of a command?","o":["man","help","info only","doc"],"a":0,"e":"man ls shows the manual for ls."},{"u":10,"d":"e","q":"In Word, mail merge is used to:","o":["Create personalised letters for many recipients","Merge two separate documents into one single file","Combine several tables into one large table in the document","Compress the images inserted into the document file"],"a":0,"e":"Mail merge combines a main document with a data source such as an Excel list."},{"u":10,"d":"e","q":"Which Excel function counts numeric cells in a range?","o":["COUNT()","COUNTA()","SUM()","LEN()"],"a":0,"e":"COUNT counts numbers only; COUNTA counts all non-empty cells."},{"u":10,"d":"e","q":"Safe Mode in Windows is used to:","o":["Start with minimal drivers for troubleshooting","Speed up the computer by disabling all background apps","Install new hardware without any driver software","Encrypt the entire disk before the system boots up"],"a":0,"e":"Safe Mode loads basic drivers so faulty software or drivers can be removed."},{"u":10,"d":"e","q":"Which Linux command removes an empty directory?","o":["rmdir","rm -r","del","erase"],"a":0,"e":"rmdir removes empty directories; rm -r removes non-empty ones recursively."},{"u":10,"d":"m","q":"In Excel, what is the result of the formula =2+3*4?","o":["14","20","24","9"],"a":0,"e":"Multiplication precedes addition, so 3*4 = 12 and the result is 14."},{"u":10,"d":"m","q":"The Linux permission 755 means:","o":["Owner rwx, group r-x, others r-x","Owner rw-, group rw-, others rw-","Everyone rwx","Owner r-x, others rwx"],"a":0,"e":"7 = rwx for the owner, 5 = r-x for group and others."},{"u":10,"d":"m","q":"Which command searches for a pattern inside files in Linux?","o":["grep","find","locate","cat"],"a":0,"e":"grep pattern file prints matching lines; find searches for file names and paths."},{"u":10,"d":"m","q":"In Linux, which command shows detailed information including permissions?","o":["ls -l","ls -a","ls -r","ls -h"],"a":0,"e":"The long format shows mode, owner, size and timestamp."},{"u":10,"d":"m","q":"Which Excel function returns the number of characters in a cell?","o":["LEN()","COUNT()","CHAR()","SIZE()"],"a":0,"e":"LEN(text) returns the character count, including spaces."},{"u":10,"d":"m","q":"To install software on Debian or Ubuntu from the command line, you use:","o":["apt install package","yum install package","msiexec package","pkgadd package"],"a":0,"e":"apt is the Debian package manager; yum and dnf belong to Red Hat based systems."},{"u":10,"d":"m","q":"Which command in Linux displays running processes with CPU usage?","o":["top","cat","head","chmod"],"a":0,"e":"top shows a live view; ps gives a snapshot and htop is an enhanced alternative."},{"u":10,"d":"m","q":"In Excel, which symbol makes a reference relative in one direction and absolute in another, like A$1?","o":["Mixed reference with the dollar before the row","Absolute reference, where the column and row are both locked","Relative reference, where both the column and row can change","Named range, where a label replaces the cell address"],"a":0,"e":"A$1 locks the row but lets the column change when copied."},{"u":10,"d":"m","q":"The Windows command to list files in the current directory is:","o":["dir","ls","list","show"],"a":0,"e":"dir is the native Windows command; ls works in PowerShell as an alias."},{"u":10,"d":"m","q":"Which Linux command copies a file?","o":["cp","mv","rm","ln"],"a":0,"e":"cp copies, mv moves or renames, rm deletes and ln creates links."},{"u":10,"d":"m","q":"A beep code at startup usually indicates:","o":["A hardware problem detected during POST","A successful boot with no errors found at all","A pending software update that must be installed","A temporary network error on the local segment"],"a":0,"e":"The pattern of beeps identifies the failing component such as RAM or the graphics card."},{"u":10,"d":"m","q":"In PowerPoint, the Slide Master is used to:","o":["Apply consistent formatting to all slides","Insert animations and transitions into each slide","Record narration and timings for the whole deck","Print handouts with several slides on one page"],"a":0,"e":"Changes to the master propagate to every slide using that layout."},{"u":10,"d":"m","q":"In Word, pressing Ctrl + Enter inserts a:","o":["Page break","Line break","Section break","Table"],"a":0,"e":"Ctrl+Enter forces a page break; Shift+Enter inserts a line break."},{"u":10,"d":"m","q":"The Linux command to change to the parent directory is:","o":["cd ..","cd /","cd ~","cd -"],"a":0,"e":".. refers to the parent; / is the root and ~ is the home directory."},{"u":10,"d":"m","q":"Which Excel feature finds the optimal value for a formula by changing input cells?","o":["Goal Seek","Sort","Filter","Freeze Panes"],"a":0,"e":"Goal Seek adjusts one input to reach a target result."},{"u":10,"d":"m","q":"Which is the correct order for installing a new printer in Windows?","o":["Connect the device,
