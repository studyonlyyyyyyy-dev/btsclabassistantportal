{id:"u5t1",t:"Network types: LAN, MAN, WAN, PAN; topologies",html:`
<table class="tbl"><tr><th>Type</th><th>Span</th><th>Example</th></tr>
<tr><td>PAN</td><td>About 10 m</td><td>Bluetooth earphones, smartwatch</td></tr>
<tr><td>LAN</td><td>Room to campus</td><td>Office Ethernet, Wi-Fi network</td></tr>
<tr><td>MAN</td><td>City</td><td>Cable TV network, city-wide ISP link</td></tr>
<tr><td>WAN</td><td>Country to global</td><td>Internet, leased lines between branches</td></tr></table>
<h4>Topologies</h4>
<table class="tbl"><tr><th>Topology</th><th>Strength</th><th>Weakness</th></tr>
<tr><td>Bus</td><td>Cheap, simple cabling</td><td>One break stops the network, collisions</td></tr>
<tr><td>Star</td><td>Easy fault isolation, most common</td><td>Central device is a single point of failure</td></tr>
<tr><td>Ring</td><td>Predictable, no collisions with token</td><td>A single break can down the ring</td></tr>
<tr><td>Mesh</td><td>Redundant, fault tolerant</td><td>n(n&minus;1)/2 links, expensive</td></tr>
<tr><td>Tree</td><td>Scalable hierarchy</td><td>Root failure splits the network</td></tr>
<tr><td>Hybrid</td><td>Flexible</td><td>Complex to manage</td></tr></table>
<h4>Transmission modes</h4>
<ul class="bul">
<li><b>Simplex:</b> one direction only (keyboard to computer).</li>
<li><b>Half duplex:</b> both directions but one at a time (walkie-talkie).</li>
<li><b>Full duplex:</b> both directions at once (telephone).</li>
<li>Switching: circuit (dedicated path), packet (store and forward), message.</li>
</ul>
<div class="mn"><b>Bandwidth vs throughput vs latency:</b> bandwidth is capacity, throughput is what actually gets through, latency is delay. Good bandwidth with high latency still feels slow.</div>`},
{id:"u5t2",t:"OSI seven-layer model and TCP/IP model mapping",html:`
<svg viewBox="0 0 560 260" class="dia" role="img" aria-label="OSI seven layer model">
<g font-size="12">
<rect x="20" y="10" width="300" height="30" rx="4" fill="var(--brand)" opacity=".26" stroke="var(--brand)"/><text x="34" y="30" fill="var(--ink)">7 Application</text><text x="250" y="30" fill="var(--muted)" font-size="10">HTTP, FTP, SMTP</text>
<rect x="20" y="44" width="300" height="30" rx="4" fill="var(--brand)" opacity=".24" stroke="var(--brand)"/><text x="34" y="64" fill="var(--ink)">6 Presentation</text><text x="250" y="64" fill="var(--muted)" font-size="10">SSL/TLS, JPEG</text>
<rect x="20" y="78" width="300" height="30" rx="4" fill="var(--brand)" opacity=".22" stroke="var(--brand)"/><text x="34" y="98" fill="var(--ink)">5 Session</text><text x="250" y="98" fill="var(--muted)" font-size="10">RPC, NetBIOS</text>
<rect x="20" y="112" width="300" height="30" rx="4" fill="var(--brand)" opacity=".2" stroke="var(--brand)"/><text x="34" y="132" fill="var(--ink)">4 Transport</text><text x="250" y="132" fill="var(--muted)" font-size="10">TCP, UDP</text>
<rect x="20" y="146" width="300" height="30" rx="4" fill="var(--brand)" opacity=".18" stroke="var(--brand)"/><text x="34" y="166" fill="var(--ink)">3 Network</text><text x="250" y="166" fill="var(--muted)" font-size="10">IP, ICMP, router</text>
<rect x="20" y="180" width="300" height="30" rx="4" fill="var(--brand)" opacity=".16" stroke="var(--brand)"/><text x="34" y="200" fill="var(--ink)">2 Data link</text><text x="250" y="200" fill="var(--muted)" font-size="10">Ethernet, switch</text>
<rect x="20" y="214" width="300" height="30" rx="4" fill="var(--brand)" opacity=".14" stroke="var(--brand)"/><text x="34" y="234" fill="var(--ink)">1 Physical</text><text x="250" y="234" fill="var(--muted)" font-size="10">Hub, cable, bits</text>
<text x="360" y="30" fill="var(--muted)" font-size="10">PDU: data</text>
<text x="360" y="64" fill="var(--muted)" font-size="10">PDU: data</text>
<text x="360" y="98" fill="var(--muted)" font-size="10">PDU: data</text>
<text x="360" y="132" fill="var(--muted)" font-size="10">PDU: segment</text>
<text x="360" y="166" fill="var(--muted)" font-size="10">PDU: packet</text>
<text x="360" y="200" fill="var(--muted)" font-size="10">PDU: frame</text>
<text x="360" y="234" fill="var(--muted)" font-size="10">PDU: bit</text>
</g>
</svg>
<div class="mn"><b>Mnemonic:</b> 7 &rarr; 1 <i>All People Seem To Need Data Processing</i>; 1 &rarr; 7 <i>Please Do Not Throw Sausage Pizza Away</i>.</div>
<h4>What each layer actually does</h4>
<ul class="bul">
<li><b>Physical:</b> bits, voltages, cable, connectors, data rate.</li>
<li><b>Data link:</b> framing, MAC addressing, error detection (CRC), flow control on the local link.</li>
<li><b>Network:</b> logical addressing, routing, fragmentation.</li>
<li><b>Transport:</b> end-to-end delivery, ports, segmentation, reliability.</li>
<li><b>Session:</b> establishing, managing and terminating sessions.</li>
<li><b>Presentation:</b> translation, encryption, compression.</li>
<li><b>Application:</b> the network service the user sees.</li>
</ul>
<h4>TCP/IP mapping</h4>
<table class="tbl"><tr><th>TCP/IP layer</th><th>OSI layers</th></tr>
<tr><td>Application</td><td>5, 6, 7</td></tr>
<tr><td>Transport</td><td>4</td></tr>
<tr><td>Internet</td><td>3</td></tr>
<tr><td>Network access</td><td>1, 2</td></tr></table>
<div class="warn"><b>Trap:</b> encryption sits at <b>presentation</b> (layer 6) in the OSI model, not at the application layer, even though TLS is often described loosely as an application-level protocol.</div>`},
{id:"u5t3",t:"IP addressing: classes, private ranges, IPv4 vs IPv6",html:`
<table class="tbl"><tr><th>Class</th><th>First octet</th><th>Default mask</th><th>Note</th></tr>
<tr><td>A</td><td>1&ndash;126</td><td>255.0.0.0 (/8)</td><td>10.0.0.0/8 private</td></tr>
<tr><td>B</td><td>128&ndash;191</td><td>255.255.0.0 (/16)</td><td>172.16.0.0/12 private</td></tr>
<tr><td>C</td><td>192&ndash;223</td><td>255.255.255.0 (/24)</td><td>192.168.0.0/16 private</td></tr>
<tr><td>D</td><td>224&ndash;239</td><td>—</td><td>Multicast</td></tr>
<tr><td>E</td><td>240&ndash;255</td><td>—</td><td>Experimental</td></tr></table>
<h4>Special addresses</h4>
<ul class="bul">
<li><b>127.0.0.1</b> loopback (the whole 127.0.0.0/8 range).</li>
<li><b>0.0.0.0</b> unspecified or "any interface".</li>
<li><b>255.255.255.255</b> limited broadcast.</li>
<li><b>169.254.x.x</b> APIPA link-local when DHCP fails.</li>
<li>Private ranges are never routed on the internet and need NAT to reach it.</li>
</ul>
<h4>IPv4 vs IPv6</h4>
<table class="tbl"><tr><th>Feature</th><th>IPv4</th><th>IPv6</th></tr>
<tr><td>Size</td><td>32 bits</td><td>128 bits</td></tr>
<tr><td>Notation</td><td>Dotted decimal</td><td>Eight hex groups, :: compression</td></tr>
<tr><td>Header</td><td>20 bytes, variable</td><td>40 bytes, fixed</td></tr>
<tr><td>NAT</td><td>Required</td><td>Not required</td></tr>
<tr><td>Fragmentation</td><td>Routers and hosts</td><td>Source only</td></tr>
<tr><td>Address configuration</td><td>DHCP</td><td>SLAAC plus DHCPv6</td></tr></table>
<p>2001:0db8:0000:0000:0000:0000:0000:0001 compresses to <b>2001:db8::1</b>: drop leading zeros in each group, then replace one run of zero groups with ::.</p>
<div class="mn"><b>MAC address</b> is 48 bits (six hex pairs), burned into the NIC and used at layer 2. IP is logical and changes with the network.</div>`},
{id:"u5t4",t:"Subnetting and CIDR: masks, host counts, broadcast address",html:`
<svg viewBox="0 0 560 210" class="dia" role="img" aria-label="Subnetting tree for a slash 24 split into slash 26">
<g font-size="11.5" fill="var(--ink)">
<rect x="200" y="8" width="160" height="34" rx="6" fill="var(--brand)" opacity=".22" stroke="var(--brand)"/><text x="280" y="30" text-anchor="middle">192.168.1.0/24</text>
<line x1="280" y1="42" x2="110" y2="78" stroke="var(--brand)" stroke-width="1.6"/>
<line x1="280" y1="42" x2="250" y2="78" stroke="var(--brand)" stroke-width="1.6"/>
<line x1="280" y1="42" x2="390" y2="78" stroke="var(--brand)" stroke-width="1.6"/>
<line x1="280" y1="42" x2="470" y2="78" stroke="var(--brand)" stroke-width="1.6"/>
<rect x="30" y="80" width="150" height="34" rx="6" fill="var(--brand)" opacity=".16" stroke="var(--brand)"/><text x="105" y="102" text-anchor="middle">.0/26 (.0-.63)</text>
<rect x="196" y="80" width="150" height="34" rx="6" fill="var(--brand)" opacity=".16" stroke="var(--brand)"/><text x="271" y="102" text-anchor="middle">.64/26 (.64-.127)</text>
<rect x="356" y="80" width="150" height="34" rx="6" fill="var(--brand)" opacity=".16" stroke="var(--brand)"/><text x="431" y="102" text-anchor="middle">.128/26 (.128-.191)</text>
<rect x="30" y="130" width="150" height="34" rx="6" fill="var(--brand)" opacity=".16" stroke="var(--brand)"/><text x="105" y="152" text-anchor="middle">.192/26 (.192-.255)</text>
<line x1="431" y1="114" x2="105" y2="128" stroke="var(--brand)" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="280" y="186" text-anchor="middle" fill="var(--muted)" font-size="10">62 usable hosts per subnet, mask 255.255.255.192</text>
</g>
</svg>
<h4>Four steps for any subnetting question</h4>
<ol class="num">
<li>Block size = 2<sup>host bits</sup> (also 256 &minus; the interesting mask octet).</li>
<li>Network addresses are multiples of the block size.</li>
<li>Broadcast = next network &minus; 1.</li>
<li>Usable hosts = block size &minus; 2.</li>
</ol>
<table class="tbl"><tr><th>Prefix</th><th>Mask</th><th>Block</th><th>Usable hosts</th></tr>
<tr><td>/25</td><td>255.255.255.128</td><td>128</td><td>126</td></tr>
<tr><td>/26</td><td>255.255.255.192</td><td>64</td><td>62</td></tr>
<tr><td>/27</td><td>255.255.255.224</td><td>32</td><td>30</td></tr>
<tr><td>/28</td><td>255.255.255.240</td><td>16</td><td>14</td></tr>
<tr><td>/29</td><td>255.255.255.248</td><td>8</td><td>6</td></tr>
<tr><td>/30</td><td>255.255.255.252</td><td>4</td><td>2</td></tr></table>
<h4>Reverse questions</h4>
<ul class="bul">
<li>Need h hosts &rarr; host bits = &lceil;log<sub>2</sub>(h + 2)&rceil;.</li>
<li>Need s subnets &rarr; borrowed bits = &lceil;log<sub>2</sub>s&rceil;, new prefix = old + borrowed.</li>
<li>192.168.1.0/24 into /26 gives 4 subnets; into /20 from /16 gives 16.</li>
</ul>
<div class="mn"><b>Example:</b> 192.168.1.130/26 falls in the 128&ndash;191 block, so the network is 192.168.1.128 and the broadcast is 192.168.1.191.</div>`},
{id:"u5t5",t:"Networking devices: hub, switch, router, repeater, gateway",html:`
<table class="tbl"><tr><th>Device</th><th>Layer</th><th>Identifier used</th><th>Behaviour</th></tr>
<tr><td>Repeater</td><td>1</td><td>None</td><td>Regenerates and amplifies the signal</td></tr>
<tr><td>Hub</td><td>1</td><td>None</td><td>Floods every port; one collision domain</td></tr>
<tr><td>Bridge</td><td>2</td><td>MAC</td><td>Connects two segments, filters frames</td></tr>
<tr><td>Switch</td><td>2</td><td>MAC</td><td>Learns addresses, forwards only to the right port</td></tr>
<tr><td>Router</td><td>3</td><td>IP</td><td>Chooses the best path between networks</td></tr>
<tr><td>Firewall</td><td>3&ndash;4</td><td>IP + port</td><td>Allows or denies traffic by rule</td></tr>
<tr><td>Gateway / proxy</td><td>7</td><td>Protocol</td><td>Translates between different protocols</td></tr></table>
<h4>Points that decide MCQs</h4>
<ul class="bul">
<li>A switch creates one collision domain per port but a single broadcast domain; a router separates broadcast domains.</li>
<li>A hub wastes bandwidth because every frame reaches every host.</li>
<li>Full duplex on a switch port removes collisions entirely.</li>
<li>VLANs partition a switch logically without extra hardware.</li>
</ul>
<div class="warn"><b>Trap:</b> a "layer-3 switch" can route, but the classical exam answer for routing between networks is still the router.</div>`},
{id:"u5t6",t:"Protocols: TCP, UDP, HTTP, HTTPS, FTP, SMTP, DNS, DHCP",html:`
<svg viewBox="0 0 460 210" class="dia" role="img" aria-label="TCP three way handshake">
<g font-size="11" fill="var(--ink)">
<text x="70" y="18" text-anchor="middle" font-weight="600">Client</text>
<text x="370" y="18" text-anchor="middle" font-weight="600">Server</text>
<line x1="70" y1="28" x2="70" y2="190" stroke="var(--brand)" stroke-width="2"/>
<line x1="370" y1="28" x2="370" y2="190" stroke="var(--brand)" stroke-width="2"/>
<path d="M70 52 H366" stroke="var(--brand)" stroke-width="2" marker-end="url(#hs)"/>
<text x="218" y="45" text-anchor="middle" font-size="10">1. SYN (seq = x)</text>
<path d="M370 96 H74" stroke="var(--brand)" stroke-width="2" marker-end="url(#hs)"/>
<text x="218" y="89" text-anchor="middle" font-size="10">2. SYN-ACK (seq = y, ack = x+1)</text>
<path d="M70 140 H366" stroke="var(--brand)" stroke-width="2" marker-end="url(#hs)"/>
<text x="218" y="133" text-anchor="middle" font-size="10">3. ACK (ack = y+1)</text>
<text x="218" y="176" text-anchor="middle" font-size="10" fill="var(--muted)">connection established - data transfer begins</text>
<defs><marker id="hs" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--brand)"/></marker></defs>
</g></svg>

<table class="tbl"><tr><th>Protocol</th><th>Transport</th><th>Job</th></tr>
<tr><td>HTTP</td><td>TCP 80</td><td>Transfer web pages, stateless request/response</td></tr>
<tr><td>HTTPS</td><td>TCP 443</td><td>HTTP over TLS, encrypted</td></tr>
<tr><td>FTP</td><td>TCP 20/21</td><td>File transfer; 21 control, 20 data</td></tr>
<tr><td>SFTP / SCP</td><td>TCP 22</td><td>Secure file transfer over SSH</td></tr>
<tr><td>SMTP</td><td>TCP 25/587</td><td>Sending mail between servers</td></tr>
<tr><td>POP3 / IMAP</td><td>TCP 110 / 143</td><td>Retrieving mail (IMAP keeps it on the server)</td></tr>
<tr><td>DNS</td><td>UDP 53</td><td>Name to IP resolution; TCP 53 for large answers and zone transfers</td></tr>
<tr><td>DHCP</td><td>UDP 67/68</td><td>Automatic IP, mask, gateway, DNS</td></tr>
<tr><td>SSH</td><td>TCP 22</td><td>Encrypted remote login</td></tr>
<tr><td>Telnet</td><td>TCP 23</td><td>Remote login in clear text (insecure)</td></tr>
<tr><td>SNMP</td><td>UDP 161</td><td>Network device monitoring</td></tr>
<tr><td>ICMP</td><td>IP</td><td>ping, traceroute, error reporting</td></tr></table>
<h4>TCP vs UDP</h4>
<table class="tbl"><tr><th>Feature</th><th>TCP</th><th>UDP</th></tr>
<tr><td>Connection</td><td>3-way handshake</td><td>None</td></tr>
<tr><td>Reliability</td><td>ACK and retransmission</td><td>Best effort</td></tr>
<tr><td>Ordering</td><td>Sequence numbers</td><td>None</td></tr>
<tr><td>Header</td><td>20 bytes minimum</td><td>8 bytes</td></tr>
<tr><td>Used by</td><td>HTTP, FTP, SMTP, SSH</td><td>DNS, DHCP, VoIP, streaming, gaming</td></tr></table>
<div class="mn"><b>Handshake order:</b> SYN &rarr; SYN-ACK &rarr; ACK. Termination uses FIN/ACK in both directions.</div>`},
{id:"u5t7",t:"Port numbers and well-known services",html:`
<table class="tbl"><tr><th>Port</th><th>Service</th><th>Port</th><th>Service</th></tr>
<tr><td>20/21</td><td>FTP data / control</td><td>80</td><td>HTTP</td></tr>
<tr><td>22</td><td>SSH, SFTP</td><td>110</td><td>POP3</td></tr>
<tr><td>23</td><td>Telnet</td><td>143</td><td>IMAP</td></tr>
<tr><td>25</td><td>SMTP</td><td>161</td><td>SNMP</td></tr>
<tr><td>53</td><td>DNS</td><td>443</td><td>HTTPS</td></tr>
<tr><td>67/68</td><td>DHCP server / client</td><td>3306</td><td>MySQL</td></tr>
<tr><td>69</td><td>TFTP</td><td>3389</td><td>RDP</td></tr></table>
<h4>Port ranges</h4>
<ul class="bul">
<li><b>0&ndash;1023</b> well-known ports, need administrator rights to bind.</li>
<li><b>1024&ndash;49151</b> registered ports (MySQL 3306, RDP 3389).</li>
<li><b>49152&ndash;65535</b> dynamic or ephemeral ports chosen by the client.</li>
</ul>
<div class="mn"><b>Memory trick:</b> think of the port as a flat number on an apartment building — the IP finds the building, the port finds the flat (the process).</div>
<div class="warn"><b>Trap:</b> DNS uses <b>UDP 53</b> for normal queries; TCP 53 appears only for zone transfers or responses too large for UDP. Both answers exist, so read the question carefully.</div>`},
{id:"u5t8",t:"Wireless networks: Wi-Fi, Bluetooth, 4G, 5G",html:`
<table class="tbl"><tr><th>Technology</th><th>Standard</th><th>Range</th><th>Typical use</th></tr>
<tr><td>Wi-Fi</td><td>IEEE 802.11 a/b/g/n/ac/ax</td><td>30&ndash;100 m</td><td>LAN access</td></tr>
<tr><td>Bluetooth</td><td>IEEE 802.15.1</td><td>About 10 m</td><td>PAN, audio, peripherals</td></tr>
<tr><td>Zigbee</td><td>IEEE 802.15.4</td><td>10&ndash;100 m</td><td>Home automation, low power</td></tr>
<tr><td>WiMAX</td><td>IEEE 802.16</td><td>Kilometres</td><td>Wireless MAN</td></tr>
<tr><td>4G LTE</td><td>Cellular</td><td>City</td><td>Mobile broadband</td></tr>
<tr><td>5G</td><td>Cellular</td><td>City</td><td>High rate, low latency, dense devices</td></tr></table>
<h4>Wi-Fi facts</h4>
<ul class="bul">
<li>2.4 GHz travels farther but is crowded; 5 GHz is faster with shorter range.</li>
<li>Security order: WEP (broken) &rarr; WPA &rarr; WPA2 (AES) &rarr; WPA3.</li>
<li>A hotspot is one access point; SSID is the network name; BSSID is the AP's MAC.</li>
</ul>
<h4>Bluetooth</h4>
<ul class="bul">
<li>One master with up to seven active slaves forms a <b>piconet</b>; several piconets form a <b>scatternet</b>.</li>
<li>Frequency hopping spread spectrum in the 2.4 GHz band reduces interference.</li>
<li>Classic Bluetooth vs BLE: BLE trades throughput for very low power.</li>
</ul>
<h4>4G vs 5G</h4>
<p>4G LTE delivers tens of Mbps to hundreds of Mbps with about 20&ndash;30 ms latency. 5G targets multi-Gbps peaks, 1 ms class latency and up to a million devices per square kilometre, using mmWave for speed and sub-6 GHz for coverage.</p>
<div class="mn"><b>Remember:</b> 802.11 is Wi-Fi, 802.3 is Ethernet, 802.15.1 is Bluetooth, 802.16 is WiMAX.</div>`}
]});

NOTES_UNITS.push({u:6,topics:[
{id:"u6t1",t:"Malware types: virus, worm, trojan, ransomware, spyware",html:`
<table class="tbl"><tr><th>Type</th><th>Behaviour</th><th>Needs host file</th><th>Spreads alone</th></tr>
<tr><td>Virus</td><td>Attaches to a file, runs when that file runs</td><td>Yes</td><td>No</td></tr>
<tr><td>Worm</td><td>Self-replicates across networks</td><td>No</td><td>Yes</td></tr>
<tr><td>Trojan</td><td>Hides a payload inside useful software</td><td>No</td><td>No</td></tr>
<tr><td>Ransomware</td><td>Encrypts files and demands payment</td><td>Usually</td><td>Varies</td></tr>
<tr><td>Spyware / keylogger</td><td>Secretly records activity or keystrokes</td><td>No</td><td>No</td></tr>
<tr><td>Rootkit</td><td>Hides itself and attacker access inside the OS</td><td>No</td><td>No</td></tr>
<tr><td>Adware</td><td>Forces unwanted advertisements</td><td>No</td><td>Varies</td></tr>
<tr><td>Botnet agent</td><td>Joins a remote-controlled network of bots</td><td>No</td><td>Varies</td></tr></table>
<h4>Infection vectors</h4>
<ul class="bul">
<li>E-mail attachments and malicious links, pirated software, infected USB drives.</li>
<li>Unpatched services and exposed remote-desktop ports.</li>
<li>Drive-by downloads from compromised websites, malicious browser extensions.</li>
</ul>
<h4>Defence in practice</h4>
<ul class="bul">
<li>Keep the OS and applications patched; most attacks reuse known vulnerabilities.</li>
<li>Run one good antivirus/EDR with real-time protection and scheduled full scans.</li>
<li>Do not open unexpected attachments; verify the sender separately.</li>
<li>Keep offline backups — the only reliable answer to ransomware.</li>
</ul>
<div class="mn"><b>One-line discrimination:</b> virus needs a <i>file</i>, worm needs a <i>network</i>, trojan needs a <i>victim's trust</i>.</div>`},
{id:"u6t2",t:"Phishing, social engineering, DoS and DDoS attacks",html:`
<h4>Social engineering family</h4>
<ul class="bul">
<li><b>Phishing:</b> bulk fake e-mail or cloned login pages harvesting credentials.</li>
<li><b>Spear phishing:</b> targeted at one person with researched details.</li>
<li><b>Whaling:</b> aimed at senior executives.</li>
<li><b>Vishing / smishing:</b> voice call or SMS versions.</li>
<li><b>Pretexting / baiting:</b> a fabricated story or a tempting free download.</li>
</ul>
<h4>DoS and DDoS</h4>
<table class="tbl"><tr><th>Attack</th><th>Mechanism</th><th>Defence</th></tr>
<tr><td>SYN flood</td><td>Half-open connections exhaust the backlog queue</td><td>SYN cookies, rate limiting</td></tr>
<tr><td>UDP / ICMP flood</td><td>Volumetric saturation of bandwidth</td><td>Upstream scrubbing, filtering</td></tr>
<tr><td>HTTP flood</td><td>Legitimate-looking requests exhaust the app</td><td>WAF, CAPTCHA, autoscaling</td></tr>
<tr><td>Slowloris</td><td>Keeps many connections open with slow headers</td><td>Connection timeouts</td></tr>
<tr><td>Reflection / amplification</td><td>Spoofed requests to DNS or NTP servers</td><td>Ingress filtering, BCP38</td></tr></table>
<p>A DoS comes from one source; a DDoS uses a botnet of many hosts, which makes source blocking useless.</p>
<div class="warn"><b>Phishing defence is mostly process, not software:</b> verify the domain character by character, hover before clicking, never share OTPs, and enable multi-factor authentication so a stolen password is not enough.</div>`},
{id:"u6t3",t:"Symmetric and asymmetric encryption; AES, RSA, DES",html:`
<svg viewBox="0 0 520 160" class="dia" role="img" aria-label="Symmetric and asymmetric encryption">
<g font-size="11" fill="var(--ink)">
<rect x="8" y="10" width="240" height="140" rx="10" fill="var(--brand)" opacity=".08" stroke="var(--brand)"/>
<text x="128" y="30" text-anchor="middle" font-weight="600">Symmetric - one key</text>
<rect x="24" y="58" width="64" height="30" rx="6" fill="var(--brand)" opacity=".2" stroke="var(--brand)"/><text x="56" y="78" text-anchor="middle">Sender</text>
<rect x="168" y="58" width="64" height="30" rx="6" fill="var(--brand)" opacity=".2" stroke="var(--brand)"/><text x="200" y="78" text-anchor="middle">Receiver</text>
<path d="M88 66 H164" stroke="var(--brand)" stroke-width="2" marker-end="url(#sy)"/>
<path d="M164 82 H92" stroke="var(--brand)" stroke-width="2" marker-end="url(#sy)"/>
<text x="128" y="112" text-anchor="middle" font-size="10" fill="var(--muted)">same secret key K</text>
<rect x="96" y="120" width="64" height="20" rx="4" fill="var(--brand)" opacity=".3" stroke="var(--brand)"/><text x="128" y="134" text-anchor="middle" font-size="9">K</text>
<rect x="272" y="10" width="240" height="140" rx="10" fill="var(--brand)" opacity=".08" stroke="var(--brand)"/>
<text x="392" y="30" text-anchor="middle" font-weight="600">Asymmetric - key pair</text>
<rect x="288" y="58" width="64" height="30" rx="6" fill="var(--brand)" opacity=".2" stroke="var(--brand)"/><text x="320" y="78" text-anchor="middle">Sender</text>
<rect x="432" y="58" width="64" height="30" rx="6" fill="var(--brand)" opacity=".2" stroke="var(--brand)"/><text x="464" y="78" text-anchor="middle">Receiver</text>
<path d="M352 66 H428" stroke="var(--brand)" stroke-width="2" marker-end="url(#sy)"/>
<text x="392" y="58" text-anchor="middle" font-size="9" fill="var(--muted)">encrypt with public key</text>
<text x="392" y="106" text-anchor="middle" font-size="9" fill="var(--muted)">decrypt with private key</text>
<rect x="360" y="116" width="30" height="20" rx="4" fill="var(--brand)" opacity=".3" stroke="var(--brand)"/><text x="375" y="130" text-anchor="middle" font-size="9">Pub</text>
<rect x="396" y="116" width="30" height="20" rx="4" fill="var(--brand)" opacity=".3" stroke="var(--brand)"/><text x="411" y="130" text-anchor="middle" font-size="9">Priv</text>
<defs><marker id="sy" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--brand)"/></marker></defs>
</g></svg>

<table class="tbl"><tr><th>Point</th><th>Symmetric</th><th>Asymmetric</th></tr>
<tr><td>Keys</td><td>One shared secret</td><td>Public and private pair</td></tr>
<tr><td>Speed</td><td>Very fast, bulk data</td><td>Slow, small payloads</td></tr>
<tr><td>Examples</td><td>DES, 3DES, AES, Blowfish, ChaCha20</td><td>RSA, ECC, Diffie-Hellman, ElGamal</td></tr>
<tr><td>Main problem</td><td>Key distribution</td><td>Computational cost</td></tr>
<tr><td>Provides</td><td>Confidentiality</td><td>Key exchange, signatures, confidentiality</td></tr></table>
<h4>Details worth quoting</h4>
<ul class="bul">
<li><b>DES:</b> 56-bit key, 64-bit block — brute forceable today.</li>
<li><b>3DES:</b> about 112 effective bits after meet-in-the-middle; legacy.</li>
<li><b>AES:</b> 128-bit block with 128, 192 or 256-bit keys; the current standard.</li>
<li><b>RSA:</b> security rests on the difficulty of factoring the product of two large primes.</li>
<li><b>ECC:</b> equivalent security with much shorter keys, which suits mobile devices.</li>
</ul>
<h4>Hybrid encryption (what TLS really does)</h4>
<p>Asymmetric crypto authenticates the server and agrees on a session key; symmetric crypto then encrypts the actual traffic. That gives both security and speed.</p>
<div class="mn"><b>Which key when?</b> For secrecy, encrypt with the <i>receiver's public</i> key. For a signature, sign with the <i>sender's private</i> key.</div>`},
{id:"u6t4",t:"Hashing algorithms: MD5, SHA-1, SHA-256, salting",html:`
<table class="tbl"><tr><th>Algorithm</th><th>Digest</th><th>Status</th></tr>
<tr><td>MD5</td><td>128 bits</td><td>Broken for security, fine for checksums</td></tr>
<tr><td>SHA-1</td><td>160 bits</td><td>Deprecated, collisions demonstrated</td></tr>
<tr><td>SHA-256</td><td>256 bits</td><td>Recommended</td></tr>
<tr><td>SHA-3</td><td>224&ndash;512 bits</td><td>Modern alternative construction</td></tr>
<tr><td>bcrypt / Argon2</td><td>Variable, salted, slow</td><td>Correct choice for passwords</td></tr></table>
<h4>Properties</h4>
<ul class="bul">
<li><b>Deterministic:</b> the same input always gives the same digest.</li>
<li><b>Fixed length:</b> any input size gives a fixed-size output.</li>
<li><b>Pre-image resistant:</b> you cannot recover the input from the digest.</li>
<li><b>Collision resistant:</b> finding two inputs with one digest must be infeasible.</li>
<li><b>Avalanche effect:</b> one changed bit changes about half the output bits.</li>
</ul>
<h4>Salting and peppering</h4>
<p>A <b>salt</b> is a unique random value stored beside each hash, so identical passwords produce different digests and precomputed rainbow tables become useless. A <b>pepper</b> is a single secret value added to all hashes and stored separately, adding a layer if the database leaks.</p>
<div class="warn"><b>Hashing is not encryption:</b> there is no key and no decryption. Hashes provide integrity, encryption provides confidentiality. A MAC combines both ideas with a shared key.</div>`},
{id:"u6t5",t:"Firewalls, antivirus, IDS, secure coding practices",html:`
<h4>Firewall types</h4>
<table class="tbl"><tr><th>Type</th><th>Looks at</th><th>Note</th></tr>
<tr><td>Packet filter</td><td>Source/destination IP, port, protocol</td><td>Stateless, fast, easy to bypass</td></tr>
<tr><td>Stateful inspection</td><td>Connection state table</td><td>Understands replies to outgoing requests</td></tr>
<tr><td>Application proxy</td><td>Full payload at layer 7</td><td>Deep control, slower</td></tr>
<tr><td>NGFW</td><td>App awareness, IPS, TLS inspection</td><td>Modern enterprise default</td></tr>
<tr><td>WAF</td><td>HTTP requests</td><td>Blocks SQL injection and XSS patterns</td></tr></table>
<h4>Detection systems</h4>
<ul class="bul">
<li><b>IDS</b> monitors and alerts; <b>IPS</b> sits inline and blocks.</li>
<li><b>Signature based</b> detection is accurate for known attacks; <b>anomaly based</b> catches unknown behaviour but raises false alarms.</li>
<li>Antivirus uses signatures plus heuristics and sandboxing; it is not a substitute for patching.</li>
</ul>
<h4>Secure coding rules</h4>
<ul class="bul">
<li>Validate input on the server, never trust the client.</li>
<li>Use parameterised queries; never concatenate SQL.</li>
<li>Escape output for the context (HTML, attribute, JavaScript, URL).</li>
<li>Apply least privilege to database accounts and service users.</li>
<li>Never hard-code secrets; store them in a secret manager or environment.</li>
<li>Hash passwords with a slow salted algorithm; enforce HTTPS everywhere.</li>
<li>Keep dependencies patched and remove unused packages.</li>
</ul>
<div class="mn"><b>Defence in depth:</b> firewall at the edge, patching and EDR on endpoints, encryption and backups for data, MFA and least privilege for identity.</div>`},
{id:"u6t6",t:"SSL/TLS, digital certificates, PKI, CA and chain of trust",html:`
<svg viewBox="0 0 560 150" class="dia" role="img" aria-label="Digital signature flow">
<g font-size="11" fill="var(--ink)">
<rect x="8" y="20" width="96" height="34" rx="6" fill="var(--brand)" opacity=".16" stroke="var(--brand)"/><text x="56" y="42" text-anchor="middle">Message</text>
<rect x="130" y="20" width="86" height="34" rx="6" fill="var(--brand)" opacity=".16" stroke="var(--brand)"/><text x="173" y="42" text-anchor="middle">Hash</text>
<rect x="242" y="20" width="120" height="34" rx="6" fill="var(--brand)" opacity=".22" stroke="var(--brand)"/><text x="302" y="42" text-anchor="middle">Sign with private key</text>
<rect x="388" y="20" width="160" height="34" rx="6" fill="var(--brand)" opacity=".16" stroke="var(--brand)"/><text x="468" y="42" text-anchor="middle">Signature attached</text>
<path d="M104 37 H128" stroke="var(--brand)" stroke-width="1.6"/><path d="M216 37 H240" stroke="var(--brand)" stroke-width="1.6"/><path d="M362 37 H386" stroke="var(--brand)" stroke-width="1.6"/>
<rect x="130" y="96" width="86" height="34" rx="6" fill="var(--brand)" opacity=".16" stroke="var(--brand)"/><text x="173" y="118" text-anchor="middle">Hash again</text>
<rect x="242" y="96" width="120" height="34" rx="6" fill="var(--brand)" opacity=".16" stroke="var(--brand)"/><text x="302" y="118" text-anchor="middle">Verify with public key</text>
<rect x="388" y="96" width="160" height="34" rx="6" fill="var(--brand)" opacity=".2" stroke="var(--brand)"/><text x="468" y="118" text-anchor="middle">Match = authentic, intact</text>
<path d="M216 113 H240" stroke="var(--brand)" stroke-width="1.6"/><path d="M362 113 H386" stroke="var(--brand)" stroke-width="1.6"/>
</g>
</svg>
<h4>TLS handshake in five steps</h4>
<ol class="num">
<li>ClientHello: supported versions, cipher suites, random value.</li>
<li>ServerHello plus the certificate chain.</li>
<li>Client verifies the chain up to a trusted root CA and checks the name and validity dates.</li>
<li>Key exchange (ECDHE) produces a shared session key.</li>
<li>Finished messages, then encrypted application data.</li>
</ol>
<h4>PKI components</h4>
<ul class="bul">
<li><b>CA:</b> signs certificates; the root CA anchors trust.</li>
<li><b>RA:</b> verifies identity before the CA issues.</li>
<li><b>Certificate:</b> subject, public key, validity, issuer, CA signature.</li>
<li><b>CRL / OCSP:</b> publish and query revocations.</li>
<li><b>Chain of trust:</b> root &rarr; intermediate &rarr; end entity.</li>
</ul>
<h4>What a certificate proves</h4>
<p>That the public key belongs to the named subject, as vouched for by a trusted CA. It does not prove the site is honest, only that the key and the domain name match.</p>
<div class="warn"><b>Non-repudiation</b> comes only from a digital signature, never from a plain hash or a shared-key MAC.</div>`},
{id:"u6t7",t:"Authentication: 2FA, OTP, Kerberos, digital signatures",html:`
<h4>Factors</h4>
<ul class="bul">
<li><b>Something you know:</b> password, PIN, pattern.</li>
<li><b>Something you have:</b> phone OTP, hardware token, smart card.</li>
<li><b>Something you are:</b> fingerprint, face, iris.</li>
<li>Two factors must come from <i>different</i> categories — two passwords is not 2FA.</li>
</ul>
<h4>Kerberos</h4>
<p>A trusted third party (KDC) issues time-limited tickets. The client authenticates once, receives a ticket-granting ticket, and presents service tickets thereafter. Passwords never travel over the network, and tickets expire quickly.</p>
<h4>Digital signature</h4>
<ul class="bul">
<li>Sign: hash the message, encrypt the hash with the sender's private key.</li>
<li>Verify: decrypt with the sender's public key and compare hashes.</li>
<li>Provides authentication, integrity and non-repudiation — but not confidentiality.</li>
</ul>
<h4>Other mechanisms</h4>
<ul class="bul">
<li><b>Biometrics:</b> convenient but irreversible if leaked, so it should be a local unlock, not a server secret.</li>
<li><b>SSO:</b> one login for many apps; a compromise spreads widely, so MFA matters.</li>
<li><b>CAPTCHA:</b> separates humans from bots, not a substitute for authentication.</li>
</ul>
<div class="mn"><b>Password storage:</b> salted bcrypt or Argon2, never MD5 or plain SHA-256 — fast hashes are easy to brute force offline.</div>`},
{id:"u6t8",t:"Web attacks: SQL injection, XSS, CSRF and mitigations",html:`
<table class="tbl"><tr><th>Attack</th><th>How it works</th><th>Defence</th></tr>
<tr><td>SQL injection</td><td>Input becomes SQL code, e.g. ' OR 1=1 --</td><td>Parameterised queries, least privilege, input validation</td></tr>
<tr><td>XSS (stored/reflected)</td><td>Attacker's script runs in the victim's browser</td><td>Output encoding, Content-Security-Policy, HttpOnly cookies</td></tr>
<tr><td>CSRF</td><td>Victim's browser sends an authenticated forged request</td><td>Anti-CSRF tokens, SameSite cookies, re-authentication</td></tr>
<tr><td>Clickjacking</td><td>Invisible frame tricks the user into clicking</td><td>X-Frame-Options, frame-ancestors CSP</td></tr>
<tr><td>Session hijacking</td><td>Stolen cookie impersonates the user</td><td>HTTPS, HttpOnly and Secure flags, session rotation</td></tr>
<tr><td>Directory traversal</td><td>../ in a path reads other files</td><td>Canonicalise and whitelist paths</td></tr></table>
<h4>Why injection still happens</h4>
<p>Because user input is concatenated into a command or query, so the boundary between code and data disappears. Parameter binding sends data separately from the statement, which removes the flaw entirely rather than filtering for bad characters.</p>
<h4>Same-origin policy</h4>
<p>Scripts from one origin cannot read responses from another unless the target allows it through CORS. This is what limits the damage of XSS to the affected site's origin.</p>
<div class="warn"><b>Remember the OWASP idea:</b> validate on the server, encode on output, parameterise queries, and never trust anything that arrives from the browser.</div>`}
]});

NOTES_UNITS.push({u:7,topics:[
{id:"u7t1",t:"Language basics: C, C++, Python, Java characteristics",html:`
<table class="tbl"><tr><th>Point</th><th>C</th><th>C++</th><th>Java</th><th>Python</th></tr>
<tr><td>Paradigm</td><td>Procedural</td><td>Procedural + OOP</td><td>Pure OOP (mostly)</td><td>Multi-paradigm</td></tr>
<tr><td>Execution</td><td>Compiled to machine code</td><td>Compiled</td><td>Bytecode on the JVM</td><td>Interpreted (CPython)</td></tr>
<tr><td>Typing</td><td>Static, weak</td><td>Static</td><td>Static, strong</td><td>Dynamic, strong</td></tr>
<tr><td>Memory</td><td>Manual malloc/free</td><td>Manual + RAII</td><td>Garbage collected</td><td>Reference counted + GC</td></tr>
<tr><td>Pointers</td><td>Yes</td><td>Yes</td><td>No (references only)</td><td>No</td></tr>
<tr><td>Blocks</td><td>Braces</td><td>Braces</td><td>Braces</td><td>Indentation</td></tr></table>
<h4>Where each is used</h4>
<ul class="bul">
<li><b>C:</b> operating systems, embedded firmware, drivers — close to the hardware.</li>
<li><b>C++:</b> games, high-performance libraries, trading systems.</li>
<li><b>Java:</b> enterprise back ends, Android (historically), large systems needing portability.</li>
<li><b>Python:</b> scripting, data science, automation, teaching.</li>
</ul>
<div class="mn"><b>Compilation pipeline (C):</b> source &rarr; preprocessor &rarr; compiler &rarr; assembler &rarr; linker &rarr; executable. Java instead compiles to bytecode and the JVM interprets or JIT-compiles it.</div>`},
{id:"u7t2",t:"Variables, data types, constants and scope",html:`
<h4>Size and range (typical 64-bit system)</h4>
<table class="tbl"><tr><th>Type</th><th>Size</th><th>Range</th></tr>
<tr><td>char</td><td>1 byte</td><td>&minus;128 to 127 (signed)</td></tr>
<tr><td>short</td><td>2 bytes</td><td>&minus;32,768 to 32,767</td></tr>
<tr><td>int</td><td>4 bytes</td><td>&minus;2,147,483,648 to 2,147,483,647</td></tr>
<tr><td>float</td><td>4 bytes</td><td>About 7 significant digits</td></tr>
<tr><td>double</td><td>8 bytes</td><td>About 15 significant digits</td></tr>
<tr><td>long long</td><td>8 bytes</td><td>&plusmn;9.2 &times; 10<sup>18</sup></td></tr></table>
<h4>Rules</h4>
<ul class="bul">
<li>Identifiers may contain letters, digits and underscore, cannot start with a digit, and are case sensitive.</li>
<li>Keywords such as <code>class</code> or <code>int</code> cannot be identifiers.</li>
<li><code>const</code> in C and C++, <code>final</code> in Java, and a convention of upper case in Python mark constants.</li>
<li>Python has no declaration: a name is bound to an object, and its type belongs to the object, not the name.</li>
</ul>
<h4>Scope</h4>
<ul class="bul">
<li><b>Local:</b> inside a block, destroyed on exit.</li>
<li><b>Global:</b> file scope, accessible to functions declared after it.</li>
<li><b>Static local:</b> lives for the whole program but is visible only inside the function; initialised once.</li>
<li><b>Shadowing:</b> an inner declaration hides the outer one; C++ reaches the global with <code>::name</code>.</li>
</ul>
<div class="warn"><b>Trap:</b> <code>sizeof(int)</code> is implementation defined. Never assume 2 bytes — that was true only on old 16-bit compilers.</div>`},
{id:"u7t3",t:"Operators and precedence; integer division and modulo",html:`
<h4>Precedence from high to low (abridged)</h4>
<table class="tbl"><tr><th>Level</th><th>Operators</th><th>Associativity</th></tr>
<tr><td>1</td><td>() [] . -&gt;</td><td>Left</td></tr>
<tr><td>2</td><td>! ~ ++ -- unary - * &amp; sizeof</td><td>Right</td></tr>
<tr><td>3</td><td>* / %</td><td>Left</td></tr>
<tr><td>4</td><td>+ &minus;</td><td>Left</td></tr>
<tr><td>5</td><td>&lt;&lt; &gt;&gt;</td><td>Left</td></tr>
<tr><td>6</td><td>&lt; , &lt;= , &gt; , &gt;=</td><td>Left</td></tr>
<tr><td>7</td><td>== , !=</td><td>Left</td></tr>
<tr><td>8</td><td>&amp;</td><td>Left</td></tr>
<tr><td>9</td><td>^</td><td>Left</td></tr>
<tr><td>10</td><td>|</td><td>Left</td></tr>
<tr><td>11</td><td>&amp;&amp;</td><td>Left</td></tr>
<tr><td>12</td><td>||</td><td>Left</td></tr>
<tr><td>13</td><td>?:</td><td>Right</td></tr>
<tr><td>14</td><td>= += -= etc.</td><td>Right</td></tr>
<tr><td>15</td><td>,</td><td>Left</td></tr></table>
<h4>Integer arithmetic</h4>
<ul class="bul">
<li><code>7 / 2</code> is <b>3</b>: integer division truncates toward zero.</li>
<li><code>7 % 2</code> is <b>1</b>: the sign of the remainder follows the dividend in C.</li>
<li><code>10 / 3 * 3</code> is <b>9</b>, not 10 — truncation happens before multiplication.</li>
<li>Use <code>7.0 / 2</code> for 3.5; mixing int and float promotes to float.</li>
</ul>
<h4>Increment and decrement</h4>
<ul class="bul">
<li><code>x++</code> returns the old value then increments; <code>++x</code> increments then returns.</li>
<li>Using a variable twice with side effects in one expression, such as <code>a++ + ++a</code>, is <b>undefined behaviour</b> in C.</li>
</ul>
<h4>Bitwise quick reference</h4>
<p>5 = 101, 3 = 011. So 5 &amp; 3 = 001 = 1, 5 | 3 = 111 = 7, 5 ^ 3 = 110 = 6. Left shift by k multiplies by 2<sup>k</sup>, right shift divides.</p>
<div class="mn"><b>Short-circuit:</b> in <code>a &amp;&amp; b</code>, if a is false, b is never evaluated — useful for guards like <code>if (p != NULL &amp;&amp; p-&gt;x &gt; 0)</code>.</div>`},
{id:"u7t4",t:"Control structures: if-else, switch, loops",html:`
<h4>Selection</h4>
<ul class="bul">
<li><code>if / else if / else</code> evaluates conditions in order; the first true branch runs.</li>
<li><code>switch</code> compares one integer or char expression against constant cases; without <code>break</code> execution falls through.</li>
<li>The ternary <code>cond ? a : b</code> is an expression, usable inside another expression.</li>
</ul>
<h4>Loops</h4>
<table class="tbl"><tr><th>Loop</th><th>Test</th><th>Minimum iterations</th><th>Best for</th></tr>
<tr><td>for</td><td>Before each pass</td><td>0</td><td>Known count</td></tr>
<tr><td>while</td><td>Before each pass</td><td>0</td><td>Unknown count</td></tr>
<tr><td>do-while</td><td>After each pass</td><td>1</td><td>Menu, retry</td></tr>
<tr><td>for-each / range</td><td>Per element</td><td>0</td><td>Collections</td></tr></table>
<h4>Jump statements</h4>
<ul class="bul">
<li><code>break</code> leaves the innermost loop or switch.</li>
<li><code>continue</code> skips to the next iteration.</li>
<li><code>return</code> leaves the function entirely.</li>
<li><code>goto</code> exists in C but is avoided except for cleanup paths.</li>
</ul>
<h4>Counting iterations</h4>
<p><code>for (i = 0; i &lt; 5; i++)</code> runs <b>5</b> times. <code>for (i = 1; i &lt;= n; i++)</code> runs n times. Nested loops multiply: two loops of n give n&sup2; iterations.</p>
<div class="mn"><b>Off-by-one habit:</b> state the first and last value of the loop variable explicitly before answering. Most loop MCQs are lost there, not in the body.</div>`},
{id:"u7t5",t:"Functions, parameters, recursion, call stack",html:`
<svg viewBox="0 0 420 190" class="dia" role="img" aria-label="Recursion call stack for factorial">
<g font-size="11" fill="var(--ink)">
<rect x="20" y="10" width="200" height="30" rx="5" fill="var(--brand)" opacity=".3" stroke="var(--brand)"/><text x="120" y="30" text-anchor="middle">fact(4) waits for 4 x fact(3)</text>
<rect x="40" y="46" width="200" height="30" rx="5" fill="var(--brand)" opacity=".26" stroke="var(--brand)"/><text x="140" y="66" text-anchor="middle">fact(3) waits for 3 x fact(2)</text>
<rect x="60" y="82" width="200" height="30" rx="5" fill="var(--brand)" opacity=".22" stroke="var(--brand)"/><text x="160" y="102" text-anchor="middle">fact(2) waits for 2 x fact(1)</text>
<rect x="80" y="118" width="200" height="30" rx="5" fill="var(--brand)" opacity=".18" stroke="var(--brand)"/><text x="180" y="138" text-anchor="middle">fact(1) returns 1  (base case)</text>
<path d="M300 30 V170" stroke="var(--brand)" stroke-width="1.6" marker-end="url(#st)"/>
<text x="310" y="106" font-size="9" fill="var(--muted)">unwinds</text>
<text x="200" y="176" text-anchor="middle" font-size="10" fill="var(--muted)">stack grows downward, then unwinds with the results</text>
<defs><marker id="st" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--brand)"/></marker></defs>
</g></svg>

<h4>Function anatomy</h4>
<ul class="bul">
<li>Declaration (prototype) tells the compiler the return type and parameter list; the definition supplies the body.</li>
<li>Return type <code>void</code> means no value is returned.</li>
<li>Default arguments and overloading exist in C++; Java and Python support overloading and default parameters respectively.</li>
</ul>
<h4>Parameter passing</h4>
<table class="tbl"><tr><th>Style</th><th>Meaning</th><th>Languages</th></tr>
<tr><td>By value</td><td>The callee gets a copy</td><td>C (always), Java for primitives</td></tr>
<tr><td>By reference</td><td>The callee can modify the caller's variable</td><td>C++ (&amp;), C via pointers</td></tr>
<tr><td>By object reference</td><td>The reference is copied, the object is shared</td><td>Java objects, Python</td></tr></table>
<h4>Recursion</h4>
<ul class="bul">
<li>Every recursive function needs a <b>base case</b>, otherwise the stack overflows.</li>
<li>Each call pushes an activation record: parameters, locals, return address.</li>
<li>Factorial: f(n) = n &times; f(n&minus;1), f(0) = 1.</li>
<li>Fibonacci with f(0)=0, f(1)=1 gives 0, 1, 1, 2, 3, 5, 8 — so f(6) = 8.</li>
<li>Recursion trades memory for clarity; iteration avoids stack growth.</li>
</ul>
<div class="warn"><b>Trap:</b> in C, arrays are not passed by value — the array name decays to a pointer to the first element, so the function can modify the caller's data.</div>`},
{id:"u7t6",t:"Pointers, arrays, strings and structures in C",html:`
<h4>Pointer essentials</h4>
<ul class="bul">
<li><code>int *p = &amp;x;</code> stores the address of x; <code>*p</code> reads the value at that address.</li>
<li><code>p + 1</code> advances by <b>sizeof(*p)</b> bytes, not one byte.</li>
<li><code>a[i]</code> is exactly <code>*(a + i)</code>.</li>
<li>A NULL pointer points to nothing; dereferencing it is undefined behaviour.</li>
<li>Array size = <code>sizeof(a) / sizeof(a[0])</code>, valid only where the array type is visible.</li>
</ul>
<h4>Strings</h4>
<ul class="bul">
<li>A C string is a char array terminated by <b>'\0'</b>, so "hi" needs 3 bytes.</li>
<li><code>strlen</code> counts characters before the terminator; <code>sizeof</code> counts the whole array including it.</li>
<li><code>strcpy</code> is unsafe; <code>strncpy</code> bounds the copy but may not terminate the string.</li>
<li><code>strcmp</code> returns 0 when equal, negative or positive otherwise.</li>
</ul>
<h4>Structs and unions</h4>
<ul class="bul">
<li><b>struct:</b> each member has its own memory; total size includes padding for alignment.</li>
<li><b>union:</b> all members share one area; size equals the largest member, and only one is valid at a time.</li>
<li><code>malloc</code> returns <code>void*</code> (NULL on failure); always <code>free</code> what you allocate.</li>
</ul>
<div class="mn"><b>Memory errors to name:</b> memory leak (no free), dangling pointer (used after free), double free, buffer overflow (no bounds check).</div>`},
{id:"u7t7",t:"OOP: class, object, encapsulation, inheritance, polymorphism",html:`
<svg viewBox="0 0 520 180" class="dia" role="img" aria-label="Four pillars of OOP">
<g font-size="11.5" fill="var(--ink)">
<rect x="8" y="60" width="118" height="80" rx="8" fill="var(--brand)" opacity=".18" stroke="var(--brand)"/><text x="67" y="88" text-anchor="middle" font-weight="600">Encapsulation</text><text x="67" y="108" text-anchor="middle" font-size="10" fill="var(--muted)">data + methods,</text><text x="67" y="122" text-anchor="middle" font-size="10" fill="var(--muted)">private fields</text>
<rect x="136" y="60" width="118" height="80" rx="8" fill="var(--brand)" opacity=".18" stroke="var(--brand)"/><text x="195" y="88" text-anchor="middle" font-weight="600">Inheritance</text><text x="195" y="108" text-anchor="middle" font-size="10" fill="var(--muted)">is-a, reuse,</text><text x="195" y="122" text-anchor="middle" font-size="10" fill="var(--muted)">extends</text>
<rect x="264" y="60" width="118" height="80" rx="8" fill="var(--brand)" opacity=".18" stroke="var(--brand)"/><text x="323" y="88" text-anchor="middle" font-weight="600">Polymorphism</text><text x="323" y="108" text-anchor="middle" font-size="10" fill="var(--muted)">one name,</text><text x="323" y="122" text-anchor="middle" font-size="10" fill="var(--muted)">many forms</text>
<rect x="392" y="60" width="118" height="80" rx="8" fill="var(--brand)" opacity=".18" stroke="var(--brand)"/><text x="451" y="88" text-anchor="middle" font-weight="600">Abstraction</text><text x="451" y="108" text-anchor="middle" font-size="10" fill="var(--muted)">hide details,</text><text x="451" y="122" text-anchor="middle" font-size="10" fill="var(--muted)">show contract</text>
<text x="260" y="34" text-anchor="middle" font-size="13" font-weight="600" fill="var(--ink)">OOP</text>
<line x1="260" y1="42" x2="67" y2="58" stroke="var(--brand)" stroke-width="1.4"/>
<line x1="260" y1="42" x2="195" y2="58" stroke="var(--brand)" stroke-width="1.4"/>
<line x1="260" y1="42" x2="323" y2="58" stroke="var(--brand)" stroke-width="1.4"/>
<line x1="260" y1="42" x2="451" y2="58" stroke="var(--brand)" stroke-width="1.4"/>
</g>
</svg>
<h4>Class vs object</h4>
<p>A class is the blueprint: fields plus methods. An object is an instance created at runtime with its own copy of the fields. The constructor initialises it and has no return type.</p>
<h4>Inheritance</h4>
<ul class="bul">
<li>Models an <b>is-a</b> relationship: a Car is a Vehicle.</li>
<li>Types: single, multilevel, hierarchical, multiple (C++ yes, Java via interfaces), hybrid.</li>
<li>C++ construction order: base constructor first, then derived; destruction in reverse.</li>
<li>Java and C++ both support <code>super</code>/<code>base</code> calls to the parent constructor.</li>
</ul>
<h4>Polymorphism</h4>
<ul class="bul">
<li><b>Compile-time:</b> overloading — same name, different parameter lists, resolved by the compiler.</li>
<li><b>Runtime:</b> overriding — same signature in a subclass, resolved through the vtable (C++ <code>virtual</code>, Java default).</li>
<li>One interface, many implementations: a single <code>draw()</code> call behaves differently for Circle and Square.</li>
</ul>
<div class="warn"><b>Trap:</b> a <code>static</code> or <code>private</code> method is not polymorphic; it is resolved by the reference type, not the object type.</div>`},
{id:"u7t8",t:"Abstraction, overloading vs overriding, abstract classes",html:`
<table class="tbl"><tr><th>Point</th><th>Overloading</th><th>Overriding</th></tr>
<tr><td>Signature</td><td>Same name, different parameters</td><td>Same name and parameters</td></tr>
<tr><td>Binding</td><td>Compile time (static)</td><td>Run time (dynamic)</td></tr>
<tr><td>Inheritance needed</td><td>No</td><td>Yes</td></tr>
<tr><td>Return type</td><td>May differ</td><td>Same or covariant</td></tr>
<tr><td>Mechanism</td><td>Name mangling</td><td>vtable / virtual dispatch</td></tr></table>
<h4>Abstract classes and interfaces</h4>
<ul class="bul">
<li>An abstract class cannot be instantiated and may declare abstract methods that subclasses must implement.</li>
<li>C++ uses a pure virtual function (<code>= 0</code>); Java uses the <code>abstract</code> keyword.</li>
<li>An interface declares a contract with no state; Java allows multiple interface implementation to avoid the diamond problem.</li>
<li>Abstraction is about <i>what</i> an object does; encapsulation is about <i>hiding how</i> it does it.</li>
</ul>
<h4>Access modifiers</h4>
<table class="tbl"><tr><th>Modifier</th><th>Same class</th><th>Subclass</th><th>Outside</th></tr>
<tr><td>private</td><td>Yes</td><td>No</td><td>No</td></tr>
<tr><td>protected</td><td>Yes</td><td>Yes</td><td>No</td></tr>
<tr><td>public</td><td>Yes</td><td>Yes</td><td>Yes</td></tr>
<tr><td>default (Java)</td><td>Yes</td><td>Same package</td><td>Same package</td></tr></table>
<div class="mn"><b>Mnemonic:</b> over<b>load</b> = <b>L</b>ots of versions decided early; over<b>ride</b> = <b>R</b>eplacement decided at runtime.</div>`}
]});

NOTES_UNITS.push({u:8,topics:[
{id:"u8t1",t:"SDLC phases: requirement, design, coding, testing, maintenance",html:`
<svg viewBox="0 0 560 120" class="dia" role="img" aria-label="SDLC phases">
<g font-size="10.5" fill="var(--ink)">
<rect x="6" y="34" width="100" height="46" rx="6" fill="var(--brand)" opacity=".16" stroke="var(--brand)"/><text x="56" y="55" text-anchor="middle">Requirement</text><text x="56" y="70" text-anchor="middle" font-size="9" fill="var(--muted)">SRS</text>
<rect x="118" y="34" width="94" height="46" rx="6" fill="var(--brand)" opacity=".18" stroke="var(--brand)"/><text x="165" y="55" text-anchor="middle">Design</text><text x="165" y="70" text-anchor="middle" font-size="9" fill="var(--muted)">HLD/LLD</text>
<rect x="224" y="34" width="94" height="46" rx="6" fill="var(--brand)" opacity=".2" stroke="var(--brand)"/><text x="271" y="55" text-anchor="middle">Coding</text><text x="271" y="70" text-anchor="middle" font-size="9" fill="var(--muted)">modules</text>
<rect x="330" y="34" width="94" height="46" rx="6" fill="var(--brand)" opacity=".22" stroke="var(--brand)"/><text x="377" y="55" text-anchor="middle">Testing</text><text x="377" y="70" text-anchor="middle" font-size="9" fill="var(--muted)">verification</text>
<rect x="436" y="34" width="114" height="46" rx="6" fill="var(--brand)" opacity=".24" stroke="var(--brand)"/><text x="493" y="55" text-anchor="middle">Deployment</text><text x="493" y="70" text-anchor="middle" font-size="9" fill="var(--muted)">+ maintenance</text>
<path d="M106 57 H116" stroke="var(--brand)" stroke-width="1.6"/><path d="M212 57 H222" stroke="var(--brand)" stroke-width="1.6"/><path d="M318 57 H328" stroke="var(--brand)" stroke-width="1.6"/><path d="M424 57 H434" stroke="var(--brand)" stroke-width="1.6"/>
<path d="M493 84 C 493 106, 56 106, 56 84" stroke="var(--brand)" stroke-width="1.4" fill="none" stroke-dasharray="4 3"/>
<text x="275" y="116" text-anchor="middle" font-size="9" fill="var(--muted)">feedback loop</text>
</g>
</svg>
<h4>What each phase produces</h4>
<table class="tbl"><tr><th>Phase</th><th>Activity</th><th>Deliverable</th></tr>
<tr><td>Requirement</td><td>Elicit, analyse and agree on needs</td><td>SRS, use cases</td></tr>
<tr><td>Design</td><td>Architecture, modules, interfaces, data design</td><td>HLD, LLD, ER diagrams</td></tr>
<tr><td>Coding</td><td>Implement modules to the design</td><td>Source code, unit tests</td></tr>
<tr><td>Testing</td><td>Verify against requirements</td><td>Test cases, defect reports</td></tr>
<tr><td>Deployment</td><td>Release and train users</td><td>Installed system, manuals</td></tr>
<tr><td>Maintenance</td><td>Fix, adapt, improve</td><td>Patches, new versions</td></tr></table>
<h4>Functional vs non-functional</h4>
<ul class="bul">
<li><b>Functional:</b> what the system does — "user can reset a password".</li>
<li><b>Non-functional:</b> how well — performance, security, usability, availability.</li>
<li>A good SRS is complete, consistent, unambiguous, verifiable and traceable.</li>
</ul>
<div class="mn"><b>Cost curve:</b> a defect found in maintenance costs many times more than one caught in review. That single fact drives most model choices.</div>`},
{id:"u8t2",t:"Waterfall, spiral, prototype and incremental models",html:`
<table class="tbl"><tr><th>Model</th><th>Shape</th><th>Best when</th><th>Risk</th></tr>
<tr><td>Waterfall</td><td>Sequential, no overlap</td><td>Fixed, well-understood requirements</td><td>Late defect discovery</td></tr>
<tr><td>Prototype</td><td>Build, show, refine</td><td>Unclear user requirements</td><td>Scope creep, throwaway effort</td></tr>
<tr><td>Spiral</td><td>Risk-driven loops</td><td>Large, high-risk projects</td><td>Expensive for small work</td></tr>
<tr><td>Incremental</td><td>Usable parts delivered</td><td>Early value needed</td><td>Integration overhead</td></tr>
<tr><td>V-model</td><td>Design paired with tests</td><td>Safety-critical verification</td><td>Rigid to change</td></tr>
<tr><td>Agile</td><td>Sprints of 2&ndash;4 weeks</td><td>Changing requirements</td><td>Needs a disciplined team</td></tr></table>
<h4>Waterfall in detail</h4>
<p>Each phase must be completed and signed off before the next begins. Documentation is heavy, progress is measurable, and contracts are easy to write. The weakness is that working software appears only at the end, so a wrong requirement is discovered very late.</p>
<h4>Spiral in detail</h4>
<p>Four quadrants per loop: determine objectives, identify and resolve risks, develop and verify, plan the next iteration. Every cycle ends with a review, which is why it suits large projects where risk management matters more than speed.</p>
<div class="mn"><b>Selection logic:</b> stable requirements &rarr; waterfall; unclear requirements &rarr; prototype or agile; high risk &rarr; spiral; regulatory verification &rarr; V-model.</div>`},
{id:"u8t3",t:"Agile and Scrum: sprint, backlog, roles, ceremonies",html:`
<h4>The Agile manifesto in four lines</h4>
<ul class="bul">
<li>Individuals and interactions over processes and tools.</li>
<li>Working software over comprehensive documentation.</li>
<li>Customer collaboration over contract negotiation.</li>
<li>Responding to change over following a plan.</li>
</ul>
<h4>Scrum roles</h4>
<table class="tbl"><tr><th>Role</th><th>Owns</th></tr>
<tr><td>Product Owner</td><td>The product backlog and business value</td></tr>
<tr><td>Scrum Master</td><td>The process, removing blockers, coaching</td></tr>
<tr><td>Development team</td><td>How to build, self-organising</td></tr></table>
<h4>Ceremonies</h4>
<ul class="bul">
<li><b>Sprint planning:</b> choose backlog items and define the sprint goal.</li>
<li><b>Daily stand-up:</b> about 15 minutes — yesterday, today, blockers.</li>
<li><b>Sprint review:</b> demonstrate the increment to stakeholders.</li>
<li><b>Retrospective:</b> improve the process for the next sprint.</li>
</ul>
<h4>Artifacts</h4>
<ul class="bul">
<li>Product backlog (everything wanted), sprint backlog (this sprint), increment (working software).</li>
<li>Definition of Done: the shared checklist a story must satisfy.</li>
<li>Velocity: story points completed per sprint, used for forecasting.</li>
<li>Burndown chart: remaining work versus time.</li>
</ul>
<div class="mn"><b>Waterfall vs Agile:</b> one big release versus many small ones; change is expensive versus welcome; documentation first versus working software first.</div>`},
{id:"u8t4",t:"Testing levels: unit, integration, system, acceptance",html:`
<svg viewBox="0 0 420 200" class="dia" role="img" aria-label="Testing pyramid">
<g font-size="11" fill="var(--ink)">
<polygon points="210,12 260,72 160,72" fill="var(--brand)" opacity=".85"/>
<polygon points="155,78 265,78 300,128 120,128" fill="var(--brand)" opacity=".6"/>
<polygon points="115,134 305,134 350,184 70,184" fill="var(--brand)" opacity=".36"/>
<text x="210" y="56" text-anchor="middle" font-size="10" fill="#fff">Acceptance</text>
<text x="210" y="110" text-anchor="middle" font-size="11">System</text>
<text x="210" y="166" text-anchor="middle" font-size="11">Integration + Unit (many, fast, automated)</text>
<text x="372" y="60" font-size="9" fill="var(--muted)">few</text>
<text x="372" y="176" font-size="9" fill="var(--muted)">many</text>
</g></svg>

<table class="tbl"><tr><th>Level</th><th>Scope</th><th>Done by</th><th>Helpers</th></tr>
<tr><td>Unit</td><td>One function or module</td><td>Developer</td><td>Stubs and drivers</td></tr>
<tr><td>Integration</td><td>Interfaces between modules</td><td>Dev / QA</td><td>Top-down, bottom-up, sandwich</td></tr>
<tr><td>System</td><td>Whole product against the SRS</td><td>QA</td><td>Test environment</td></tr>
<tr><td>Acceptance</td><td>Fitness for user needs</td><td>Customer</td><td>Alpha (in-house), Beta (users)</td></tr>
<tr><td>Regression</td><td>Old features after a change</td><td>QA</td><td>Automated suite</td></tr></table>
<h4>Integration strategies</h4>
<ul class="bul">
<li><b>Top-down:</b> start from the main module, use stubs for lower levels.</li>
<li><b>Bottom-up:</b> start from the leaves, use drivers to call them.</li>
<li><b>Sandwich / hybrid:</b> both directions at once.</li>
<li><b>Big bang:</b> everything at once — quick but hard to isolate failures.</li>
</ul>
<h4>Special purpose</h4>
<ul class="bul">
<li><b>Smoke:</b> is the build stable enough to test?</li>
<li><b>Sanity:</b> does the specific fix work?</li>
<li><b>Load / stress:</b> performance under expected and extreme load.</li>
<li><b>Security:</b> penetration testing and vulnerability scanning.</li>
</ul>
<div class="mn"><b>Stub vs driver:</b> a stub stands in for a module the unit <i>calls</i>; a driver stands in for a module that <i>calls</i> the unit.</div>`},
{id:"u8t5",t:"Black-box vs white-box testing techniques",html:`
<table class="tbl"><tr><th>Point</th><th>Black-box</th><th>White-box</th></tr>
<tr><td>Code knowledge</td><td>None</td><td>Full</td></tr>
<tr><td>Also called</td><td>Functional, behavioural</td><td>Structural, glass-box</td></tr>
<tr><td>Techniques</td><td>Equivalence partitioning, boundary value, decision table, state transition</td><td>Statement, branch, path, condition coverage</td></tr>
<tr><td>Finds</td><td>Missing or wrong behaviour</td><td>Dead code, unreachable paths, logic gaps</td></tr>
<tr><td>Done by</td><td>Tester or user</td><td>Developer</td></tr></table>
<h4>Technique recipes</h4>
<ul class="bul">
<li><b>Equivalence partitioning:</b> split inputs into classes that should behave alike and test one from each.</li>
<li><b>Boundary value analysis:</b> for 1&ndash;100 test 0, 1, 2, 99, 100, 101 — six values.</li>
<li><b>Decision table:</b> enumerate every combination of conditions and actions.</li>
<li><b>Statement coverage:</b> every line executed at least once.</li>
<li><b>Branch coverage:</b> every decision true and false at least once.</li>
<li><b>Path coverage:</b> every independent path, the strongest and costliest.</li>
</ul>
<div class="warn"><b>Key distinction:</b> 100% statement coverage does not guarantee 100% branch coverage — a short-circuited condition can leave a branch untested.</div>`},
{id:"u8t6",t:"Verification vs validation; regression and smoke testing",html:`
<table class="tbl"><tr><th>Point</th><th>Verification</th><th>Validation</th></tr>
<tr><td>Question</td><td>Are we building the product right?</td><td>Are we building the right product?</td></tr>
<tr><td>Checks</td><td>Conformance to specification</td><td>Fitness for user needs</td></tr>
<tr><td>Method</td><td>Reviews, walkthroughs, static analysis</td><td>Execution and acceptance testing</td></tr>
<tr><td>When</td><td>During development</td><td>End of development</td></tr></table>
<h4>Regression testing</h4>
<p>Re-running relevant tests after a change to confirm nothing broke. It is the reason automated suites matter: manual regression is too slow to run on every commit. A good suite is prioritised by risk, not by size.</p>
<h4>Smoke vs sanity</h4>
<ul class="bul">
<li><b>Smoke:</b> a shallow build check — "is it worth testing this build?"</li>
<li><b>Sanity:</b> a narrow deep check of one fixed area — "does the fix actually work?"</li>
</ul>
<h4>Defect life cycle</h4>
<p>New &rarr; Assigned &rarr; Open &rarr; Fixed &rarr; Retest &rarr; Closed, with Reopen and Deferred as branches. A good bug report has environment, steps, expected result and actual result.</p>
<div class="mn"><b>Remember:</b> verification is static, validation is dynamic. Any option pairing "execution" with verification is wrong.</div>`},
{id:"u8t7",t:"Coupling, cohesion, cyclomatic complexity",html:`
<h4>Cohesion (within a module) — high is good</h4>
<table class="tbl"><tr><th>Type</th><th>Quality</th></tr>
<tr><td>Functional</td><td>Best: one task, one module</td></tr>
<tr><td>Sequential</td><td>Output of one step is input to the next</td></tr>
<tr><td>Communicational</td><td>Operates on the same data</td></tr>
<tr><td>Temporal</td><td>Same time (initialisation)</td></tr>
<tr><td>Logical</td><td>Similar category, selected by a flag</td></tr>
<tr><td>Coincidental</td><td>Worst: no real relationship</td></tr></table>
<h4>Coupling (between modules) — low is good</h4>
<table class="tbl"><tr><th>Type</th><th>Quality</th></tr>
<tr><td>Data</td><td>Best: only simple data passed</td></tr>
<tr><td>Stamp</td><td>Whole structure passed</td></tr>
<tr><td>Control</td><td>A flag tells the other module what to do</td></tr>
<tr><td>Common</td><td>Shared global data</td></tr>
<tr><td>Content</td><td>Worst: one module modifies another's internals</td></tr></table>
<h4>Cyclomatic complexity</h4>
<p><b>V(G) = E &minus; N + 2P</b> for a flow graph with E edges, N nodes and P connected components. It equals the number of independent paths and therefore the minimum number of test cases for branch coverage. A graph with 12 edges and 10 nodes in one component gives V = 4.</p>
<p>Typical guidance: 1&ndash;10 simple, 11&ndash;20 moderate, 21&ndash;50 complex and risky, above 50 untestable — refactor.</p>
<div class="mn"><b>Design goal:</b> high cohesion and low coupling. Say it in exactly those words and the MCQ is answered.</div>`},
{id:"u8t8",t:"SRS, traceability, configuration management, DevOps basics",html:`
<h4>SRS (Software Requirements Specification)</h4>
<ul class="bul">
<li>Records functional and non-functional requirements agreed with the customer.</li>
<li>Qualities: complete, consistent, unambiguous, verifiable, traceable, modifiable.</li>
<li>Sections typically cover scope, interfaces, functional requirements, performance, security and constraints.</li>
</ul>
<h4>Traceability matrix</h4>
<p>Maps each requirement to its design element and test case, proving nothing is unimplemented and nothing is untested. It is the first artifact an auditor asks for.</p>
<h4>Configuration management</h4>
<ul class="bul">
<li>Identifies configuration items: code, documents, build scripts, test data.</li>
<li>Controls changes through baselines and change requests.</li>
<li>Records status and audits that what was built is what was approved.</li>
<li>Version control (Git) is the practical tool underneath.</li>
</ul>
<h4>DevOps vocabulary</h4>
<ul class="bul">
<li><b>CI:</b> merge and build frequently with automated tests.</li>
<li><b>CD (delivery):</b> every change is release ready; deployment is a manual decision.</li>
<li><b>CD (deployment):</b> every change that passes tests goes to production automatically.</li>
<li><b>Infrastructure as code, monitoring, blue-green and canary releases</b> reduce the blast radius of a bad deploy.</li>
</ul>
<div class="mn"><b>Metric to quote:</b> defect removal efficiency = defects found before release / total defects. Higher is better and it pairs naturally with the cost curve.</div>`}
]});

NOTES_UNITS.push({u:9,topics:[
{id:"u9t1",t:"HTML structure, tags, semantic elements, forms",html:`
<h4>Document skeleton</h4>
<p><code>&lt;!DOCTYPE html&gt;</code> then <code>&lt;html&gt;</code> containing <code>&lt;head&gt;</code> (meta, title, link, script) and <code>&lt;body&gt;</code> (visible content). The viewport meta tag is what makes a page usable on a phone.</p>
<h4>Semantic elements</h4>
<table class="tbl"><tr><th>Tag</th><th>Purpose</th><th>Note</th></tr>
<tr><td>header / nav / footer</td><td>Page landmarks</td><td>One main per page</td></tr>
<tr><td>main</td><td>Primary content</td><td>Should appear once</td></tr>
<tr><td>section / article</td><td>Thematic blocks</td><td>article is self-contained</td></tr>
<tr><td>aside</td><td>Side content</td><td>Related links, ads</td></tr>
<tr><td>figure / figcaption</td><td>Image with caption</td><td>Accessible media</td></tr></table>
<h4>Lists, links and media</h4>
<ul class="bul">
<li><code>ul</code> bulleted, <code>ol</code> numbered, <code>li</code> an item, <code>dl/dt/dd</code> a description list.</li>
<li><code>a href="..."</code> links; <code>target="_blank"</code> opens a new tab and should be paired with <code>rel="noopener"</code>.</li>
<li><code>img src alt</code> — the alt text matters for screen readers and failed loads.</li>
<li><code>table/tr/th/td</code> for tabular data only, never for layout.</li>
</ul>
<h4>Forms</h4>
<ul class="bul">
<li><code>form action method</code> — GET puts data in the URL, POST puts it in the body.</li>
<li><code>input type</code> can be text, email, password, number, date, checkbox, radio, file, hidden.</li>
<li><code>label for="id"</code> binds the label to the control and improves accessibility.</li>
<li><code>required</code>, <code>minlength</code>, <code>pattern</code> give browser-side validation — never enough on its own.</li>
<li><code>select/option</code> for a dropdown, <code>textarea</code> for multi-line text.</li>
</ul>
<div class="mn"><b>Block vs inline:</b> div, p, h1, ul are block (full width); span, a, b, img are inline. That single distinction explains most layout questions.</div>`},
{id:"u9t2",t:"CSS: selectors, specificity, box model, flexbox and grid",html:`
<svg viewBox="0 0 460 170" class="dia" role="img" aria-label="CSS box model">
<rect x="10" y="14" width="240" height="140" fill="var(--brand)" opacity=".1" stroke="var(--brand)" stroke-dasharray="4 3"/>
<text x="20" y="30" font-size="10" fill="var(--muted)">margin</text>
<rect x="40" y="40" width="180" height="90" fill="var(--brand)" opacity=".14" stroke="var(--brand)"/>
<text x="50" y="56" font-size="10" fill="var(--muted)">border</text>
<rect x="62" y="60" width="136" height="54" fill="var(--brand)" opacity=".18" stroke="var(--brand)"/>
<text x="72" y="76" font-size="10" fill="var(--muted)">padding</text>
<rect x="86" y="80" width="88" height="26" fill="var(--brand)" opacity=".35" stroke="var(--brand)"/>
<text x="130" y="97" text-anchor="middle" font-size="11" fill="#fff">content</text>
<text x="270" y="60" font-size="11" fill="var(--ink)">content-box (default):</text>
<text x="270" y="78" font-size="11" fill="var(--muted)">width = content only</text>
<text x="270" y="104" font-size="11" fill="var(--ink)">border-box:</text>
<text x="270" y="122" font-size="11" fill="var(--muted)">width = content + padding + border</text>
</svg>
<h4>Selectors and specificity</h4>
<table class="tbl"><tr><th>Selector</th><th>Specificity</th><th>Example</th></tr>
<tr><td>Inline style</td><td>1,0,0,0</td><td>style="..."</td></tr>
<tr><td>id</td><td>0,1,0,0</td><td>#box</td></tr>
<tr><td>class, attribute, pseudo-class</td><td>0,0,1,0</td><td>.box, [type], :hover</td></tr>
<tr><td>element, pseudo-element</td><td>0,0,0,1</td><td>div, ::before</td></tr>
<tr><td>universal</td><td>0,0,0,0</td><td>*</td></tr></table>
<p>Equal specificity means the later rule wins. <code>!important</code> beats normal declarations but is bad practice. A descendant selector like <code>#a .b</code> matches an element with class b <i>inside</i> #a; <code>#a.b</code> matches the same element.</p>
<h4>Layout</h4>
<table class="tbl"><tr><th>Point</th><th>Flexbox</th><th>Grid</th></tr>
<tr><td>Axis</td><td>One at a time</td><td>Rows and columns together</td></tr>
<tr><td>Use for</td><td>Navbars, button rows, centring</td><td>Page layout, card galleries</td></tr>
<tr><td>Key properties</td><td>justify-content, align-items, gap</td><td>grid-template-columns, gap, areas</td></tr></table>
<h4>Positioning and responsiveness</h4>
<ul class="bul">
<li><code>static</code> (default), <code>relative</code> (offset from itself), <code>absolute</code> (nearest positioned ancestor), <code>fixed</code> (viewport), <code>sticky</code> (until a threshold).</li>
<li><code>z-index</code> only applies to positioned elements or flex/grid children.</li>
<li>Units: px absolute, % relative to parent, em relative to font size, rem relative to root, vw/vh to the viewport.</li>
<li>Media queries at breakpoints plus <code>max-width: 100%</code> on images give responsive pages.</li>
</ul>
<div class="mn"><b>Always start with</b> <code>* { box-sizing: border-box; }</code> so declared widths include padding and border.</div>`},
{id:"u9t3",t:"JavaScript basics: variables, functions, arrays, objects",html:`
<h4>Declarations</h4>
<table class="tbl"><tr><th>Keyword</th><th>Scope</th><th>Reassignable</th><th>Hoisting</th></tr>
<tr><td>var</td><td>Function</td><td>Yes</td><td>Initialised to undefined</td></tr>
<tr><td>let</td><td>Block</td><td>Yes</td><td>Temporal dead zone</td></tr>
<tr><td>const</td><td>Block</td><td>No</td><td>Temporal dead zone</td></tr></table>
<h4>Types and coercion</h4>
<ul class="bul">
<li>Primitives: string, number, boolean, null, undefined, symbol, bigint. Everything else is an object.</li>
<li><code>typeof null</code> is <code>"object"</code> — a historical bug kept for compatibility.</li>
<li><code>==</code> coerces types, <code>===</code> does not: '5' == 5 is true, '5' === 5 is false.</li>
<li><code>0.1 + 0.2 === 0.3</code> is false because of binary floating point.</li>
<li>Falsy values: false, 0, "", null, undefined, NaN. Empty arrays and objects are truthy.</li>
</ul>
<h4>Functions and arrays</h4>
<ul class="bul">
<li>Function declarations hoist; arrow functions do not, and they do not bind their own <code>this</code>.</li>
<li><code>map</code> transforms, <code>filter</code> selects, <code>reduce</code> folds, <code>forEach</code> iterates without returning.</li>
<li><code>push/pop</code> work at the end, <code>shift/unshift</code> at the start, <code>slice</code> copies, <code>splice</code> mutates.</li>
<li>[1,2,3].map(x =&gt; x*2).filter(x =&gt; x&gt;2) gives [4,6].</li>
</ul>
<h4>Objects and JSON</h4>
<ul class="bul">
<li><code>JSON.stringify</code> turns an object into text; <code>JSON.parse</code> turns text into an object.</li>
<li><code>Object.assign({}, obj)</code> or the spread operator makes a shallow copy; nested objects are still shared.</li>
<li>A closure is an inner function that keeps access to its outer variables after the outer call returns.</li>
</ul>
<div class="warn"><b>Trap:</b> a function declared with <code>var</code> inside a loop captures the final value; <code>let</code> creates a fresh binding per iteration.</div>`},
{id:"u9t4",t:"DOM manipulation and event handling",html:`
<svg viewBox="0 0 520 180" class="dia" role="img" aria-label="DOM tree">

<text x="410" y="140" font-size="10" fill="var(--muted)">querySelector,</text>
<text x="410" y="154" font-size="10" fill="var(--muted)">textContent, classList</text>
</g>
</svg>
<h4>Selecting and changing</h4>
<table class="tbl"><tr><th>Task</th><th>API</th></tr>
<tr><td>One element</td><td>getElementById('id'), querySelector('.cls')</td></tr>
<tr><td>Many elements</td><td>querySelectorAll — returns a static NodeList</td></tr>
<tr><td>Text</td><td>el.textContent = 'x' (safe), innerHTML (parses HTML)</td></tr>
<tr><td>Class</td><td>el.classList.add/remove/toggle</td></tr>
<tr><td>Style</td><td>el.style.color = 'red'</td></tr>
<tr><td>Create</td><td>document.createElement('div') then parent.appendChild(el)</td></tr></table>
<h4>Events</h4>
<ul class="bul">
<li><code>el.addEventListener('click', handler)</code> attaches without overwriting other handlers.</li>
<li><b>Bubbling:</b> the event travels from the target up to the document. <code>stopPropagation</code> halts it.</li>
<li><code>preventDefault()</code> stops the browser's default action, such as a form submission reloading the page.</li>
<li>Event delegation: attach one listener to a parent and inspect <code>event.target</code> — efficient for long lists.</li>
<li><code>DOMContentLoaded</code> fires when the HTML is parsed; the <code>load</code> event waits for images too.</li>
</ul>
<div class="warn"><b>Performance:</b> touching the DOM in a loop forces repeated layout. Build the markup in a string or a DocumentFragment and insert once.</div>`},
{id:"u9t5",t:"Client-side storage: localStorage and sessionStorage",html:`
<table class="tbl"><tr><th>API</th><th>Lifetime</th><th>Capacity</th><th>Note</th></tr>
<tr><td>localStorage</td><td>Until cleared</td><td>About 5 MB</td><td>Synchronous, strings only</td></tr>
<tr><td>sessionStorage</td><td>Tab session</td><td>About 5 MB</td><td>Cleared when the tab closes</td></tr>
<tr><td>Cookies</td><td>Expiry or session</td><td>About 4 KB</td><td>Sent with every HTTP request</td></tr>
<tr><td>IndexedDB</td><td>Until cleared</td><td>Large</td><td>Asynchronous, stores structured objects</td></tr>
</table>
<h4>Usage</h4>
<ul class="bul">
<li><code>localStorage.setItem('k', JSON.stringify(obj))</code> then <code>JSON.parse(localStorage.getItem('k'))</code>.</li>
<li><code>removeItem</code> deletes one key, <code>clear()</code> wipes everything for the origin.</li>
<li>Storage is per origin: another site cannot read your keys.</li>
<li>Quota errors throw; always wrap writes in try/catch.</li>
</ul>
<h4>Security</h4>
<p>Anything in localStorage is readable by any script on the page, so never store tokens or passwords there. Cookies can be marked <code>HttpOnly</code> (invisible to JavaScript) and <code>Secure</code> (HTTPS only), which is why session cookies are preferred for authentication.</p>
<div class="mn"><b>Rule of thumb:</b> preferences and offline drafts &rarr; localStorage; sensitive session state &rarr; HttpOnly cookie; large structured data &rarr; IndexedDB.</div>`},
{id:"u9t6",t:"MySQL: tables, queries, ALTER, joins",html:`
<h4>Creating and changing</h4>
<ul class="bul">
<li><code>CREATE TABLE student (id INT PRIMARY KEY, name VARCHAR(60) NOT NULL, marks INT DEFAULT 0);</code></li>
<li><code>ALTER TABLE student ADD COLUMN email VARCHAR(80);</code></li>
<li><code>CREATE INDEX idx_name ON student(name);</code> speeds up lookups on that column.</li>
<li><code>DROP TABLE student;</code> removes the table and its data.</li>
</ul>
<h4>Query patterns</h4>
<table class="tbl"><tr><th>Goal</th><th>Query</th></tr>
<tr><td>All rows</td><td>SELECT * FROM student;</td></tr>
<tr><td>Filter</td><td>SELECT name FROM student WHERE marks &gt; 60;</td></tr>
<tr><td>Sort</td><td>SELECT * FROM student ORDER BY marks DESC;</td></tr>
<tr><td>Group</td><td>SELECT dept, COUNT(*) FROM emp GROUP BY dept HAVING COUNT(*) &gt; 2;</td></tr>
<tr><td>Join</td><td>SELECT s.name, d.dname FROM student s JOIN dept d ON s.dept_id = d.id;</td></tr>
<tr><td>Second highest</td><td>SELECT MAX(salary) FROM emp WHERE salary &lt; (SELECT MAX(salary) FROM emp);</td></tr></table>
<h4>Data types and keys</h4>
<ul class="bul">
<li>Numeric: INT, BIGINT, DECIMAL(p,s) for money. Text: CHAR fixed, VARCHAR variable, TEXT long. Date: DATE, DATETIME, TIMESTAMP.</li>
<li>Primary key = unique + NOT NULL; foreign key enforces referential integrity; UNIQUE allows one NULL in most engines.</li>
<li>InnoDB supports transactions and foreign keys; MyISAM does not.</li>
</ul>
<div class="mn"><b>EXPLAIN</b> before optimising: it shows whether a query uses an index or scans the whole table.</div>`},
{id:"u9t7",t:"MongoDB: collections, documents, when to use NoSQL",html:`
<h4>Model</h4>
<ul class="bul">
<li>A <b>database</b> holds <b>collections</b>, which hold <b>documents</b> stored as BSON (binary JSON).</li>
<li>Documents in one collection may have different fields — the schema is flexible, not absent.</li>
<li>Each document has an <code>_id</code>, generated automatically if not supplied.</li>
</ul>
<h4>Basic operations</h4>
<table class="tbl"><tr><th>SQL idea</th><th>MongoDB</th></tr>
<tr><td>INSERT</td><td>db.students.insertOne({name:"Ravi", marks:72})</td></tr>
<tr><td>SELECT</td><td>db.students.find({marks:{$gt:60}})</td></tr>
<tr><td>UPDATE</td><td>db.students.updateOne({name:"Ravi"},{$set:{marks:80}})</td></tr>
<tr><td>DELETE</td><td>db.students.deleteOne({name:"Ravi"})</td></tr>
<tr><td>JOIN</td><td>$lookup aggregation stage</td></tr></table>
<h4>When NoSQL wins</h4>
<ul class="bul">
<li>Rapidly changing or heterogeneous data, such as catalogues with varying attributes.</li>
<li>Content that is naturally nested: a blog post with comments and tags in one document.</li>
<li>Horizontal scaling through sharding and high write throughput.</li>
<li>Weakness: multi-document transactions and complex joins are harder than in a relational database.</li>
</ul>
<div class="mn"><b>One-liner:</b> MySQL = tables, fixed schema, joins, strong consistency. MongoDB = documents, flexible schema, embedding, horizontal scale.</div>`},
{id:"u9t8",t:"HTTP methods, status codes and REST basics",html:`
