<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BTSC Lab Assistant CS/IT — Little Study Corner</title>
<meta name="description" content="A cheerful, self-contained BTSC Lab Assistant CS/IT study portal with 15 CBT mocks, 82 topic notes, diagrams and progress tracking.">
<meta name="color-scheme" content="light dark">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#FAF7FF; --surface:#FFFFFF; --surface2:#F3EDFF; --brand:#7C3AED; --brand-2:#A855F7;
  --brand-soft:#EDE9FE; --ink:#221B4B; --muted:#6E6A8A; --line:#EBE3FB;
  --ok:#16A34A; --ok-soft:#DCFCE7; --bad:#DC2626; --bad-soft:#FEE2E2;
  --warn:#D97706; --warn-soft:#FEF3C7; --accent:#EC4899; --accent-2:#F59E0B; --accent-3:#0EA5E9;
  --shadow:0 1px 2px rgba(46,16,101,.05),0 10px 30px -16px rgba(88,28,235,.28);
  --shadow-lg:0 18px 50px -22px rgba(88,28,235,.45);
  --radius:20px; --radius-sm:12px;
}
html[data-theme="dark"]{
  --bg:#04211F; --surface:#07302D; --surface2:#0B403C; --brand:#0D8378; --brand-2:#2DD4BF;
  --brand-soft:#0A403C; --ink:#EAF9F6; --muted:#93C6BF; --line:#14524C;
  --ok:#34D399; --ok-soft:#064E3B; --bad:#F87171; --bad-soft:#4C1D1D;
  --warn:#FBBF24; --warn-soft:#463106; --accent:#F472B6; --accent-2:#FBBF24; --accent-3:#38BDF8;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 12px 34px -18px rgba(0,0,0,.75);
  --shadow-lg:0 22px 60px -26px rgba(0,0,0,.85);
  --radius:20px; --radius-sm:12px;
}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Segoe UI",Roboto,-apple-system,"Helvetica Neue",Arial,sans-serif;
  font-size:15px; line-height:1.6; -webkit-font-smoothing:antialiased;
  transition:background .25s ease,color .25s ease;
}
h1,h2,h3,h4,h5{margin:0 0 .5rem;line-height:1.3;font-weight:700;letter-spacing:-.01em}
h1{font-size:1.6rem} h2{font-size:1.25rem} h3{font-size:1.05rem} h4{font-size:.98rem;margin-top:1.2rem}
p{margin:.5rem 0}
a{color:var(--brand)}
button{font-family:inherit;font-size:inherit;cursor:pointer}
.hide{display:none !important}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.tiny{font-size:.74rem}
.center{text-align:center}
.row{display:flex;gap:.6rem;align-items:center}
.row.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1}
.mt1{margin-top:.6rem}.mt2{margin-top:1.2rem}.mt3{margin-top:2rem}

/* ---------- Auth ---------- */
.auth-wrap{min-height:100vh;display:grid;grid-template-columns:1.05fr .95fr}
.auth-left{
  background:linear-gradient(155deg,var(--brand) 0%,var(--brand-2) 55%,#312E81 100%);
  color:#fff;padding:3rem 3.2rem;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;
}
html[data-theme="dark"] .auth-left{background:linear-gradient(155deg,#0F766E 0%,#115E59 55%,#042F2E 100%)}
.auth-left::after{content:"";position:absolute;width:420px;height:420px;border-radius:50%;background:rgba(255,255,255,.08);right:-140px;bottom:-160px}
.auth-left h1{font-size:2rem;margin-bottom:.4rem}
.auth-left p{color:rgba(255,255,255,.86);max-width:34ch}
.auth-brand{display:flex;align-items:center;gap:.7rem;font-weight:700;letter-spacing:.02em;font-size:1.02rem}
.auth-logo{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.16);display:grid;place-items:center;font-size:1.1rem;border:1px solid rgba(255,255,255,.3)}
.auth-feats{list-style:none;padding:0;margin:1.6rem 0 0;display:grid;gap:.7rem;position:relative;z-index:1}
.auth-feats li{display:flex;gap:.6rem;align-items:flex-start;font-size:.9rem;color:rgba(255,255,255,.92)}
.auth-feats b{color:#fff}
.tick{width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;flex:0 0 20px;font-size:.7rem;margin-top:2px}
.auth-right{display:flex;align-items:center;justify-content:center;padding:2.5rem 1.5rem;background:var(--bg)}
.auth-card{width:100%;max-width:420px}
.auth-card h2{font-size:1.4rem}
.seg{display:flex;background:var(--surface2);border-radius:11px;padding:4px;margin:1.1rem 0 1.4rem}
.seg button{flex:1;border:0;background:transparent;padding:.55rem;border-radius:8px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.field{margin-bottom:.85rem}
.field label{display:block;font-size:.8rem;font-weight:600;margin-bottom:.3rem;color:var(--muted)}
.input{
  width:100%;padding:.68rem .8rem;border:1px solid var(--line);border-radius:10px;background:var(--surface);
  color:var(--ink);font-size:.94rem;outline:none;transition:border-color .15s,box-shadow .15s;
}
.input:focus{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 18%,transparent)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.45rem;padding:.62rem 1.05rem;border-radius:10px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:.9rem;
  transition:transform .08s ease,background .15s,border-color .15s,box-shadow .15s;text-decoration:none;
}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 6px 16px -8px var(--brand)}
.btn-primary:hover{background:var(--brand-2);border-color:var(--brand-2);color:#fff}
html[data-theme="dark"] .btn-primary{color:#F2FFFC}
.btn-ghost{background:transparent}
.btn-danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
.btn-danger:hover{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.btn-block{width:100%}
.btn .ic{width:15px;height:15px;flex:0 0 15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.btn-sm{padding:.4rem .7rem;font-size:.8rem;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.divider{display:flex;align-items:center;gap:.7rem;color:var(--muted);font-size:.76rem;margin:1rem 0}
.divider::before,.divider::after{content:"";height:1px;background:var(--line);flex:1}
.alert{padding:.65rem .8rem;border-radius:10px;font-size:.85rem;margin:.7rem 0;border:1px solid transparent}
.alert.err{background:var(--bad-soft);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 25%,transparent)}
.alert.ok{background:var(--ok-soft);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 25%,transparent)}
.alert.info{background:var(--brand-soft);color:var(--ink);border-color:var(--line)}

/* ---------- Shell ---------- */
.nav{
  position:sticky;top:0;z-index:60;background:color-mix(in srgb,var(--surface) 92%,transparent);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
}
.nav-in{max-width:1200px;margin:0 auto;padding:.6rem 1.1rem;display:flex;align-items:center;gap:.5rem;position:relative}
.nav-brand{display:flex;align-items:center;gap:.55rem;font-weight:700;margin-right:.8rem;white-space:nowrap}
.nav-logo{width:32px;height:32px;border-radius:9px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:.95rem;font-weight:800}
html[data-theme="dark"] .nav-logo{color:#F2FFFC;background:var(--brand)}
.nav-brand span small{display:block;font-size:.66rem;font-weight:500;color:var(--muted);line-height:1}
.nav-links{display:flex;gap:.15rem;flex:1;flex-wrap:wrap}
.nav-links button{
  border:0;background:transparent;color:var(--muted);font-weight:600;font-size:.86rem;padding:.5rem .7rem;border-radius:9px;
}
.nav-links button:hover{background:var(--surface2);color:var(--ink)}
.nav-links button.on{background:var(--brand-soft);color:var(--brand)}
html[data-theme="dark"] .nav-links button.on{color:var(--ink)}
.nav-tools{display:flex;align-items:center;gap:.4rem;margin-left:auto}
.icon-btn.nav-burger{display:none;font-size:1.05rem}
.icon-btn{
  width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  display:grid;place-items:center;font-size:1rem;line-height:1;
}
.icon-btn:hover{border-color:var(--brand);color:var(--brand)}
.avatar{
  width:34px;height:34px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;
  font-weight:700;font-size:.82rem;border:1px solid var(--line);cursor:pointer;
}
html[data-theme="dark"] .avatar{color:var(--ink)}
.menu{
  position:absolute;right:1.1rem;top:58px;background:var(--surface);border:1px solid var(--line);border-radius:12px;
  box-shadow:var(--shadow);min-width:210px;padding:.4rem;z-index:70;
}
.menu button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:.55rem .7rem;border-radius:8px;color:var(--ink);font-size:.87rem}
.menu button:hover{background:var(--surface2)}
.menu .mhead{padding:.5rem .7rem;border-bottom:1px solid var(--line);margin-bottom:.3rem}

.page{max-width:1200px;margin:0 auto;padding:1.5rem 1.1rem 4rem}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;flex-wrap:wrap;margin-bottom:1.2rem}
.page-head p{margin:.2rem 0 0;color:var(--muted);font-size:.88rem}

/* ---------- Cards & grids ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:1.15rem;box-shadow:var(--shadow)}
.card.tight{padding:.9rem}
.grid{display:grid;gap:1rem}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.stat{display:flex;flex-direction:column;gap:.15rem}
.stat .lab{font-size:.76rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.stat .val{font-size:1.7rem;font-weight:800;line-height:1.1}
.stat .sub{font-size:.78rem;color:var(--muted)}
.pill{
  display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .55rem;border-radius:999px;font-size:.72rem;
  font-weight:700;border:1px solid transparent;white-space:nowrap
}
.pill.easy{background:var(--ok-soft);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 22%,transparent)}
.pill.mod{background:var(--warn-soft);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 22%,transparent)}
.pill.hard{background:var(--bad-soft);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 22%,transparent)}
.pill.soft{background:var(--brand-soft);color:var(--brand);border-color:var(--line)}
html[data-theme="dark"] .pill.soft{color:var(--ink)}
.pill.plain{background:var(--surface2);color:var(--muted);border-color:var(--line)}
.bar{height:9px;border-radius:999px;background:var(--surface2);overflow:hidden}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand-2));border-radius:999px;transition:width .4s ease}
.bar.thin{height:6px}

/* ---------- Test cards ---------- */
.test-card{position:relative;display:flex;flex-direction:column;gap:.6rem}
.test-card .tno{
  position:absolute;right:.9rem;top:.8rem;font-size:1.5rem;font-weight:800;color:var(--brand-soft);
}
html[data-theme="dark"] .test-card .tno{color:var(--surface2)}
.test-card h4{margin:0;font-size:1rem}
.meta{display:flex;gap:.5rem;flex-wrap:wrap;font-size:.76rem;color:var(--muted)}
.meta span{display:inline-flex;align-items:center;gap:.25rem}
.qlaunch{display:flex;gap:.45rem;margin-top:auto;padding-top:.4rem}
.qlaunch .btn{white-space:nowrap;padding:.5rem .4rem;font-size:.78rem}

/* ---------- Test engine ---------- */
.exam-top{
  position:sticky;top:calc(var(--navh, 60px) + 6px);z-index:50;background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:.55rem .8rem;display:flex;align-items:center;gap:.8rem;flex-wrap:wrap;box-shadow:var(--shadow);margin-bottom:1rem
}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:1.02rem;padding:.2rem .6rem;border-radius:8px;background:var(--brand-soft);color:var(--brand)}
html[data-theme="dark"] .timer{color:var(--ink)}
.timer.low{background:var(--bad-soft);color:var(--bad);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.55}}
.exam-grid{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:1rem;align-items:start}
.qbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:1.2rem;box-shadow:var(--shadow)}
.qhead{display:flex;justify-content:space-between;gap:.6rem;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--line);padding-bottom:.7rem;margin-bottom:.9rem}
.qtext{font-size:1.02rem;font-weight:600;margin:.2rem 0 1rem;white-space:pre-wrap}
.opts{display:grid;gap:.55rem}
.opt{
  display:flex;gap:.65rem;align-items:flex-start;padding:.65rem .8rem;border:1px solid var(--line);border-radius:10px;
  background:var(--surface);text-align:left;color:var(--ink);font-size:.92rem;transition:border-color .12s,background .12s;
}
.opt:hover{border-color:var(--brand)}
.opt .key{
  width:22px;height:22px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;
  font-size:.74rem;font-weight:700;flex:0 0 22px;color:var(--muted);background:var(--surface2)
}
.opt.sel{border-color:var(--brand);background:var(--brand-soft)}
.opt.sel .key{background:var(--brand);color:#fff;border-color:var(--brand)}
html[data-theme="dark"] .opt.sel .key{color:#F2FFFC}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .key{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .key{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt.lock{cursor:default}
.explain{
  margin-top:.9rem;border-left:3px solid var(--brand);background:var(--surface2);padding:.7rem .9rem;border-radius:0 10px 10px 0;font-size:.88rem
}
.explain b{color:var(--brand)}
html[data-theme="dark"] .explain b{color:var(--brand-2)}
.qfoot{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:space-between;margin-top:1.1rem;border-top:1px solid var(--line);padding-top:.8rem}
.palette-panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:.9rem;box-shadow:var(--shadow);position:sticky;top:calc(var(--navh, 60px) + 74px)}
.palette{display:grid;grid-template-columns:repeat(5,1fr);gap:.3rem;margin:.6rem 0;max-height:46vh;overflow-y:auto;padding-right:2px}
.pal{
  height:32px;border-radius:7px;border:1px solid var(--line);background:var(--surface2);color:var(--muted);
  font-size:.72rem;font-weight:700;display:grid;place-items:center;padding:0
}
.pal.ans{background:var(--ok-soft);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.pal.notans{background:var(--bad-soft);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.pal.mark{background:var(--warn-soft);color:var(--warn);border-color:var(--warn);box-shadow:inset 0 0 0 1px var(--warn)}
.pal.cur{outline:2px solid var(--brand);outline-offset:1px}
.legend{display:grid;gap:.3rem;font-size:.74rem;color:var(--muted)}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block;margin-right:.35rem}
.counts{display:grid;grid-template-columns:1fr 1fr;gap:.3rem;font-size:.76rem;margin-top:.5rem}
.counts b{font-variant-numeric:tabular-nums}

/* ---------- Scorecard ---------- */
.score-hero{display:grid;grid-template-columns:auto 1fr;gap:1.4rem;align-items:center}
.ring{
  width:132px;height:132px;border-radius:50%;display:grid;place-items:center;position:relative;
  background:conic-gradient(var(--brand) calc(var(--p)*1%),var(--surface2) 0);
}
.ring::before{content:"";position:absolute;inset:11px;background:var(--surface);border-radius:50%}
.ring div{position:relative;text-align:center}
.ring .big{font-size:1.7rem;font-weight:800;line-height:1}
.ring .sm{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.unit-row{display:grid;grid-template-columns:1fr 90px;gap:.7rem;align-items:center;font-size:.84rem;padding:.3rem 0}
.sol-item{border:1px solid var(--line);border-radius:12px;padding:.85rem;margin-bottom:.7rem;background:var(--surface)}
.sol-item .qtext{font-size:.94rem;margin:.3rem 0 .6rem}
.sol-line{font-size:.85rem;display:flex;gap:.4rem;padding:.2rem 0}
.sol-line .k{color:var(--muted);min-width:92px;font-weight:600}
.tabs{display:flex;gap:.3rem;flex-wrap:wrap;margin-bottom:1rem}
.tabs button{border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:.4rem .8rem;border-radius:999px;font-size:.8rem;font-weight:600}
.tabs button.on{background:var(--brand);border-color:var(--brand);color:#fff}
html[data-theme="dark"] .tabs button.on{color:#F2FFFC}

/* ---------- Syllabus / Notes ---------- */
.unit-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.unit-head{display:flex;gap:.7rem;align-items:center;padding:.85rem 1rem;cursor:pointer}
.unit-head:hover{background:var(--surface2)}
.unit-num{
  width:34px;height:34px;border-radius:9px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;
  font-weight:800;font-size:.9rem;flex:0 0 34px
}
html[data-theme="dark"] .unit-num{color:var(--ink)}
.unit-body{padding:0 1rem 1rem;border-top:1px solid var(--line)}
.topic{display:flex;gap:.7rem;align-items:flex-start;padding:.5rem .2rem;border-bottom:1px dashed var(--line)}
.topic:last-child{border-bottom:0}
.topic input[type=checkbox]{
  appearance:none;width:19px;height:19px;border:1.6px solid var(--line);border-radius:6px;flex:0 0 19px;margin-top:2px;
  display:grid;place-items:center;background:var(--surface);cursor:pointer
}
.topic input[type=checkbox]:checked{background:var(--brand);border-color:var(--brand)}
.topic input[type=checkbox]:checked::after{content:"✓";color:#fff;font-size:.72rem;font-weight:800;line-height:1}
html[data-theme="dark"] .topic input[type=checkbox]:checked::after{color:#F2FFFC}
.topic label{font-size:.9rem;cursor:pointer;flex:1}
.topic.done label{color:var(--muted);text-decoration:line-through}
.note-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:1.1rem;overflow:hidden}
.note-head{display:flex;justify-content:space-between;gap:.8rem;align-items:center;padding:.9rem 1.1rem;border-bottom:1px solid var(--line);background:var(--surface2)}
.note-head h3{margin:0;font-size:1rem}
.note-body{padding:1rem 1.15rem}
.note-body p.lead{background:var(--brand-soft);border-left:3px solid var(--brand);padding:.6rem .8rem;border-radius:0 8px 8px 0;font-size:.9rem}
html[data-theme="dark"] .note-body p.lead{color:var(--ink)}
.tbl{width:100%;border-collapse:collapse;margin:.7rem 0;font-size:.84rem;display:block;overflow-x:auto}
.tbl th,.tbl td{border:1px solid var(--line);padding:.4rem .55rem;text-align:left;vertical-align:top}
.tbl th{background:var(--surface2);font-weight:700}
.tbl tr:nth-child(even) td{background:color-mix(in srgb,var(--surface2) 45%,transparent)}
.dia{width:100%;max-width:560px;height:auto;display:block;margin:.9rem auto;background:var(--surface2);border-radius:10px;padding:.4rem}
.mn{background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 28%,transparent);color:var(--ink);padding:.6rem .8rem;border-radius:10px;font-size:.86rem;margin:.8rem 0}
.tip{background:var(--ok-soft);border:1px solid color-mix(in srgb,var(--ok) 25%,transparent);padding:.6rem .8rem;border-radius:10px;font-size:.86rem;margin:.8rem 0}
.warn{background:var(--bad-soft);border:1px solid color-mix(in srgb,var(--bad) 25%,transparent);padding:.6rem .8rem;border-radius:10px;font-size:.86rem;margin:.8rem 0}
.bul,.num{padding-left:1.15rem;margin:.5rem 0;font-size:.88rem}
.bul li,.num li{margin:.28rem 0}
code{background:var(--surface2);padding:.08rem .3rem;border-radius:5px;font-size:.85em;font-family:ui-monospace,Consolas,monospace}
.note-body h4{border-left:3px solid var(--brand);padding-left:.5rem}

/* ---------- Modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);backdrop-filter:blur(3px);z-index:200;display:grid;place-items:center;padding:1rem}
.modal{background:var(--surface);border-radius:16px;border:1px solid var(--line);max-width:520px;width:100%;padding:1.3rem;box-shadow:0 30px 60px -20px rgba(0,0,0,.5);max-height:90vh;overflow:auto}
.modal h3{margin-top:0}
.modal-actions{display:flex;gap:.5rem;justify-content:flex-end;margin-top:1.1rem;flex-wrap:wrap}
.gbtn{
  display:flex;align-items:center;justify-content:center;gap:.55rem;width:100%;padding:.65rem;border-radius:10px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:.9rem
}
.gbtn:hover{border-color:var(--brand)}
.gicon{width:18px;height:18px}
.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:var(--ink);color:var(--bg);
  padding:.6rem 1rem;border-radius:10px;font-size:.85rem;z-index:300;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .25s
}
.toast.on{opacity:1}
.instr{max-width:820px;margin:0 auto}
.instr ol{padding-left:1.2rem;font-size:.9rem}

.banner{

@media(max-width:980px){

    display:none;position:absolute;left:0;right:0;top:100%;flex-direction:column;gap:.15rem;

    padding:.55rem .7rem .7rem;z-index:70;
  }

  .qfoot .row{width:100%}

/* ---------- Notes (unit / topic) ---------- */
.ntracker{position:sticky;top:calc(var(--navh, 60px) + 6px);z-index:40;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:.7rem .85rem;box-shadow:var(--shadow);margin-bottom:1rem}
.ntracker .chips{display:flex;gap:.32rem;overflow-x:auto;padding-bottom:.15rem;margin-top:.5rem}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;
  padding:.28rem .62rem;font-size:.75rem;font-weight:700;white-space:nowrap}
.chip:hover{border-color:var(--brand);color:var(--ink)}
.chip b{color:var(--ink);font-weight:800}
.chip.done{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 35%,transparent);color:var(--ok)}
.chip.done b{color:var(--ok)}
.nunit{scroll-margin-top:178px}
.nunit-head{display:flex;gap:.6rem;align-items:center;margin:1.3rem 0 .55rem;padding-bottom:.4rem;border-bottom:1px solid var(--line)}
.nunit-head .unit-num{width:32px;height:32px}
.ntopic{border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:.5rem;overflow:hidden;box-shadow:var(--shadow)}
.ntopic-head{display:flex;gap:.65rem;align-items:center;padding:.68rem .85rem;cursor:pointer}
.ntopic-head:hover{background:var(--surface2)}
.ntopic.open .ntopic-head{background:var(--surface2);border-bottom:1px solid var(--line)}
.ntopic-title{font-weight:600;font-size:.93rem;flex:1;line-height:1.4}
.ntopic.open .ntopic-title{color:var(--brand)}
html[data-theme="dark"] .ntopic.open .ntopic-title{color:var(--ink)}
.ntopic-body{padding:.2rem 1rem 1rem}
.cbox{appearance:none;width:19px;height:19px;border:1.6px solid var(--line);border-radius:6px;flex:0 0 19px;
  background:var(--surface);cursor:pointer;display:grid;place-items:center;margin:0}
.cbox:checked{background:var(--brand);border-color:var(--brand)}
.cbox:checked::after{content:"\2713";color:#fff;font-size:.72rem;font-weight:800;line-height:1}
html[data-theme="dark"] .cbox:checked::after{color:#F2FFFC}
.chev{color:var(--muted);font-size:.75rem;flex:0 0 auto}
@media(max-width:640px){
  .ntracker{position:static}
  .nunit{scroll-margin-top:10px}
  .ntopic-title{font-size:.88rem}
}

@media(max-width:380px){
  .nav-in{padding:.45rem .55rem;gap:.3rem}
  .nav-brand{font-size:.82rem;gap:.4rem}

/* ---------- Match the following table ---------- */
.mtbl{width:100%;border-collapse:collapse;margin:.75rem 0 .3rem;font-size:.9rem;font-weight:400}
.mtbl th,.mtbl td{border:1px solid var(--line);padding:.45rem .65rem;text-align:left;vertical-align:top}
.mtbl th{background:var(--surface2);font-weight:700;font-size:.76rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.mtbl td:first-child{width:44%}
.mtbl b{color:var(--brand);font-weight:800;margin-right:.15rem}
html[data-theme="dark"] .mtbl b{color:var(--ink)}
@media(max-width:640px){.mtbl{font-size:.84rem}.mtbl th,.mtbl td{padding:.4rem .5rem}.mtbl td:first-child{width:48%}}

/* ============================================================
   DESIGN V2 — playful polish, motion and illustration
   ============================================================ */
:root{ --ease:cubic-bezier(.22,1,.36,1); }
@property --p { syntax: "<number>"; inherits: false; initial-value: 0; }
.ring{transition:--p 1.1s var(--ease)}
html,body{height:100%}
body{
  font-family:ui-rounded,"Segoe UI Variable Display","Segoe UI",Roboto,system-ui,-apple-system,sans-serif;
  background:
    radial-gradient(900px 500px at 8% -10%, color-mix(in srgb,var(--brand) 16%,transparent), transparent 70%),
    radial-gradient(800px 480px at 100% 0%, color-mix(in srgb,var(--accent) 13%,transparent), transparent 65%),
    radial-gradient(700px 420px at 50% 110%, color-mix(in srgb,var(--accent-3) 12%,transparent), transparent 70%),
    var(--bg);
  background-attachment:fixed;
}
::selection{background:color-mix(in srgb,var(--brand) 28%,transparent)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--brand) 32%,transparent);border-radius:99px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:color-mix(in srgb,var(--brand) 55%,transparent);background-clip:padding-box}

/* --- motion kit --- */
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes popIn{0%{opacity:0;transform:scale(.9)}70%{transform:scale(1.02)}100%{opacity:1;transform:scale(1)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes shimmer{0%{background-position:-160% 0}100%{background-position:260% 0}}
@keyframes pulseRing{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--brand) 45%,transparent)}70%{box-shadow:0 0 0 14px transparent}100%{box-shadow:0 0 0 0 transparent}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-3deg)}75%{transform:rotate(3deg)}}
@keyframes drawIn{to{stroke-dashoffset:0}}
@keyframes confettiFall{to{transform:translate3d(var(--dx),110vh,0) rotate(var(--rot));opacity:0}}
@keyframes sparkle{0%{transform:scale(0);opacity:1}100%{transform:scale(1.9);opacity:0}}
@keyframes sheen{0%{transform:translateX(-120%)}60%,100%{transform:translateX(220%)}}

.page > *{animation:fadeUp .42s var(--ease) both}
.page > *:nth-child(2){animation-delay:.04s}
.page > *:nth-child(3){animation-delay:.08s}
.page > *:nth-child(4){animation-delay:.12s}
.card,.unit-card,.note-card,.ntopic,.test-card{animation:fadeUp .42s var(--ease) both}
.grid > .card:nth-child(1),.grid > .test-card:nth-child(1){animation-delay:.03s}
.grid > .card:nth-child(2),.grid > .test-card:nth-child(2){animation-delay:.06s}
.grid > .card:nth-child(3),.grid > .test-card:nth-child(3){animation-delay:.09s}
.grid > .card:nth-child(4),.grid > .test-card:nth-child(4){animation-delay:.12s}
.grid > .card:nth-child(5),.grid > .test-card:nth-child(5){animation-delay:.15s}
.grid > .card:nth-child(6),.grid > .test-card:nth-child(6){animation-delay:.18s}

/* --- cards --- */
.card,.unit-card,.note-card,.ntopic{
  position:relative;border-radius:var(--radius);border:1px solid var(--line);
  box-shadow:var(--shadow);transition:transform .28s var(--ease),box-shadow .28s var(--ease),border-color .2s;
  background:linear-gradient(180deg,var(--surface),color-mix(in srgb,var(--surface) 88%,var(--surface2)));
}
.card:hover,.test-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:color-mix(in srgb,var(--brand) 35%,var(--line))}
.test-card{overflow:hidden}
.test-card::before{
  content:"";position:absolute;inset:0 0 auto;height:4px;
  background:linear-gradient(90deg,var(--brand),var(--accent),var(--accent-2));
  opacity:.85;
}
.test-card:hover .tno{transform:scale(1.12) rotate(-4deg);color:color-mix(in srgb,var(--brand) 40%,transparent)}
.test-card .tno{transition:transform .3s var(--ease),color .3s}

/* --- buttons --- */
.btn{border-radius:12px;transition:transform .18s var(--ease),box-shadow .2s,border-color .2s,background .2s,color .2s}
.btn:hover{transform:translateY(-1px)}
.btn-primary{
  background:linear-gradient(135deg,var(--brand),color-mix(in srgb,var(--brand-2) 80%,var(--brand)));
  border:0;color:#fff;box-shadow:0 8px 22px -12px color-mix(in srgb,var(--brand) 85%,transparent);
  position:relative;overflow:hidden;
}
.btn-primary::after{
  content:"";position:absolute;top:0;bottom:0;width:38%;left:0;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.42),transparent);
  transform:translateX(-120%);
}
.btn-primary:hover::after{animation:sheen .9s var(--ease)}
.btn-primary:hover{box-shadow:0 14px 30px -14px color-mix(in srgb,var(--brand) 95%,transparent)}
html[data-theme="dark"] .btn-primary{color:#04211F}

/* --- navbar --- */
.nav{backdrop-filter:blur(14px) saturate(140%);border-bottom:1px solid color-mix(in srgb,var(--brand) 14%,var(--line))}
.nav-logo{
  background:linear-gradient(140deg,var(--brand),var(--accent));
  box-shadow:0 6px 18px -8px color-mix(in srgb,var(--brand) 80%,transparent);
  animation:popIn .5s var(--ease) both;
}
.nav-links button{position:relative;transition:background .2s,color .2s,transform .18s}
.nav-links button:hover{transform:translateY(-1px)}
.nav-links button.on{background:linear-gradient(135deg,var(--brand-soft),color-mix(in srgb,var(--brand-soft) 55%,var(--surface)));color:var(--brand);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--brand) 22%,transparent)}
html[data-theme="dark"] .nav-links button.on{color:var(--ink)}
.avatar{background:linear-gradient(140deg,var(--brand-soft),color-mix(in srgb,var(--accent) 22%,var(--surface)))}
.avatar:hover{animation:wiggle .5s ease}

/* --- hero / dashboard --- */
.hero{
  position:relative;overflow:hidden;border-radius:26px;padding:1.5rem 1.6rem;margin-bottom:1.1rem;
  background:
    radial-gradient(600px 260px at 100% -30%, color-mix(in srgb,var(--accent) 30%,transparent), transparent 70%),
    linear-gradient(135deg,color-mix(in srgb,var(--brand) 92%,#000),color-mix(in srgb,var(--brand-2) 78%,var(--accent)));
  color:#fff;box-shadow:0 24px 50px -26px color-mix(in srgb,var(--brand) 80%,transparent);
}
.hero::after{
  content:"";position:absolute;right:-40px;top:-60px;width:240px;height:240px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.35),transparent 65%);
  animation:floaty 7s ease-in-out infinite;
}
.hero h1{font-size:clamp(1.35rem,3.4vw,2rem);margin:0 0 .2rem;letter-spacing:-.02em}
.hero p{margin:0;color:rgba(255,255,255,.9);font-size:.95rem;max-width:52ch}
.hero .hero-row{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:1rem;position:relative;z-index:1}
.hero .btn{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);color:#fff;backdrop-filter:blur(6px)}
.hero .btn:hover{background:rgba(255,255,255,.26);border-color:#fff;color:#fff}
.hero .btn-solid{background:#fff;color:color-mix(in srgb,var(--brand) 85%,#000);border-color:#fff;font-weight:800}
.hero .btn-solid:hover{background:#fff;color:color-mix(in srgb,var(--brand) 85%,#000);transform:translateY(-2px)}
.hero-art{position:absolute;right:1.1rem;bottom:.6rem;width:170px;opacity:.95;pointer-events:none}
@media(max-width:760px){.hero-art{display:none}}

.xp-chip{
  display:inline-flex;align-items:center;gap:.4rem;padding:.32rem .7rem;border-radius:999px;font-size:.76rem;font-weight:800;
  background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.32);color:#fff;
}
.xp-chip b{font-size:.86rem}

/* --- stat cards --- */
.stat .val{letter-spacing:-.02em}
.card .bar,.nunit-head .bar{background:color-mix(in srgb,var(--brand) 10%,var(--surface2))}
.bar > i{
  background:linear-gradient(90deg,var(--brand),var(--accent),var(--accent-2));
  background-size:200% 100%;animation:shimmer 3.2s linear infinite;
  box-shadow:0 0 12px -4px color-mix(in srgb,var(--brand) 70%,transparent);
}

/* --- test engine --- */
.opt{transition:transform .16s var(--ease),border-color .16s,background .16s,box-shadow .16s}
.opt:hover{transform:translateX(3px);box-shadow:0 8px 20px -16px color-mix(in srgb,var(--brand) 80%,transparent)}
.opt.sel{box-shadow:0 10px 24px -18px color-mix(in srgb,var(--brand) 90%,transparent)}
.opt.right{animation:popIn .3s var(--ease)}
.opt.wrong{animation:wiggle .32s ease}
.pal{transition:transform .14s var(--ease),background .15s,color .15s,border-color .15s}
.pal:hover{transform:scale(1.12)}
.pal.cur{animation:pulseRing 1.8s ease-out infinite}
.timer{background:linear-gradient(135deg,var(--brand-soft),color-mix(in srgb,var(--accent) 18%,var(--surface)));border:1px solid color-mix(in srgb,var(--brand) 22%,transparent)}

/* --- notes --- */
.ntopic{border-radius:16px}
.ntopic-head{border-radius:16px}
.ntopic.open{border-color:color-mix(in srgb,var(--brand) 30%,var(--line));box-shadow:var(--shadow-lg)}
.ntopic-body{animation:fadeUp .35s var(--ease) both}
.nunit-head{
  background:linear-gradient(90deg,color-mix(in srgb,var(--brand) 12%,transparent),transparent 70%);
  border-radius:12px;padding:.5rem .6rem;border-bottom:0;margin-bottom:.7rem;
}
.nunit-head .unit-num{background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;box-shadow:0 8px 18px -10px color-mix(in srgb,var(--brand) 85%,transparent)}
html[data-theme="dark"] .nunit-head .unit-num{color:#04211F}
.ntopic-title .num{
  display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 .3rem;margin-right:.45rem;
  border-radius:8px;font-size:.72rem;font-weight:800;
  background:color-mix(in srgb,var(--brand) 14%,var(--surface));color:var(--brand);
}
html[data-theme="dark"] .ntopic-title .num{color:var(--ink)}
.ntopic .cbox:checked{animation:popIn .25s var(--ease)}
.note-body h4{
  border-left:0;padding-left:1.9rem;position:relative;
}
.note-body h4::before{
  content:"";position:absolute;left:.55rem;top:.45em;width:9px;height:9px;border-radius:3px;
  background:linear-gradient(135deg,var(--brand),var(--accent));transform:rotate(45deg);
}
.dia{background:linear-gradient(180deg,color-mix(in srgb,var(--brand) 6%,var(--surface2)),var(--surface2));border:1px solid color-mix(in srgb,var(--brand) 14%,var(--line))}
.lead{border-radius:0 12px 12px 0}
.mn,.tip,.warn{border-radius:12px;position:relative;padding-left:2.2rem}
.mn::before,.tip::before,.warn::before{
  position:absolute;left:.65rem;top:.55rem;font-size:.95rem;line-height:1;
}
.mn::before{content:"★";color:var(--warn);font-size:1rem}
.tip::before{content:"✓";color:var(--ok);font-weight:900}
.warn::before{content:"!";color:var(--bad);font-weight:900;font-size:1.05rem}
.tbl{border-radius:12px;overflow:hidden}
.tbl th{background:linear-gradient(180deg,color-mix(in srgb,var(--brand) 10%,var(--surface2)),var(--surface2))}
.chip{transition:transform .16s var(--ease),background .2s,border-color .2s}
.chip:hover{transform:translateY(-2px)}

/* --- misc playful bits --- */
.pill{border-radius:999px}
.pill.soft{background:linear-gradient(135deg,var(--brand-soft),color-mix(in srgb,var(--brand-soft) 60%,var(--surface)))}
.resume{border-radius:16px;box-shadow:var(--shadow)}
.toast{border-radius:14px;font-weight:600;box-shadow:var(--shadow-lg)}
.empty-art{display:grid;place-items:center;padding:.6rem 0 1rem;opacity:.9}
.empty-art svg{width:120px;height:auto}

/* confetti + sparkles */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:400;overflow:hidden}
.confetti i{
  position:absolute;top:-12px;width:9px;height:14px;border-radius:3px;opacity:.95;
  animation:confettiFall linear forwards;
}
.sparkle{position:fixed;width:14px;height:14px;pointer-events:none;z-index:410;border-radius:50%;
  background:radial-gradient(circle,#fff 0 30%,transparent 70%),conic-gradient(var(--accent-2),var(--accent),var(--brand));
  animation:sparkle .7s ease-out forwards}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
}



/* =========================================================
   PLAYFUL LEARNING EDITION — visual refresh, accessible motion
   ========================================================= */
:root{
  --brand:#6D4AFF;--brand-2:#A855F7;--accent:#FF6B9A;--accent-2:#FFB84D;--accent-3:#24B8C8;
  --bg:#FBF9FF;--surface:#FFFFFF;--surface2:#F3F0FF;--ink:#242044;--muted:#77738F;--line:#E9E3FA;
  --shadow:0 8px 24px -16px rgba(67,45,130,.35),0 2px 8px rgba(67,45,130,.05);
  --shadow-lg:0 20px 44px -24px rgba(67,45,130,.42);
}
html[data-theme="dark"]{
  --bg:#101329;--surface:#191E3B;--surface2:#22294B;--ink:#F4F2FF;--muted:#B4B4D0;--line:#343A60;
  --brand:#A78BFA;--brand-2:#C084FC;--accent:#FB83AE;--accent-2:#FFD078;--accent-3:#67D9E4;
}
body{background:
 radial-gradient(ellipse at 8% 0%,color-mix(in srgb,var(--brand) 12%,transparent),transparent 38%),
 radial-gradient(ellipse at 96% 8%,color-mix(in srgb,var(--accent) 11%,transparent),transparent 34%),
 radial-gradient(ellipse at 50% 100%,color-mix(in srgb,var(--accent-3) 9%,transparent),transparent 42%),var(--bg)}
.nav{box-shadow:0 4px 24px rgba(50,35,100,.06)}
.nav-logo{border-radius:12px;transform:rotate(-5deg)}
.hero{border-radius:30px;padding:1.8rem 1.9rem;isolation:isolate}
.hero h1{font-size:clamp(1.65rem,4vw,2.35rem);letter-spacing:-.04em;margin:.55rem 0 .35rem}
.hero p{font-size:1rem;max-width:48ch}
.hero::before{content:"✦";position:absolute;right:28%;top:16%;font-size:1.4rem;color:#FFE8A3;animation:twinkle 2.4s ease-in-out infinite;z-index:-1}
@keyframes twinkle{0%,100%{opacity:.35;transform:scale(.8) rotate(0)}50%{opacity:1;transform:scale(1.2) rotate(25deg)}}
.card,.unit-card,.note-card,.ntopic{border-radius:20px}
.card{padding:1.2rem}
.card:hover,.unit-card:hover,.note-card:hover{border-color:color-mix(in srgb,var(--brand) 28%,var(--line))}
.btn{border-radius:13px;font-weight:700}
.btn-primary{background:linear-gradient(135deg,var(--brand),var(--brand-2));}
.btn:focus-visible,.icon-btn:focus-visible,.opt:focus-visible,.chip:focus-visible{outline:3px solid color-mix(in srgb,var(--accent-3) 70%,white);outline-offset:3px}
.pill{padding:.25rem .65rem}
.ntracker{border-radius:18px;background:color-mix(in srgb,var(--surface) 94%,var(--brand-soft));backdrop-filter:blur(10px)}
.ntracker .bar{height:10px}

<script>
const QB = [{"u":1,"d":"e","q":"Which component of a computer is referred to as its brain?","o":["Central Processing Unit","Random Access Memory","Hard Disk Drive","Graphics Processing Unit"],"a":0,"e":"The CPU fetches, decodes and executes instructions and controls all other units, so it is called the brain of the computer."},{"u":1,"d":"e","q":"Which of the following memories is volatile?","o":["ROM","RAM","Flash memory","Hard disk"],"a":1,"e":"RAM loses its contents when power is switched off; ROM, flash and hard disks retain data."},{"u":1,"d":"e","q":"ROM stands for:","o":["Read Only Memory","Random Only Memory","Rapid Output Memory","Read Output Module"],"a":0,"e":"ROM is non-volatile memory whose contents are written at manufacture and normally read only."},{"u":1,"d":"e","q":"One kilobyte (1 KB) equals:","o":["1000 bytes","1024 bytes","1024 bits","512 bytes"],"a":1,"e":"In binary terms 1 KB = 2¹⁰ bytes = 1024 bytes."},{"u":1,"d":"e","q":"Which storage device uses flash memory and has no moving parts?","o":["HDD","SSD","DVD-RW","Magnetic tape"],"a":1,"e":"An SSD stores data in NAND flash cells; there are no platters or heads, so access is faster and shock resistant."},{"u":1,"d":"e","q":"The binary equivalent of decimal 13 is:","o":["1101","1011","1110","1001"],"a":0,"e":"13 = 8 + 4 + 1 = 1101 in binary."},{"u":1,"d":"e","q":"Grouping binary 110101 in threes from the right gives the octal value:","o":["65","56","55","75"],"a":0,"e":"110 101 -> 6 5, so the octal value is 65."},{"u":1,"d":"e","q":"Decimal 255 in hexadecimal is:","o":["FF","FE","F0","1FF"],"a":0,"e":"255 = 15 x 16 + 15 = FF in hexadecimal."},{"u":1,"d":"e","q":"Which of the following is an input device?","o":["Plotter","Scanner","Speaker","Monitor"],"a":1,"e":"A scanner converts a physical document into digital data fed into the computer."},{"u":1,"d":"e","q":"Which of the following is an output device?","o":["Joystick","Light pen","Plotter","Microphone"],"a":2,"e":"A plotter prints large drawings and graphs, so it is an output device."},{"u":1,"d":"e","q":"The 2's complement of the 8-bit number 00001100 is:","o":["11110100","11110011","00001101","11110101"],"a":0,"e":"1's complement of 00001100 is 11110011; adding 1 gives 11110100."},{"u":1,"d":"e","q":"Binary 1010 equals decimal:","o":["10","12","8","14"],"a":0,"e":"1x8 + 0x4 + 1x2 + 0x1 = 10."},{"u":1,"d":"e","q":"Hexadecimal A3 equals decimal:","o":["163","143","173","131"],"a":0,"e":"A3 = 10x16 + 3 = 163."},{"u":1,"d":"e","q":"Which memory is the fastest among the following?","o":["Main memory","Cache memory","Secondary storage","Virtual memory"],"a":1,"e":"Cache sits between the CPU and main memory and is faster than RAM, secondary storage and virtual memory."},{"u":1,"d":"e","q":"BIOS firmware is normally stored in:","o":["RAM","ROM","Cache","Registers"],"a":1,"e":"BIOS is kept in non-volatile ROM/flash on the motherboard so it survives power-off."},{"u":1,"d":"e","q":"1 MB equals:","o":["1024 KB","1000 KB","1024 GB","512 KB"],"a":0,"e":"1 MB = 2²⁰ bytes = 1024 KB."},{"u":1,"d":"e","q":"Octal 17 equals decimal:","o":["15","17","13","21"],"a":0,"e":"1x8 + 7x1 = 15."},{"u":1,"d":"e","q":"Binary addition of 1011 and 1101 gives:","o":["11000","11001","10110","11100"],"a":0,"e":"11 + 13 = 24, and 24 in binary is 11000."},{"u":1,"d":"e","q":"Which of the following is secondary memory?","o":["Register","Cache","Optical disc","SRAM"],"a":2,"e":"Optical discs are non-volatile, offline secondary storage; registers, cache and SRAM are primary memory."},{"u":1,"d":"e","q":"The hexadecimal number system uses the digits:","o":["0 to 9 only","0 to 7","0 to 9 and A to F","0 to F and G"],"a":2,"e":"Hexadecimal is base 16, using 0-9 for values 0-9 and A-F for 10-15."},{"u":1,"d":"m","q":"Decimal 0.625 in binary is:","o":["0.101","0.110","0.011","0.100"],"a":0,"e":"0.625x2 = 1.25 -> 1; 0.25x2 = 0.5 -> 0; 0.5x2 = 1.0 -> 1, giving 0.101."},{"u":1,"d":"m","q":"Binary 10110111 equals hexadecimal:","o":["B7","7B","D7","B6"],"a":0,"e":"Group in fours: 1011 0111 -> B 7."},{"u":1,"d":"m","q":"The range of signed 8-bit 2's complement numbers is:","o":["-127 to +127","-128 to +127","-128 to +128","0 to 255"],"a":1,"e":"For n-bit 2's complement the range is −2ⁿ⁻¹ to 2ⁿ⁻¹ − 1, i.e. -128 to +127."},{"u":1,"d":"m","q":"A memory chip has 12 address lines. Its capacity in locations is:","o":["1024","2048","4096","8192"],"a":2,"e":"2¹² = 4096 locations; the number of address lines decides the number of addressable locations."},{"u":1,"d":"m","q":"Which type of RAM needs periodic refreshing?","o":["SRAM","DRAM","ROM","Flash"],"a":1,"e":"DRAM stores each bit as charge on a capacitor, which leaks, so it must be refreshed periodically."},{"u":1,"d":"m","q":"SRAM stores each bit using:","o":["A capacitor","A flip-flop","A magnetic domain","A floating gate"],"a":1,"e":"SRAM uses a six-transistor flip-flop per cell, so no refresh is needed but the cell is bulky and costly."},{"u":1,"d":"m","q":"EPROM contents are erased by:","o":["Electrical pulses","Ultraviolet light","Magnetic field","X-rays"],"a":1,"e":"An EPROM chip has a quartz window through which UV light erases the stored charge."},{"u":1,"d":"m","q":"Statement I: SRAM is faster than DRAM.\nStatement II: SRAM requires refreshing like DRAM.","o":["Both I and II are true","I is true, II is false","I is false, II is true","Both I and II are false"],"a":1,"e":"SRAM is faster because it uses flip-flops, but unlike DRAM it does not need refresh cycles."},{"u":1,"d":"m","q":"Hexadecimal 2F.8 equals decimal:","o":["47.5","45.5","47.8","46.5"],"a":0,"e":"2F = 47 and 0.8 in hex = 8/16 = 0.5, so the value is 47.5."},{"u":1,"d":"m","q":"Binary multiplication 110 x 11 gives:","o":["10010","11010","10100","10001"],"a":0,"e":"6 x 3 = 18, and 18 in binary is 10010."},{"u":1,"d":"m","q":"Which of the following is NOT a primary memory?","o":["RAM","ROM","Cache","Hard disk"],"a":3,"e":"A hard disk is secondary storage; the CPU cannot address it directly."},{"u":1,"d":"m","q":"Average access time of an HDD is mainly made up of:","o":["Seek time and rotational latency","Bus width and clock speed","Refresh cycle and CAS latency","Transfer rate and cache size"],"a":0,"e":"The head must first move to the track (seek time) and then wait for the sector to rotate under it (latency)."},{"u":1,"d":"m","q":"Match List I with List II.","o":["a-1, b-2, c-3, d-4","a-2, b-1, c-4, d-3","a-1, b-3, c-2, d-4","a-4, b-2, c-3, d-1"],"a":0,"e":"RAM is volatile primary memory, ROM stores firmware, cache is the fastest memory near the CPU and an SSD uses flash.","mt":{"l":["RAM","ROM","Cache","SSD"],"r":["Volatile primary memory","Firmware storage","Fastest memory near CPU","Flash-based storage"]}},{"u":1,"d":"m","q":"A logical left shift of a binary number by 2 positions multiplies it by:","o":["2","4","8","16"],"a":1,"e":"Each left shift multiplies by 2, so two shifts multiply by 2² = 4."},{"u":1,"d":"m","q":"Decimal 1000 in hexadecimal is:","o":["3E8","3D8","2E8","3F8"],"a":0,"e":"1000 = 3x256 + 14x16 + 8 = 3E8."},{"u":1,"d":"m","q":"Adding 1 to the 8-bit value 11111111 gives:","o":["00000000 with a carry out","11111110","100000000 stored in 8 bits","11111111 with no change"],"a":0,"e":"The sum needs 9 bits, so the 8-bit result wraps to 00000000 and a carry-out is generated."},{"u":1,"d":"m","q":"The width of the address bus determines:","o":["The word length of the CPU","The maximum addressable memory","The clock frequency","The size of the cache"],"a":1,"e":"With n address lines the CPU can address 2ⁿ locations, so bus width sets the memory limit."},{"u":1,"d":"m","q":"Statement I: A 16-bit address bus can directly address 64 KB of memory.\nStatement II: The number of address lines decides the maximum addressable memory of a processor.","o":["Both I and II are true","I is true, II is false","I is false, II is true","Both I and II are false"],"a":0,"e":"2¹⁶ = 65536 locations = 64 KB, and in general n address lines give 2ⁿ locations. Both statements hold."},{"u":1,"d":"m","q":"Statement I: Cache memory is larger in size than main memory.\nStatement II: Cache memory is faster than main memory.","o":["Both I and II are true","I is true, II is false","I is false, II is true","Both I and II are false"],"a":2,"e":"Cache is much smaller than main memory but far faster and costlier per bit, so I is false and II is true."},{"u":1,"d":"m","q":"Which of the following is both an input and an output device?","o":["Touch screen","Keyboard","Speaker","Bar code reader"],"a":0,"e":"A touch screen displays output and also accepts touch input, so it works in both directions."},{"u":1,"d":"h","q":"Decimal 0.1 in binary is:","o":["A terminating fraction 0.0001","A non-terminating repeating fraction","Exactly 0.1","0.0011 exactly"],"a":1,"e":"0.1 has no finite binary expansion because the fraction is 1/10, whose denominator has a prime factor 5; hence the familiar floating-point rounding error."},{"u":1,"d":"h","q":"Minimum number of bits needed to represent decimal 2000 in unsigned binary is:","o":["10","11","12","13"],"a":1,"e":"2¹⁰ = 1024 is too small and 2¹¹ = 2048 covers 2000, so 11 bits are needed."},{"u":1,"d":"h","q":"A 4 KB memory organised as 8-bit words needs how many address lines?","o":["10","11","12","13"],"a":2,"e":"4 KB = 4096 words and 2¹² = 4096, so 12 address lines are required."},{"u":1,"d":"h","q":"The 1's complement representation of -5 in 8 bits is:","o":["11111010","11111011","00000101","10000101"],"a":0,"e":"+5 is 00000101; complementing every bit gives 11111010 for -5 in 1's complement."},{"u":1,"d":"h","q":"Statement I: Sign-magnitude representation has two representations of zero.\nStatement II: 2's complement has a single representation of zero.","o":["Both I and II are true","I is true, II is false","I is false, II is true","Both I and II are false"],"a":0,"e":"Sign-magnitude gives +0 (00000000) and -0 (10000000), while 2's complement has only 00000000 for zero."},{"u":1,"d":"h","q":"BCD addition of 0111 1001 (79) and 0010 0101 (25) after correction gives:","o":["0001 0000 0100","0000 1111 1110","0001 0000 0110","0000 1001 1110"],"a":0,"e":"79 + 25 = 104, which in BCD is 0001 0000 0100; the invalid nibble 1110 is corrected by adding 0110."},{"u":1,"d":"h","q":"Hexadecimal FF plus 1 equals:","o":["100","1FF","FE","101"],"a":0,"e":"FF is 255; adding 1 gives 256, which is 100 in hexadecimal."},{"u":1,"d":"h","q":"Binary 1101.101 equals decimal:","o":["13.625","13.5","12.625","13.75"],"a":0,"e":"Integer part 1101 = 13; fraction 101 = 0.5 + 0.125 = 0.625, total 13.625."},{"u":1,"d":"h","q":"In IEEE 754 single precision floating point, the exponent bias is:","o":["127","128","1023","126"],"a":0,"e":"Single precision uses an 8-bit exponent with bias 127; double precision uses 11 bits with bias 1023."},{"u":1,"d":"h","q":"Octal 777 equals decimal:","o":["511","510","777","512"],"a":0,"e":"7x64 + 7x8 + 7 = 448 + 56 + 7 = 511."},{"u":1,"d":"h","q":"Which cache mapping allows a memory block to be placed in any cache line?","o":["Direct mapping","Set associative mapping","Fully associative mapping","Sector mapping"],"a":2,"e":"In fully associative mapping any block may occupy any line, so all tags must be searched in parallel."},{"u":1,"d":"h","q":"Decimal 0.375 in binary is:","o":["0.011","0.101","0.110","0.001"],"a":0,"e":"0.375x2 = 0.75 -> 0; 0.75x2 = 1.5 -> 1; 0.5x2 = 1.0 -> 1, giving 0.011."},{"u":1,"d":"h","q":"The Gray code equivalent of binary 1011 is:","o":["1110","1101","1010","1111"],"a":0,"e":"MSB is copied (1), then each bit is XORed with the next: 1, 1⁰=1, 0¹=1, 1¹=0, giving 1110."},{"u":1,"d":"h","q":"In 8-bit 2's complement, computing 12 - 20 gives:","o":["11111000","00001000","11110111","11111001"],"a":0,"e":"12 - 20 = -8, and -8 in 8-bit 2's complement is 11111000."},{"u":1,"d":"h","q":"For odd parity over the data 1011001, the parity bit that must be appended is:","o":["1, because the data has four 1s and the total must be odd","0, because the data has four 1s and the total is already odd","1, because the data has three 1s and a 1 makes the total odd","0, because the data has five 1s and the total is already odd"],"a":0,"e":"The data contains four 1s. Adding a parity bit of 1 makes the total five, which is odd."},{"u":1,"d":"h","q":"Match List I with List II.","o":["a-3, b-4, c-1, d-2","a-4, b-3, c-2, d-1","a-3, b-1, c-4, d-2","a-1, b-2, c-3, d-4"],"a":0,"e":"2¹⁰ bytes is 1 KB, 2²⁰ is 1 MB, 2³⁰ is 1 GB and 2⁴⁰ is 1 TB.","mt":{"l":["2¹⁰","2²⁰","2³⁰","2⁴⁰"],"r":["1 GB","1 TB","1 KB","1 MB"]}},{"u":1,"d":"h","q":"Which statement about the memory hierarchy is FALSE?","o":["Registers are the fastest storage","Cache is smaller than main memory","Secondary storage is directly accessed by the CPU","Cost per bit decreases as we move down the hierarchy"],"a":2,"e":"The CPU cannot address secondary storage directly; data must first be brought into main memory."},{"u":1,"d":"h","q":"The 8-bit signed addition 01111111 + 00000001 produces:","o":["Overflow, because the result exceeds the signed positive range","00000000 with a carry out and no overflow","11111111 without overflow","No overflow; 10000000 is a valid positive result"],"a":0,"e":"Adding two positive numbers gives 10000000, whose sign bit is 1, so the signed result is invalid: signed overflow."},{"u":1,"d":"h","q":"Which statement about the von Neumann architecture is FALSE?","o":["Instructions and data share the same memory","A single set of buses carries both data and instructions","It removes the bottleneck by using separate instruction and data caches","The program counter holds the address of the next instruction"],"a":2,"e":"Separate instruction and data caches belong to the Harvard architecture; von Neumann uses one shared memory and bus, which causes the bottleneck."},{"u":1,"d":"h","q":"A 4-to-1 multiplexer requires how many select lines?","o":["1","2","3","4"],"a":1,"e":"2ⁿ inputs need n select lines, so 4 inputs need 2 select lines."},{"u":2,"d":"e","q":"Which operating system type executes jobs in batches without user interaction?","o":["Batch operating system","Time-sharing system","Real-time system","Distributed system"],"a":0,"e":"A batch OS collects similar jobs into batches and executes them one after another without interactive user control."},{"u":2,"d":"e","q":"Which scheduling algorithm is non-preemptive and selects the process with the smallest burst time?","o":["FCFS","SJF","Round Robin","Preemptive priority"],"a":1,"e":"Shortest Job First picks the process with the least CPU burst; the non-preemptive version runs it to completion."},{"u":2,"d":"e","q":"Which of the following is NOT a necessary condition for deadlock?","o":["No preemption of held resources","Mutual exclusion of shared resources","Preemption of resources","Circular wait among the processes"],"a":2,"e":"The four Coffman conditions are mutual exclusion, hold and wait, NO preemption and circular wait."},{"u":2,"d":"e","q":"A thread shares which of the following with other threads of the same process?","o":["Its own stack and register set","Its own program counter and stack","Code and data segment","A separate address space in memory"],"a":2,"e":"Threads share the code, data and heap of the process but have their own stack, registers and program counter."},{"u":2,"d":"e","q":"Paging divides logical memory into fixed-size units called:","o":["Segments","Pages","Blocks","Frames"],"a":1,"e":"Logical memory is split into pages; physical memory is split into frames of the same size."},{"u":2,"d":"e","q":"The physical memory unit in paging is called:","o":["Page","Frame","Segment","Slot"],"a":1,"e":"A page of logical memory is loaded into a frame of physical memory of equal size."},{"u":2,"d":"e","q":"Which scheduling algorithm gives the minimum average waiting time for a fixed set of processes?","o":["FCFS","SJF","Round Robin","Priority scheduling"],"a":1,"e":"SJF is provably optimal for average waiting time when all jobs are available at the same time."},{"u":2,"d":"e","q":"A counting semaphore with value 0 means:","o":["The resource is free, so any process may enter the critical section","No resource is available, so a process must wait","A deadlock has occurred, so the OS must abort a process","The critical section is empty, so no process is blocked"],"a":1,"e":"A zero count means all units are held; a P (wait) operation blocks the process until the count rises."},{"u":2,"d":"e","q":"Which of these is a real-time operating system?","o":["Windows 10","VxWorks","Ubuntu","MS-DOS"],"a":1,"e":"VxWorks is a widely used hard real-time OS in embedded and industrial systems."},{"u":2,"d":"e","q":"Virtual memory allows a process to:","o":["Run without any physical memory","Use disk space as an extension of RAM","Increase the CPU clock speed","Avoid paging altogether"],"a":1,"e":"Virtual memory keeps active pages in RAM and spills the rest to swap space on disk."},{"u":2,"d":"e","q":"Which page replacement algorithm may suffer from Belady's anomaly?","o":["LRU","Optimal","FIFO","LFU"],"a":2,"e":"FIFO can show more page faults when more frames are added; LRU and Optimal are stack algorithms and cannot."},{"u":2,"d":"e","q":"The time a process spends waiting in the ready queue is called:","o":["Turnaround time","Waiting time","Response time","Burst time"],"a":1,"e":"Waiting time is the total time spent waiting in the ready queue before getting the CPU."},{"u":2,"d":"e","q":"Turnaround time equals:","o":["Waiting time + burst time","Burst time - waiting time","Response time + burst time","Waiting time only"],"a":0,"e":"Turnaround time = completion time - arrival time = waiting time + burst time (for zero arrival)."},{"u":2,"d":"e","q":"Which of the following is a user-level thread library?","o":["POSIX pthreads","BIOS","GRUB","SMTP"],"a":0,"e":"pthreads is the standard thread API used on POSIX systems; the others are firmware, a boot loader and a protocol."},{"u":2,"d":"e","q":"Thrashing occurs when:","o":["CPU utilisation stays at 100 percent for a long period","The system spends more time paging than executing","Too many threads are created inside a single process","The disk is full, so the OS cannot create new files"],"a":1,"e":"In thrashing the working set does not fit in memory, so the system swaps pages in and out continuously."},{"u":2,"d":"e","q":"Which scheduling algorithm is preemptive by nature?","o":["FCFS","Non-preemptive SJF","Round Robin","Highest Response Ratio Next (non-preemptive)"],"a":2,"e":"Round Robin interrupts the running process at the end of each time quantum, so it is inherently preemptive."},{"u":2,"d":"e","q":"A process in the ready state is waiting for:","o":["I/O completion","The CPU","Memory allocation","User input"],"a":1,"e":"A ready process is in main memory and only needs the CPU to run."},{"u":2,"d":"e","q":"At most how many processes may be inside a critical section at one time?","o":["Any number","Exactly one","Two","Zero"],"a":1,"e":"Mutual exclusion guarantees that only one process executes its critical section at a time."},{"u":2,"d":"e","q":"Which of the following is NOT an operating system?","o":["Linux","Windows","Oracle","Android"],"a":2,"e":"Oracle is a relational database management system, not an operating system."},{"u":2,"d":"e","q":"The kernel of an operating system:","o":["Runs as an ordinary user application in memory","Manages core system resources","Acts as a device driver for the attached hardware","Translates the source code of user programs"],"a":1,"e":"The kernel runs in privileged mode and manages CPU, memory, processes and devices."},{"u":2,"d":"m","q":"Processes P1, P2, P3 arrive at time 0 with burst times 5, 3 and 8 ms. Average waiting time under FCFS is:","o":["4.33 ms","3.67 ms","5.33 ms","6.00 ms"],"a":0,"e":"Waiting times are 0, 5 and 8, so the average is 13/3 = 4.33 ms."},{"u":2,"d":"m","q":"For bursts 5, 3 and 8 ms arriving together, average waiting time under SJF is:","o":["4.33 ms","3.67 ms","2.67 ms","5.00 ms"],"a":1,"e":"Order P2, P1, P3 gives waiting times 0, 3 and 8, so the average is 11/3 = 3.67 ms."},{"u":2,"d":"m","q":"A process has a burst time of 10 ms and runs under Round Robin with quantum 4 ms. How many times is it scheduled?","o":["2","3","4","5"],"a":1,"e":"It runs 4, 4 and then 2 ms, so it is scheduled three times."},{"u":2,"d":"m","q":"With a 32-bit logical address and 4 KB page size, the number of offset bits is:","o":["10","12","14","20"],"a":1,"e":"4 KB = 2¹², so 12 bits are used for the offset and 20 bits for the page number."},{"u":2,"d":"m","q":"TLB hit ratio is 0.9, TLB access time 10 ns and memory access time 100 ns. The effective access time is:","o":["110 ns","120 ns","130 ns","100 ns"],"a":1,"e":"0.9 x (10+100) + 0.1 x (10+100+100) = 99 + 21 = 120 ns."},{"u":2,"d":"m","q":"In paging, the page table maps:","o":["Page number to frame number","Frame number to page number","Process ID to page number","Offset to frame number"],"a":0,"e":"The page table converts the logical page number into the physical frame number; the offset is copied unchanged."},{"u":2,"d":"m","q":"Which is NOT a deadlock handling strategy?","o":["Prevention","Avoidance","Detection and recovery","Compaction"],"a":3,"e":"Compaction is a memory allocation technique to reduce external fragmentation, not a deadlock strategy."},{"u":2,"d":"m","q":"Statement I: Round Robin is preemptive.\nStatement II: FCFS is preemptive.","o":["Both I and II are true","I is true, II is false","I is false, II is true","Both I and II are false"],"a":1,"e":"Round Robin preempts at quantum expiry, while FCFS runs each process to completion."},{"u":2,"d":"m","q":"In the Banker's algorithm, a state is safe if:","o":["There exists a sequence in which every process can finish using available resources","Every process already holds its maximum declared claim of resources","No process is waiting for an I/O device at that moment","All resource types are divided equally among the processes"],"a":0,"e":"Safety means at least one safe sequence exists, so deadlock can be avoided by granting requests only in that order."},{"u":2,"d":"m","q":"Which is an advantage of multithreading?","o":["Each thread keeps its own private copy of the code segment","Context switching between threads is cheaper than between processes","Threads cannot share the heap of the parent process","Each thread needs a separate address space of its own"],"a":1,"e":"Threads share the address space, so a switch does not change the page tables or flush the TLB."},{"u":2,"d":"m","q":"The critical section problem requires which three properties?","o":["Mutual exclusion, progress and bounded waiting","Mutual exclusion, preemption and starvation","Progress, deadlock and starvation","Atomicity, durability and isolation"],"a":0,"e":"A correct solution must ensure mutual exclusion, progress when the section is free, and bounded waiting."},{"u":2,"d":"m","q":"Match List I with List II.","o":["a-2, b-4, c-3, d-1","a-1, b-2, c-3, d-4","a-2, b-3, c-4, d-1","a-4, b-1, c-2, d-3"],"a":0,"e":"FCFS suffers the convoy effect, SJF minimises average waiting time, RR gives fair slices and priority can starve low priority work.","mt":{"l":["FCFS","SJF","Round Robin","Priority"],"r":["May starve low priority jobs","Convoy effect","Fair time slicing","Optimal average waiting time"]}},{"u":2,"d":"m","q":"Internal fragmentation occurs in:","o":["Segmentation","Paging","Both paging and segmentation","Neither of them"],"a":1,"e":"The last page of a process is rarely full, so the unused space inside its frame is internal fragmentation."},{"u":2,"d":"m","q":"External fragmentation is characteristic of:","o":["Fixed-size paging with equal page and frame sizes","Variable-size partition allocation","Demand paging with a fully associative TLB","Virtual memory with a single-level page table"],"a":1,"e":"Variable partitions leave scattered free holes too small for a new process, which is external fragmentation."},{"u":2,"d":"m","q":"A page fault occurs when:","o":["The referenced page is already resident in main memory","The referenced page is not present in main memory","The page table has no free entry left for a new page","The TLB is full and cannot hold another translation"],"a":1,"e":"The valid bit of the page table entry is 0, so the OS must fetch the page from disk."},{"u":2,"d":"m","q":"The optimal page replacement algorithm replaces:","o":["The page that has been used least recently by the CPU","The page that will not be used for the longest time","The page that was loaded into memory earliest of all","A page chosen at random from the resident set"],"a":1,"e":"OPT replaces the page whose next use is farthest in the future; it is optimal but needs future knowledge."},{"u":2,"d":"m","q":"Which is a characteristic of a distributed operating system?","o":["A single system image across multiple machines","All processes must run on one physical processor only","The system supports only batch job processing","Nodes share no resources and never communicate"],"a":0,"e":"Users see many networked machines as one system, with transparent resource sharing."},{"u":2,"d":"m","q":"With 4 frames and reference string 1,2,3,4,1,2,5,1,2,3,4,5, FIFO causes how many page faults?","o":["8","9","10","11"],"a":2,"e":"FIFO gives 10 faults here, while OPT gives 8 for the same string - a classic Belady anomaly demonstration."},{"u":2,"d":"m","q":"Which system call creates a new process in Linux?","o":["fork()","exec()","wait()","pipe()"],"a":0,"e":"fork() duplicates the calling process; exec() then replaces the image in the child."},{"u":2,"d":"m","q":"A process control block does NOT store:","o":["Program counter","Process state","The complete program file from disk","Memory management information"],"a":2,"e":"The PCB holds only metadata such as state, registers, PC and page table pointers, not the program image."},{"u":2,"d":"h","q":"Processes arrive at time 0 with burst times 6, 2, 8 and 3 ms and are scheduled by SJF. Average turnaround time is:","o":["9.25 ms","10.50 ms","8.75 ms","11.00 ms"],"a":0,"e":"Order 2,3,6,8 gives completion times 2,5,11,19; the average is 37/4 = 9.25 ms."},{"u":2,"d":"h","q":"Resource types A=10, B=5, C=7. Allocation: P0(0,1,0), P1(2,0,0), P2(3,0,2), P3(2,1,1), P4(0,0,2); Max: P0(7,5,3), P1(3,2,2), P2(9,0,2), P3(2,2,2), P4(4,3,3). Applying Banker's algorithm:","o":["Safe, with sequence P1, P3, P4, P2, P0","Safe, with sequence P0, P1, P2, P3, P4","Unsafe, so no sequence exists","Safe, with sequence P4, P2, P0, P1, P3"],"a":0,"e":"Available is (3,3,2); P1 needs (1,2,2) and finishes, then P3, P4, P2 and finally P0 - so the state is safe."},{"u":2,"d":"h","q":"Round Robin with quantum 2 ms on bursts 5, 4 and 3 ms (all arriving at 0). Average waiting time is:","o":["7.00 ms","5.67 ms","6.33 ms","8.00 ms"],"a":0,"e":"Completion times are 12, 10 and 11; waiting times 7, 6 and 8 give an average of 21/3 = 7.00 ms."},{"u":2,"d":"h","q":"TLB hit ratio 0.8, TLB access 20 ns, memory access 100 ns. Effective access time is:","o":["140 ns","120 ns","160 ns","130 ns"],"a":0,"e":"0.8 x 120 + 0.2 x 220 = 96 + 44 = 140 ns."},{"u":2,"d":"h","q":"A 64-bit virtual address with 8 KB pages uses a 4-level page table. How many bits form the virtual page number?","o":["51","48","52","50"],"a":0,"e":"8 KB = 2¹³, so the offset takes 13 bits and 64 - 13 = 51 bits form the VPN."},{"u":2,"d":"h","q":"Statement I: Increasing the degree of multiprogramming beyond a limit causes thrashing.\nStatement II: The working-set model is used to control thrashing.","o":["Both I and II are true","I is true, II is false","I is false, II is true","Both I and II are false"],"a":0,"e":"Over-committing memory makes page faults explode, and the working-set model keeps each process resident only with its actively used pages."},{"u":2,"d":"h","q":"Which statement about monitors is correct?","o":["They are high-level synchronisation constructs with implicit locking","They are hardware devices for mutual exclusion","They are semaphores that may take negative values","They allow several processes into the critical section"],"a":0,"e":"A monitor encapsulates shared data with procedures that are entered by only one thread at a time, plus condition variables."},{"u":2,"d":"h","q":"In the dining philosophers problem with 5 philosophers, deadlock can be prevented by:","o":["Allowing every philosopher to pick up the left fork first","Allowing at most 4 philosophers to sit at the table","Letting each philosopher hold one fork forever while waiting","Giving every philosopher a fork before any of them eats"],"a":1,"e":"With only 4 philosophers competing for 5 forks, one philosopher can always complete, breaking the circular wait."},{"u":2,"d":"h","q":"Optimal page replacement on the reference string 7,0,1,2,0,3,0,4,2,3,0,3,2 with 3 frames gives how many faults?","o":["7","8","9","10"],"a":1,"e":"OPT produces 8 faults on this string; FIFO would give 9 and LRU 10 here."},{"u":2,"d":"h","q":"A page table with 2²⁰ entries of 4 bytes each occupies:","o":["1 MB","4 MB","2 MB","8 MB"],"a":1,"e":"4 x 2²⁰ bytes = 4 MB, which is why multi-level page tables are used."},{"u":2,"d":"h","q":"Which statement about a microkernel architecture is true?","o":["Most OS services run as user-space servers","All services run in kernel space","It provides no inter-process communication","It cannot support multithreading"],"a":0,"e":"A microkernel keeps only scheduling, IPC and basic memory management in the kernel, with file systems and drivers in user space."},{"u":2,"d":"h","q":"Priority inversion is best solved by:","o":["Priority inheritance","Round Robin scheduling","Paging","Spooling"],"a":0,"e":"In priority inheritance a low-priority holder temporarily inherits the priority of the blocked high-priority task."},{"u":2,"d":"h","q":"Page fault rate 0.001, memory access 100 ns, page fault service time 10 ms. Effective access time is approximately:","o":["10,100 ns","100 ns","1,000 ns","100,000 ns"],"a":0,"e":"0.999 x 100 + 0.001 x 10,000,000 = 99.9 + 10,000 = about 10,100 ns, showing why faults must be rare."},{"u":2,"d":"h","q":"Match List I with List II.","o":["a-2, b-3, c-1, d-4","a-3, b-2, c-4, d-1","a-2, b-1, c-3, d-4","a-4, b-3, c-1, d-2"],"a":0,"e":"FCFS causes convoying, SJF is optimal non-preemptive, SRTF is its preemptive form and RR uses a quantum.","mt":{"l":["FCFS","SJF","SRTF","Round Robin"],"r":["Preemptive shortest remaining time","Convoy effect","Optimal non-preemptive average waiting time","Time-quantum based"]}},{"u":2,"d":"h","q":"The convoy effect is associated with:","o":["FCFS when one CPU-bound process holds the CPU","Round Robin with a very small quantum","SJF with equal bursts","Priority scheduling with ageing"],"a":0,"e":"Short I/O-bound jobs pile up behind a long CPU-bound job in FCFS, lowering device utilisation."},{"u":2,"d":"h","q":"Which statement about threads is FALSE?","o":["Threads of a process share the heap","Threads of a process share the stack","Threads have their own program counter","Threads have their own register state"],"a":1,"e":"Each thread has a private stack, program counter and registers; code, data and heap are shared."},{"u":2,"d":"h","q":"In two-level paging with a 32-bit address, 4 KB pages and a 10-bit outer index, the inner page table has how many entries?","o":["512","1024","2048","4096"],"a":1,"e":"The VPN is 20 bits; 10 bits are used by the outer table, leaving 10 bits, so 2¹⁰ = 1024 entries."},{"u":2,"d":"h","q":"A system in which missing a task deadline causes catastrophic failure is called:","o":["Soft real-time system","Hard real-time system","Firm real-time system","Batch system"],"a":1,"e":"Hard real-time systems guarantee deadlines; missing one is a total failure, as in flight control."},{"u":2,"d":"h","q":"Which scheduling algorithm may cause starvation that ageing is used to solve?","o":["FCFS","SJF","Priority scheduling","Round Robin"],"a":2,"e":"Low-priority jobs may never run; ageing gradually raises the priority of waiting jobs."},{"u":2,"d":"h","q":"Three processes arrive at times 0, 2 and 4 with burst times 3, 4 and 2 ms. Under FCFS the average waiting time is:","o":["1.33 ms","2.00 ms","1.00 ms","2.67 ms"],"a":0,"e":"Completion times are 3, 7 and 9; waiting times 0, 1 and 3 give an average of 4/3 = 1.33 ms."},{"u":3,"d":"e","q":"Which data structure follows the LIFO principle?","o":["Queue","Stack","Linked list","Binary tree"],"a":1,"e":"A stack inserts and deletes at the same end (top), so the last element pushed is the first popped."},{"u":3,"d":"e","q":"Which data structure follows the FIFO principle?","o":["Stack","Queue","Heap","Graph"],"a":1,"e":"A queue inserts at the rear and deletes from the front, so the earliest element leaves first."},{"u":3,"d":"e","q":"The index of the first element of a one-dimensional array in C is:","o":["0","1","-1","Depends on the compiler"],"a":0,"e":"C arrays are zero-based, so arr[0] is the first element."},{"u":3,"d":"e","q":"Binary search can be applied only when the array is:","o":["Sorted","Unsorted","Of even length","Stored in a linked list"],"a":0,"e":"Binary search halves the search space using order comparisons, so the data must be sorted."},{"u":3,"d":"e","q":"The worst-case time complexity of bubble sort is:","o":["O(n)","O(n log n)","O(n²)","O(log n)"],"a":2,"e":"For a reverse-sorted array every pass performs about n comparisons, giving O(n²)."},{"u":3,"d":"e","q":"The worst-case time complexity of merge sort is:","o":["O(n)","O(n log n)","O(n²)","O(log n)"],"a":1,"e":"Merge sort always divides into halves (log n levels) and merges in linear time, so O(n log n) in all cases."},{"u":3,"d":"e","q":"A tree with n nodes has how many edges?","o":["n","n-1","n+1","2n"],"a":1,"e":"Every node except the root has exactly one parent edge, giving n-1 edges."},{"u":3,"d":"e","q":"Which data structure is used implicitly by recursion?","o":["Queue","Stack","Heap","Graph"],"a":1,"e":"Each recursive call is pushed on the call stack and popped on return."},{"u":3,"d":"e","q":"A node of a singly linked list typically stores:","o":["Data and a pointer to the next node","Data and two pointers, one to the previous node","Only a pointer, with the data kept in a separate array","Only the data, with the links stored in a hash table"],"a":0,"e":"A singly linked node holds the data field and a next pointer; a doubly linked node holds two pointers."},{"u":3,"d":"e","q":"The postfix expression A B + represents:","o":["A + B","A - B","A * B","A / B"],"a":0,"e":"In postfix, the operator follows its operands, so A B + is A + B."},{"u":3,"d":"e","q":"The worst-case time complexity of linear search is:","o":["O(1)","O(log n)","O(n)","O(n log n)"],"a":2,"e":"The element may be at the last position or absent, requiring all n comparisons."},{"u":3,"d":"e","q":"A collision in hashing occurs when:","o":["Two different keys map to the same index","Two identical keys are inserted into the same bucket twice","The hash table becomes completely full of entries","The hash function is applied twice to the same key"],"a":0,"e":"Different keys may produce the same hash value; chaining or open addressing then resolves it."},{"u":3,"d":"e","q":"The level of the root node in a tree is usually taken as:","o":["0","1","-1","n"],"a":0,"e":"By convention the root is at level 0 (or depth 0), and its children are at level 1."},{"u":3,"d":"e","q":"BST stands for:","o":["Binary Search Tree","Binary Sorted Table","Balanced Search Table","Basic Search Tree"],"a":0,"e":"A binary search tree keeps left subtree keys smaller and right subtree keys larger than the node."},{"u":3,"d":"e","q":"An inorder traversal of a binary search tree visits the keys in:","o":["Random order","Ascending order","Descending order","Level order"],"a":1,"e":"Inorder (left, root, right) on a BST always produces sorted ascending output."},{"u":3,"d":"e","q":"In a stack, insertion and deletion take place at:","o":["The rear end","The top end","Both ends","The middle"],"a":1,"e":"Push and pop both act on the top of the stack, which is what gives LIFO behaviour."},{"u":3,"d":"e","q":"A circular queue is mainly used to:","o":["Avoid the false overflow of a linear queue","Store elements of two different data types together","Sort the elements as they are inserted at the rear","Implement recursion without using the call stack"],"a":0,"e":"Reusing freed slots at the front prevents the wasted space that causes false overflow in a linear array queue."},{"u":3,"d":"e","q":"A complete graph with n vertices has how many edges?","o":["n(n-1)/2","n(n+1)/2","n-1","n²"],"a":0,"e":"Each of the n vertices connects to n-1 others, and each edge is counted twice, giving n(n-1)/2."},{"u":3,"d":"e","q":"Accessing an array element by index takes:","o":["O(1)","O(log n)","O(n)","O(n log n)"],"a":0,"e":"The address is computed as base + index x element size, so access time is constant."},{"u":3,"d":"e","q":"Which traversal of a binary tree visits nodes level by level?","o":["Preorder, visiting the root before both subtrees","Inorder, visiting the left subtree first of all","Postorder, visiting children before the parent","Breadth first (level order)"],"a":3,"e":"Level order uses a queue to visit all nodes at depth d before moving to depth d+1."},{"u":3,"d":"m","q":"The value of the postfix expression 5 3 + 8 2 - * is:","o":["48","40","36","24"],"a":0,"e":"5+3 = 8 and 8-2 = 6, then 8 x 6 = 48."},{"u":3,"d":"m","q":"The postfix form of the infix expression A + B * C is:","o":["A B C * +","A B + C *","A B C + *","A B * C +"],"a":0,"e":"Multiplication binds tighter, so B C * is evaluated first and then added to A."},{"u":3,"d":"m","q":"The maximum number of comparisons needed by binary search on 1000 sorted elements is about:","o":["10","50","100","500"],"a":0,"e":"log2(1000) is about 9.97, so at most 10 comparisons are needed."},{"u":3,"d":"m","q":"A complete binary tree with 15 nodes has how many levels?","o":["3","4","5","8"],"a":1,"e":"A perfect tree of height 3 has 2⁴ - 1 = 15 nodes, i.e. 4 levels counting the root as level 1."},{"u":3,"d":"m","q":"In a tree where A has children B and C, and B has children D and E, the inorder traversal is:","o":["D B E A C","A B D E C","D E B C A","A B C D E"],"a":0,"e":"Inorder visits left subtree (D B E), then root A, then right subtree C."},{"u":3,"d":"m","q":"Quicksort degenerates to O(n²) when:","o":["The pivot is always the smallest or largest element","The pivot is chosen as the median of three random elements","The array contains many duplicate keys of equal value","The array is already divided into two equal halves"],"a":0,"e":"Extreme pivots create maximally unbalanced partitions, giving n levels of work."},{"u":3,"d":"m","q":"The extra space complexity of standard merge sort is:","o":["O(1)","O(log n)","O(n)","O(n log n)"],"a":2,"e":"Merging needs an auxiliary array of size n; quicksort, by contrast, needs only O(log n) stack space."},{"u":3,"d":"m","q":"Insertion sort performs best, O(n), when the array is:","o":["Already sorted","Reverse sorted","Randomly shuffled","All elements equal and unsorted"],"a":0,"e":"In a sorted array each new element needs only one comparison, so the inner loop exits immediately."},{"u":3,"d":"m","q":"The number of edges in the complete graph K6 is:","o":["12","15","18","30"],"a":1,"e":"n(n-1)/2 = 6x5/2 = 15."},{"u":3,"d":"m","q":"An adjacency matrix for a graph with n vertices requires space of the order:","o":["O(n)","O(n log n)","O(n²)","O(n³)"],"a":2,"e":"An n x n matrix is stored regardless of the number of edges, which is wasteful for sparse graphs."},{"u":3,"d":"m","q":"Popping an element from an empty stack causes:","o":["Stack underflow","Stack overflow","Segmentation only","Infinite loop"],"a":0,"e":"Underflow means removing from an empty stack; overflow means pushing when the stack is full."},{"u":3,"d":"m","q":"A queue implemented with two stacks gives an amortised dequeue cost of:","o":["O(1)","O(log
