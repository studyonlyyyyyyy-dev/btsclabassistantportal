</g></svg>

<h4>Methods</h4>
<table class="tbl"><tr><th>Method</th><th>Purpose</th><th>Idempotent</th><th>Safe</th></tr>
<tr><td>GET</td><td>Read a resource</td><td>Yes</td><td>Yes</td></tr>
<tr><td>POST</td><td>Create a resource</td><td>No</td><td>No</td></tr>
<tr><td>PUT</td><td>Replace a resource</td><td>Yes</td><td>No</td></tr>
<tr><td>PATCH</td><td>Partial update</td><td>Not necessarily</td><td>No</td></tr>
<tr><td>DELETE</td><td>Remove a resource</td><td>Yes</td><td>No</td></tr></table>
<h4>Status codes</h4>
<table class="tbl"><tr><th>Code</th><th>Meaning</th></tr>
<tr><td>200 / 201 / 204</td><td>OK / Created / No content</td></tr>
<tr><td>301 / 302 / 304</td><td>Moved permanently / found / not modified</td></tr>
<tr><td>400 / 401 / 403 / 404</td><td>Bad request / unauthorised / forbidden / not found</td></tr>
<tr><td>405 / 409 / 429</td><td>Method not allowed / conflict / too many requests</td></tr>
<tr><td>500 / 502 / 503</td><td>Server error / bad gateway / service unavailable</td></tr></table>
<h4>REST principles</h4>
<ul class="bul">
<li>Resources are identified by URLs; the verb is the HTTP method, not part of the path.</li>
<li>Stateless: each request carries everything needed, typically a token.</li>
<li>Representations are usually JSON; caching and layering are encouraged.</li>
<li>GET /students/5 returns one student; POST /students creates one; DELETE /students/5 removes it.</li>
</ul>
<div class="mn"><b>Difference to remember:</b> 401 means "who are you?" (not authenticated); 403 means "I know you, but you may not" (not authorised).</div>`}
]});

{id:"u10t1",t:"MS Word: formatting, styles, mail merge, section breaks",html:`
<h4>Core features</h4>
<table class="tbl"><tr><th>Feature</th><th>Use</th></tr>
<tr><td>Styles</td><td>Consistent headings; required for an automatic table of contents</td></tr>
<tr><td>Mail merge</td><td>One letter, many recipients from a data source</td></tr>
<tr><td>Section break</td><td>Different margins, orientation or headers inside one file</td></tr>
<tr><td>Page break</td><td>New page, same section (Ctrl+Enter)</td></tr>
<tr><td>Track changes</td><td>Review edits with accept or reject</td></tr>
<tr><td>Header / footer</td><td>Repeating text and page numbers</td></tr></table>
<h4>Shortcuts</h4>
<ul class="bul">
<li>Ctrl+S save, Ctrl+P print, Ctrl+N new, Ctrl+O open, Ctrl+Z undo, Ctrl+Y redo.</li>
<li>Ctrl+B bold, Ctrl+I italic, Ctrl+U underline, Ctrl+F find, Ctrl+H replace.</li>
<li>Ctrl+Enter page break, Shift+Enter line break, Ctrl+Shift+C/V copy and paste formatting.</li>
</ul>
<h4>Mail merge in three steps</h4>
<ol class="num">
<li>Create the main document with placeholders such as &laquo;Name&raquo;.</li>
<li>Connect the data source (Excel sheet, Access table, CSV).</li>
<li>Preview and finish the merge into a new document, printer or e-mail.</li>
</ol>
<div class="mn"><b>Exam trap:</b> a page break keeps the same section formatting; a section break is what allows different headers or landscape pages. If the question says "different header on page 3", the answer is a section break.</div>`},
{id:"u10t2",t:"MS Excel: formulas, references, functions, charts, Goal Seek",html:`
<h4>Functions that appear in papers</h4>
<table class="tbl"><tr><th>Function</th><th>Returns</th><th>Trap</th></tr>
<tr><td>SUM(range)</td><td>Total of numbers</td><td>Ignores text</td></tr>
<tr><td>AVERAGE(range)</td><td>Mean of numeric cells</td><td>Ignores blanks and text</td></tr>
<tr><td>COUNT / COUNTA</td><td>Numeric cells / non-empty cells</td><td>The classic MCQ difference</td></tr>
<tr><td>COUNTBLANK</td><td>Empty cells</td><td>—</td></tr>
<tr><td>IF(cond, a, b)</td><td>Chooses a or b</td><td>Text results need quotes</td></tr>
<tr><td>VLOOKUP(v, table, col, FALSE)</td><td>Exact match from a column</td><td>FALSE = exact, TRUE = approximate</td></tr>
<tr><td>LEN(text)</td><td>Character count</td><td>Spaces count</td></tr>
<tr><td>SUMIF / COUNTIF</td><td>Conditional totals and counts</td><td>Range then criteria</td></tr>
<tr><td>CONCAT / &amp;</td><td>Joins text</td><td>—</td></tr></table>
<h4>Cell references</h4>
<ul class="bul">
<li><b>A1</b> relative: both column and row shift when copied.</li>
<li><b>$A$1</b> absolute: neither shifts.</li>
<li><b>A$1</b> row locked, column free. <b>$A1</b> column locked, row free.</li>
<li>F4 cycles through the four forms while editing a formula.</li>
</ul>
<h4>Operator precedence</h4>
<p><code>=2+3*4</code> gives <b>14</b>; brackets change it to 20. Comparison operators come last, which is why <code>=A1&gt;10</code> returns TRUE or FALSE.</p>
<h4>Tools</h4>
<ul class="bul">
<li><b>Goal Seek:</b> finds the input that produces a target result (one variable).</li>
<li><b>Data Table:</b> tests many inputs at once. <b>Solver:</b> optimises with several variables and constraints.</li>
<li><b>Freeze Panes:</b> keeps headers visible while scrolling.</li>
<li><b>Pivot Table:</b> summarises large data by rows, columns and values.</li>
</ul>
<div class="mn"><b>Error values:</b> #DIV/0! divide by zero, #N/A lookup not found, #REF! deleted reference, #VALUE! wrong type, #NAME? unrecognised name.</div>`},
{id:"u10t3",t:"MS PowerPoint: slide master, transitions, animations",html:`
<h4>Structure</h4>
<ul class="bul">
<li><b>Slide Master</b> controls fonts, colours and placeholders for every slide using that layout.</li>
<li><b>Layouts</b> define placeholder positions: title slide, title and content, two content, comparison.</li>
<li><b>Notes pane</b> holds speaker notes, visible in Presenter View only.</li>
</ul>
<h4>Transitions vs animations</h4>
<table class="tbl"><tr><th>Point</th><th>Transition</th><th>Animation</th></tr>
<tr><td>Applies to</td><td>Whole slide</td><td>Individual object</td></tr>
<tr><td>When</td><td>Moving between slides</td><td>Within a slide</td></tr>
<tr><td>Examples</td><td>Fade, push, morph</td><td>Appear, fly in, emphasis, motion path</td></tr></table>
<h4>Keys and delivery</h4>
<ul class="bul">
<li><b>F5</b> start from the beginning, <b>Shift+F5</b> from the current slide, <b>Esc</b> end.</li>
<li><b>B</b> blacks the screen, <b>W</b> whites it, a number + Enter jumps to that slide.</li>
<li>Ctrl+M new slide, Ctrl+D duplicate, Ctrl+Shift+G group.</li>
<li>Export as PDF or video from File &gt; Export for distribution.</li>
</ul>
<div class="mn"><b>Design rule for a lab/viva:</b> one idea per slide, no more than six lines, font 24 pt or larger, and consistent colours from the master rather than per-slide formatting.</div>`},
{id:"u10t4",t:"Linux CLI: file commands, permissions, grep, find, ps",html:`
<svg viewBox="0 0 520 120" class="dia" role="img" aria-label="Linux permission bits">
<g font-size="11" fill="var(--ink)">
<text x="12" y="20" font-size="10" fill="var(--muted)">owner</text>

<rect x="230" y="30" width="40" height="30" fill="var(--brand)" opacity=".22" stroke="var(--brand)"/><text x="250" y="50" text-anchor="middle">x</text>
<rect x="288" y="30" width="40" height="30" fill="var(--brand)" opacity=".22" stroke="var(--brand)"/><text x="308" y="50" text-anchor="middle">r</text>
<rect x="328" y="30" width="40" height="30" fill="var(--brand)" opacity=".12" stroke="var(--brand)"/><text x="348" y="50" text-anchor="middle">-</text>
<rect x="368" y="30" width="40" height="30" fill="var(--brand)" opacity=".22" stroke="var(--brand)"/><text x="388" y="50" text-anchor="middle">x</text>
<text x="440" y="50" font-weight="700">7 5 5</text>
<text x="12" y="82" font-size="10" fill="var(--muted)">read = 4, write = 2, execute = 1  &rarr;  rwx = 7, r-x = 5, r-- = 4</text>
<text x="12" y="104" font-size="10" fill="var(--muted)">chmod 755 file  =  owner rwx, group r-x, others r-x</text>
</g></svg>

<h4>Files and directories</h4>
<table class="tbl"><tr><th>Command</th><th>Job</th><th>Useful flags</th></tr>
<tr><td>ls</td><td>List contents</td><td>-l long, -a hidden, -h human sizes</td></tr>
<tr><td>pwd</td><td>Print working directory</td><td>—</td></tr>
<tr><td>cd</td><td>Change directory</td><td>.. parent, ~ home, / root, - previous</td></tr>
<tr><td>mkdir / rmdir</td><td>Create / remove empty directory</td><td>mkdir -p nested path</td></tr>
<tr><td>cp / mv</td><td>Copy / move or rename</td><td>cp -r recursive</td></tr>
<tr><td>rm</td><td>Delete</td><td>rm -r recursive, -f force</td></tr>
<tr><td>cat / less</td><td>View a file</td><td>less is paged</td></tr>
<tr><td>head / tail</td><td>First / last lines</td><td>tail -f follows a log</td></tr></table>
<h4>Searching and processes</h4>
<ul class="bul">
<li><code>grep -rn "error" /var/log</code> searches text recursively with line numbers.</li>
<li><code>find /var -name "*.log"</code> searches by name, size, time or type.</li>
<li><code>ps aux</code> lists processes, <code>top</code> shows live CPU and memory, <code>kill -9 PID</code> forces termination.</li>
<li><code>df -h</code> shows filesystem free space, <code>du -h</code> shows directory usage, <code>free -h</code> shows memory.</li>
</ul>
<h4>Permissions</h4>
<table class="tbl"><tr><th>Number</th><th>Symbolic</th><th>Meaning</th></tr>
<tr><td>7</td><td>rwx</td><td>read + write + execute</td></tr>
<tr><td>6</td><td>rw-</td><td>read + write</td></tr>
<tr><td>5</td><td>r-x</td><td>read + execute</td></tr>
<tr><td>4</td><td>r--</td><td>read only</td></tr></table>
<p><code>chmod 755 file</code> gives the owner rwx and group/others r-x. <code>chown user:group file</code> changes ownership. In <code>ls -l</code> the first character is d (directory), - (file) or l (link).</p>
<div class="mn"><b>Redirection:</b> &gt; overwrite, &gt;&gt; append, &lt; input, | pipe, 2&gt;&amp;1 send errors to the same place as output.</div>`},
{id:"u10t5",t:"Windows CLI: dir, ipconfig, netstat, tasklist, regedit",html:`
<table class="tbl"><tr><th>Command</th><th>Job</th></tr>
<tr><td>dir</td><td>List files, with /a for hidden and /s recursive</td></tr>
<tr><td>cd / cd ..</td><td>Change directory / go up one level</td></tr>
<tr><td>copy / xcopy / robocopy</td><td>Copy files; robocopy is the robust option for large jobs</td></tr>
<tr><td>del / rmdir /s</td><td>Delete a file / delete a directory tree</td></tr>
<tr><td>ipconfig /all</td><td>Full IP configuration; /renew and /release for DHCP</td></tr>
<tr><td>ping / tracert</td><td>Reachability and the path to a host</td></tr>
<tr><td>netstat -an</td><td>Active connections and listening ports</td></tr>
<tr><td>tasklist / taskkill</td><td>List processes / end a process by PID or name</td></tr>
<tr><td>sfc /scannow</td><td>Repair corrupted system files</td></tr>
<tr><td>chkdsk</td><td>Check and repair disk errors</td></tr>
<tr><td>regedit</td><td>Registry editor (risky: back up first)</td></tr>
<tr><td>msconfig</td><td>Startup and boot options</td></tr></table>
<h4>Utilities worth naming</h4>
<ul class="bul">
<li><b>Device Manager:</b> driver status, yellow triangles, roll back a driver.</li>
<li><b>Event Viewer:</b> system and application logs, the first stop for a crash.</li>
<li><b>Task Manager:</b> CPU, memory, startup impact, end a hung process.</li>
<li><b>Disk Cleanup / Storage Sense:</b> reclaim space.</li>
<li><b>System Restore:</b> roll the system back to a restore point.</li>
</ul>
<div class="mn"><b>Order of diagnosis:</b> power &rarr; POST and beep codes &rarr; boot device &rarr; OS load &rarr; drivers &rarr; applications. Change one variable at a time.</div>`},
{id:"u10t6",t:"Shell scripting: bash and batch basics, exit codes",html:`
<h4>Bash essentials</h4>
<table class="tbl"><tr><th>Line</th><th>Meaning</th></tr>
<tr><td>#!/bin/bash</td><td>Shebang, chooses the interpreter</td></tr>
<tr><td>chmod +x s.sh &amp;&amp; ./s.sh</td><td>Make executable, then run</td></tr>
<tr><td>name="Ravi"</td><td>Variable assignment (no spaces around =)</td></tr>
<tr><td>echo "$name"</td><td>Use a variable, always quote it</td></tr>
<tr><td>read x</td><td>Read input into x</td></tr>
<tr><td>if [ "$x" -gt 5 ]; then ... fi</td><td>Numeric test</td></tr>
<tr><td>for i in 1 2 3; do echo $i; done</td><td>Loop</td></tr>
<tr><td>$1 $2 $# $@</td><td>Arguments, count, all arguments</td></tr>
<tr><td>$?</td><td>Exit status of the last command (0 = success)</td></tr></table>
<h4>Batch files (Windows)</h4>
<ul class="bul">
<li>Extension .bat or .cmd; <code>@echo off</code> suppresses command echo.</li>
<li><code>set VAR=value</code> and <code>%VAR%</code> to use it.</li>
<li><code>if exist file.txt (echo found)</code>, <code>for %%f in (*.txt) do echo %%f</code>.</li>
<li><code>pause</code> waits for a key; <code>exit /b</code> returns an exit code.</li>
</ul>
<h4>Good habits</h4>
<ul class="bul">
<li>Quote variables to survive spaces; test before deleting.</li>
<li>Use <code>set -e</code> to stop on the first error, and log with timestamps.</li>
<li>Check the exit code, do not assume success.</li>
</ul>
<div class="mn"><b>Exit code 0 means success.</b> Every non-zero value is a failure code, which is exactly what <code>$?</code> reports.</div>`},
{id:"u10t7",t:"Computer maintenance: POST, beep codes, Safe Mode, drivers",html:`
<svg viewBox="0 0 520 200" class="dia" role="img" aria-label="Hardware troubleshooting flowchart">

<rect x="180" y="6" width="160" height="30" rx="15" fill="var(--brand)" opacity=".22" stroke="var(--brand)"/><text x="260" y="26" text-anchor="middle">Fault reported</text>

<path d="M260 36 V50" stroke="var(--brand)" stroke-width="1.5"/><path d="M240 82 L100 102" stroke="var(--brand)" stroke-width="1.5"/><path d="M270 82 L265 102" stroke="var(--brand)" stroke-width="1.5"/><path d="M300 82 L430 102" stroke="var(--brand)" stroke-width="1.5"/>

<h4>POST and beep codes</h4>
<ul class="bul">
<li>POST runs before any OS loads and tests CPU, memory, video and keyboard.</li>
<li>One short beep usually means success; repeated or long beeps point to RAM, video or the motherboard.</li>
<li>No beep and no display: check power supply, RAM seating and the CPU fan header first.</li>
</ul>
<h4>Preventive maintenance</h4>
<ul class="bul">
<li>Clean dust from fans and heatsinks; overheating causes random shutdowns.</li>
<li>Check S.M.A.R.T. status, keep 10&ndash;15% free disk space, defragment an HDD (never an SSD).</li>
<li>Update the OS and drivers; uninstall unused software; run a full antivirus scan monthly.</li>
<li>Test the UPS and back up data on a schedule, not when something fails.</li>
</ul>
<h4>Common faults and fixes</h4>
<table class="tbl"><tr><th>Symptom</th><th>Most likely cause</th></tr>
<tr><td>Random restarts under load</td><td>Overheating or a failing power supply</td></tr>
<tr><td>Blue screen after a driver install</td><td>Incompatible driver — boot Safe Mode and roll back</td></tr>
<tr><td>USB device not detected</td><td>Port, cable or driver — check Device Manager</td></tr>
<tr><td>Very slow boot</td><td>Too many startup apps, failing disk, low RAM</td></tr></table>
<div class="warn"><b>Before installing anything:</b> note the current configuration and create a restore point or image. One machine first, then the whole lab.</div>`},

<text x="452" y="60" font-size="10" fill="var(--muted)">3 copies</text>

</g></svg>

<h4>Installing an operating system</h4>
<ol class="num">
<li>Check hardware compatibility and back up existing data.</li>
<li>Set the boot order in BIOS/UEFI and boot from the installation media.</li>
<li>Partition the disk (system, data, swap) and choose the filesystem: NTFS for Windows, ext4 for Linux.</li>
<li>Install, then install chipset, graphics, network and audio drivers.</li>
<li>Apply updates, install antivirus, create the first restore point.</li>
</ol>
<h4>UEFI vs legacy BIOS</h4>
<ul class="bul">
<li>UEFI supports GPT disks above 2 TB, faster boot and Secure Boot; legacy BIOS with MBR stops at 2 TB.</li>
<li>Secure Boot refuses unsigned boot loaders, which is why some Linux installs need it disabled.</li>
</ul>
<h4>Backup strategy (3-2-1)</h4>
<ul class="bul">
<li><b>3</b> copies of the data, on <b>2</b> different media, with <b>1</b> off-site.</li>
<li>Full backup copies everything; incremental copies changes since the last backup; differential copies changes since the last full.</li>
<li>Test a restore periodically — an untested backup is only a hope.</li>
</ul>
<h4>Software installation hygiene</h4>
<ul class="bul">
<li>Download from the official source, verify the checksum, scan the installer.</li>
<li>Note the licence, version and configuration for the lab register.</li>
<li>Uninstall cleanly and remove leftover registry or configuration entries.</li>
</ul>
<div class="mn"><b>Restore point vs backup:</b> a restore point repairs system files and settings but does <i>not</i> protect personal documents. A backup protects the data.</div>`}

/* ================= STORAGE LAYER ================= */
const DB_KEY = "btsc_lab_portal_db_v1";
const SESSION_KEY = "btsc_lab_portal_session_v1";
const THEME_KEY = "btsc_lab_portal_theme";

let DB = null, CU = null, UD = null;
let route = "dashboard";
let authMode = "login";
let TEST = null, tickId = null;
let currentAttempt = null, solFilter = "all";
let openNote = {};
const SESSION_SEED = Math.floor(Math.random() * 1000000000);
let paperCounter = 0;
let openUnits = { 1: true };

function nowISO() { return new Date().toISOString(); }
function newId(p) { return (p || "id") + "_" + Math.random().toString(36).slice(2, 9) + Date.now().toString(36); }
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function toast(msg) {
  let t = document.getElementById("toast");
  if (!t) { t = document.createElement("div"); t.id = "toast"; t.className = "toast"; document.body.appendChild(t); }
  t.textContent = msg; t.classList.add("on");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("on"), 2600);
}
function loadDB() {
  try { const raw = localStorage.getItem(DB_KEY); if (raw) { const d = JSON.parse(raw); if (d && d.users) return d; } } catch (e) { }
  return { version: 1, users: {}, created: nowISO() };
}
function saveDB() {
  try { localStorage.setItem(DB_KEY, JSON.stringify(DB)); }
  catch (e) { toast("Storage limit reached. Free some space and retry."); }
}
function hashPw(pw, salt) {
  let h1 = 0x811c9dc5, h2 = 0x1000193;
  const s = salt + "::" + pw;
  for (let i = 0; i < s.length; i++) {
    h1 ^= s.charCodeAt(i); h1 = Math.imul(h1, 16777619) >>> 0;
    h2 = (h2 + s.charCodeAt(i) * (i + 7)) >>> 0; h2 = Math.imul(h2, 2654435761) >>> 0;
  }
  return (h1 >>> 0).toString(36) + "." + (h2 >>> 0).toString(36);
}
function blankData() {
  return { syllabus: {}, notes: {}, attempts: [], active: null, settings: { theme: null }, createdAt: nowISO() };
}

/* ================= PAPER BUILDER ================= */
const TEST_META = Array.from({ length: 15 }, (_, i) => {
  const id = i + 1;
  return { id, level: id <= 5 ? "easy" : id <= 10 ? "moderate" : "hard" };
});
const LEVEL_LABEL = { easy: "Easy", moderate: "Moderate", hard: "Hard" };
const LEVEL_CLASS = { easy: "easy", moderate: "mod", hard: "hard" };

function makeRng(seed) {
  let s = seed >>> 0;
  return function () {
    s = (s + 0x6D2B79F5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), 1 | t);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function shuffleArr(a, rng) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}
function buildPaper(testId) {
  const rng = makeRng(testId * 9973 + 137 + SESSION_SEED + (paperCounter++ * 7919));
  const quota = testId <= 5 ? { e: 6, m: 3, h: 1 }
    : testId <= 10 ? { e: 3, m: 5, h: 2 }
      : { e: 1, m: 3, h: 6 };
  const paper = [];
  for (let u = 1; u <= 10; u++) {
    const groups = { e: [], m: [], h: [] };
    for (let i = 0; i < QB.length; i++) if (QB[i].u === u) groups[QB[i].d].push(i);
    Object.keys(groups).forEach(k => shuffleArr(groups[k], rng));
    const picked = [];
    ["e", "m", "h"].forEach(k => {
      const take = Math.min(quota[k], groups[k].length);
      for (let n = 0; n < take; n++) picked.push(groups[k][n]);
    });
    if (picked.length < 10) {
      const rest = [];
      Object.keys(groups).forEach(k => groups[k].forEach(i => { if (picked.indexOf(i) === -1) rest.push(i); }));
      shuffleArr(rest, rng);
      while (picked.length < 10 && rest.length) picked.push(rest.shift());
    }
    picked.slice(0, 10).forEach(i => paper.push({ i: i }));
  }
  shuffleArr(paper, rng);
  paper.forEach(p => {
    const n = QB[p.i].o.length;
    const perm = [];
    for (let k = 0; k < n; k++) perm.push(k);
    if (n > 2) shuffleArr(perm, rng);
    // any "none of these" style option always stays in the last position
    const pin = perm.findIndex(orig => /^(none of these|none of the above|all of the above)/i.test(QB[p.i].o[orig]));
    if (pin >= 0 && pin !== perm.length - 1) {
      const last = perm.length - 1;
      const tmp = perm[last]; perm[last] = perm[pin]; perm[pin] = tmp;
    }
    p.o = perm;
  });
  return paper;
}
function correctPos(item) { return item.o.indexOf(QB[item.i].a); }

/* ================= FORMATTERS ================= */
function fmtClock(sec) {
  sec = Math.max(0, Math.floor(sec));
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  return String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
}
function fmtDur(sec) {
  sec = Math.max(0, Math.floor(sec));
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  if (h) return h + "h " + m + "m " + s + "s";
  if (m) return m + "m " + s + "s";
  return s + "s";
}
function fmtDate(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  const opts = { day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" };
  return d.toLocaleString("en-IN", opts);
}
function fmtScore(n) { return (Math.round(n * 100) / 100).toString(); }

/* ================= ANALYTICS ================= */
function percentileOf(score) {
  const z = (score - 34) / 13;
  const p = 100 / (1 + Math.exp(-z));
  return Math.max(0.4, Math.min(99.9, Math.round(p * 10) / 10));
}
function gradeAttempt(paper, answers) {
  let correct = 0, wrong = 0, unattempted = 0;
  const unitStats = {};
  for (let u = 1; u <= 10; u++) unitStats[u] = { c: 0, w: 0, u: 0, t: 0 };
  paper.forEach((item, idx) => {
    const q = QB[item.i];
    const st = unitStats[q.u];
    st.t++;
    const picked = answers[idx];
    if (picked === undefined || picked === null) { unattempted++; st.u++; }
    else if (picked === correctPos(item)) { correct++; st.c++; }
    else { wrong++; st.w++; }
  });
  const score = correct * 1 - wrong * 0.25;
  return {
    correct, wrong, unattempted, unitStats,
    score: Math.round(score * 100) / 100,
    negative: Math.round(wrong * 0.25 * 100) / 100,
    percentile: percentileOf(score)
  };
}
function userStats() {
  const at = UD.attempts || [];
  const total = at.length;
  const best = total ? Math.max.apply(null, at.map(a => a.score)) : 0;
  const avg = total ? at.reduce((s, a) => s + a.score, 0) / total : 0;
  return { total, best, avg };
}
function syllabusPct() {
  let done = 0, tot = 0;
  SYLLABUS.forEach(u => u.topics.forEach(t => { tot++; if (UD.syllabus[t.id]) done++; }));
  return tot ? Math.round((done / tot) * 100) : 0;
}
function notesStats() {
  let done = 0, tot = 0;
  NOTES_UNITS.forEach(u => u.topics.forEach(t => { tot++; if (UD.notes[t.id]) done++; }));
  return { done, tot, pct: tot ? Math.round((done / tot) * 100) : 0 };
}
function notesPct() { return notesStats().pct; }
function xpTotal() {
  const at = (UD.attempts || []).length;
  const syl = Object.keys(UD.syllabus || {}).length;
  const nts = Object.keys(UD.notes || {}).length;
  return at * 25 + syl * 6 + nts * 4;
}
function streakDays() {
  const days = {};
  (UD.attempts || []).forEach(a => { if (a.submittedAt) days[new Date(a.submittedAt).toDateString()] = 1; });
  let n = 0;
  const d = new Date();
  if (!days[d.toDateString()]) d.setDate(d.getDate() - 1);
  while (days[d.toDateString()]) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function confetti(big) {
  const box = document.createElement("div");
  box.className = "confetti";
  const colors = ["#7C3AED", "#A855F7", "#EC4899", "#F59E0B", "#10B981", "#0EA5E9"];
  const n = big ? 90 : 45;
  for (let i = 0; i < n; i++) {
    const el = document.createElement("i");
    el.style.left = Math.random() * 100 + "vw";
    el.style.background = colors[i % colors.length];
    el.style.setProperty("--dx", (Math.random() * 160 - 80) + "px");
    el.style.setProperty("--rot", (Math.random() * 720 - 360) + "deg");
    el.style.animationDuration = (1.9 + Math.random() * 1.5) + "s";
    el.style.animationDelay = (Math.random() * 0.5) + "s";
    el.style.opacity = 0.9;
    box.appendChild(el);
  }
  document.body.appendChild(box);
  setTimeout(() => box.remove(), 4200);
}
function sparkleAt(el) {
  if (!el) return;
  const r = el.getBoundingClientRect();
  for (let i = 0; i < 6; i++) {
    const s = document.createElement("div");
    s.className = "sparkle";
    s.style.left = (r.left + r.width / 2 - 7 + (Math.random() * 40 - 20)) + "px";
    s.style.top = (r.top + r.height / 2 - 7 + (Math.random() * 24 - 12)) + "px";
    s.style.animationDelay = (i * 0.04) + "s";
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 900);
  }
}
function readiness() {
  const s = userStats();
  const scorePart = Math.min(100, (s.avg / 100) * 100);
  return Math.round(scorePart * 0.55 + syllabusPct() * 0.25 + notesPct() * 0.2);
}

/* ================= AUTH ================= */
function findUserByEmail(email) {
  const e = String(email || "").trim().toLowerCase();
  return Object.values(DB.users).find(u => u.email === e) || null;
}
function startSession(uid) {
  localStorage.setItem(SESSION_KEY, JSON.stringify({ uid, ts: nowISO() }));
  CU = DB.users[uid];
  UD = CU.data;
  applyTheme(UD.settings && UD.settings.theme ? UD.settings.theme : (localStorage.getItem(THEME_KEY) || "light"));

}
function doSignup(name, email, pw, pw2) {
  name = String(name || "").trim(); email = String(email || "").trim().toLowerCase();
  if (name.length < 3) return "Please enter your full name (at least 3 characters).";
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) return "Please enter a valid email address.";
  if (String(pw).length < 6) return "Password must be at least 6 characters.";
  if (pw !== pw2) return "The two passwords do not match.";
  if (findUserByEmail(email)) return "An account with this email already exists. Please sign in.";
  const id = newId("u");
  const salt = Math.random().toString(36).slice(2, 10);
  DB.users[id] = {
    uid: id, name, email, provider: "local", salt,
    passHash: hashPw(pw, salt), createdAt: nowISO(), data: blankData()
  };
  saveDB();
  startSession(id);
  toast("Account created. Welcome, " + name.split(" ")[0] + "!");
  return null;
}
function doLogin(email, pw) {
  const u = findUserByEmail(email);
  if (!u) return "No account found with this email. Create one first.";
  if (u.provider !== "local") return "This account uses Google sign-in. Use the Google button instead.";
  if (hashPw(String(pw), u.salt) !== u.passHash) return "Incorrect password. Please try again.";
  startSession(u.uid);
  toast("Welcome back, " + u.name.split(" ")[0] + "!");
  return null;
}
function logout() {
  localStorage.removeItem(SESSION_KEY);
  stopTimer();
  CU = null; UD = null; TEST = null; currentAttempt = null;
  route = "dashboard"; authMode = "login";

}

function shell(inner) {
  const initials = (CU.name || "S").split(" ").map(x => x[0]).slice(0, 2).join("").toUpperCase();

function render(keepScroll) {
  const root = document.getElementById("app");
  const y = window.scrollY;
  if (!CU) { root.innerHTML = viewAuth(); }
  else {
    let inner = "";
    if (route === "dashboard") inner = viewDashboard();
    else if (route === "tests") inner = viewTests();
    else if (route === "instr") inner = viewInstructions();
    else if (route === "test") inner = viewTest();
    else if (route === "scorecard") inner = viewScorecard();
    else if (route === "solutions") inner = viewSolutions();
    else if (route === "syllabus") inner = viewSyllabus();
    else if (route === "notes") inner = viewNotes();
    else if (route === "profile") inner = viewProfile();
    else inner = viewDashboard();
    root.innerHTML = shell(inner);
  }

  if (tb) tb.textContent = document.documentElement.getAttribute("data-theme") === "dark" ? "☀" : "☾";

  if (navEl) document.documentElement.style.setProperty("--navh", navEl.offsetHeight + "px");

  if (keepScroll) window.scrollTo(0, y); else window.scrollTo(0, 0);
}

function stemHtml(q, cls) {
  let h = '<div class="' + (cls || "qtext") + '">' + esc(q.q) + "</div>";
  if (q.mt) {
    h += '<table class="mtbl"><thead><tr><th>List I</th><th>List II</th></tr></thead><tbody>';
    for (let i = 0; i < q.mt.l.length; i++) {
      h += "<tr><td><b>(" + "abcd"[i] + ")</b> " + esc(q.mt.l[i]) + "</td><td><b>(" + (i + 1) + ")</b> " + esc(q.mt.r[i]) + "</td></tr>";
    }
    h += "</tbody></table>";
  }
  return h;
}
function learningExplain(q, pickedText) {
  const answer = q.o[q.a];
  const explanation = String(q.e || "").trim();
  return `<div class="explain">
    <div class="explain-title"><span>💡</span> Understand the answer</div>
    <div><b>Correct answer:</b> ${esc(answer)}</div>
    <p style="margin:.45rem 0 0"><b>Explanation:</b> ${esc(explanation || "Review the concept behind the correct option and how it relates to the question.")}</p>
  </div>`;
}

function paintQuestion() {
  const host = document.getElementById("qhost");
  if (!host || !TEST) return;
  const item = TEST.paper[TEST.idx];
  const q = QB[item.i];
  const picked = TEST.answers[TEST.idx];
  const practice = TEST.mode === "practice";
  const locked = practice && picked !== undefined;
  const cp = correctPos(item);
  const opts = item.o.map((orig, pos) => {
    let cls = "opt";
    if (practice && locked) {
      cls += " lock";
      if (pos === cp) cls += " right";
      else if (pos === picked) cls += " wrong";
    } else if (picked === pos) cls += " sel";
    return `<button class="${cls}" ${practice && locked ? "" : 'data-act="pick" data-pos="' + pos + '"'}>
        <span class="key">${String.fromCharCode(65 + pos)}</span><span>${esc(q.o[orig])}</span></button>`;
  }).join("");

function paintPalette() {
  const host = document.getElementById("palhost");

  const cells = TEST.paper.map((_, i) => {

    const m = !!TEST.marked[i];
    const v = !!TEST.visited[i];
    let cls = "pal";
    if (a) ans++; else if (v) notans++; else notvis++;
    if (m) marked++;
    if (m) cls += " mark"; else if (a) cls += " ans"; else if (v) cls += " notans";
    if (i === TEST.idx) cls += " cur";
    return `<button class="${cls}" data-act="jump" data-i="${i}">${i + 1}</button>`;
  }).join("");
  host.innerHTML = `

      <div><i style="background:var(--surface2);border:1px solid var(--line)"></i>Not visited</div>

}
function remaining() {
  if (!TEST) return 0;
  if (TEST.mode !== "exam") return 0;
  return Math.max(0, Math.floor((TEST.endsAt - Date.now()) / 1000));
}
function startTimer() {
  stopTimer();
  if (!TEST || TEST.mode !== "exam") return;
  tickId = setInterval(() => {
    const el = document.getElementById("timer");
    const r = remaining();
    if (el) {
      el.textContent = fmtClock(r);
      if (r <= 300) el.classList.add("low");
    }
    if (r <= 0) {
      stopTimer();
      toast("Time is up. Submitting your paper.");
      finalizeTest(true);
    }
  }, 1000);
}
function stopTimer() { if (tickId) { clearInterval(tickId); tickId = null; } }
function persistActive() {
  if (!TEST) return;
  UD.active = {
    testId: TEST.testId, mode: TEST.mode, paper: TEST.paper, answers: TEST.answers,
    marked: TEST.marked, visited: TEST.visited, idx: TEST.idx,
    startedAt: TEST.startedAt, endsAt: TEST.endsAt
  };
  saveDB();
}
function beginTest(testId, mode) {
  const paper = buildPaper(testId);
  TEST = {
    testId, mode, paper, answers: {}, marked: {}, visited: { 0: true }, idx: 0,
    startedAt: nowISO(), endsAt: Date.now() + 120 * 60 * 1000
  };
  persistActive();
  route = "test";
  render();
  startTimer();
}
function resumeTest() {
  const a = UD.active;
  if (!a) { toast("Nothing to resume."); return; }
  TEST = {
    testId: a.testId, mode: a.mode, paper: a.paper, answers: a.answers || {},
    marked: a.marked || {}, visited: a.visited || { 0: true }, idx: a.idx || 0,
    startedAt: a.startedAt, endsAt: a.endsAt
  };
  if (TEST.mode === "exam" && remaining() <= 0) { finalizeTest(true); return; }
  route = "test"; render(); startTimer();
}
function finalizeTest(auto) {
  if (!TEST) return;
  stopTimer();
  const elapsed = Math.floor((Date.now() - new Date(TEST.startedAt).getTime()) / 1000);
  const g = gradeAttempt(TEST.paper, TEST.answers);
  const meta = TEST_META[TEST.testId - 1];
  const attempt = {
    id: newId("att"), testId: TEST.testId, level: meta.level, mode: TEST.mode,
    startedAt: TEST.startedAt, submittedAt: nowISO(),
    timeTaken: TEST.mode === "exam" ? Math.min(7200, elapsed) : elapsed,
    autoSubmitted: !!auto,
    paper: TEST.paper, answers: TEST.answers, marked: TEST.marked,
    correct: g.correct, wrong: g.wrong, unattempted: g.unattempted,
    score: g.score, negative: g.negative, percentile: g.percentile, unitStats: g.unitStats
  };
  UD.attempts.push(attempt);
  UD.active = null;
  saveDB();
  TEST = null;
  currentAttempt = attempt;
  route = "scorecard";
  render();
  // No celebratory effects for test submissions: the target benchmark is 85/100.
  toast(auto ? "Time up — paper submitted. Check your score against the 85-mark target." : (g.score >= 85 ? "85-mark target achieved. Review mistakes and maintain this level." : "Below the 85-mark target. Review your mistakes, revise weak topics and improve before the next attempt."));
}

/* ================= VIEW: SOLUTIONS ================= */
function viewSolutions() {

  const items = a.paper.map((item, idx) => {

    const cp = item.o.indexOf(q.a);
    const state = picked === undefined ? "unattempted" : picked === cp ? "correct" : "wrong";
    return { item, q, idx, picked, cp, state };

  const shown = solFilter === "all" ? items : items.filter(x => x.state === solFilter);
  const body = shown.map(x => {
    const chosenText = x.picked === undefined ? "Not attempted" : String.fromCharCode(65 + x.picked) + ". " + esc(x.q.o[x.item.o[x.picked]]);

    return `<div class="sol-item">
      <div class="row wrap between">
        <div class="row wrap"><span class="pill plain">Q${x.idx + 1}</span><span class="pill soft">Unit ${x.q.u}</span>

        <span class="tiny muted">${x.q.d === "e" ? "Easy" : x.q.d === "m" ? "Moderate" : "Hard"}</span>
      </div>
      ${stemHtml(x.q, "qtext")}
      <div class="sol-line"><span class="k">Your answer</span><span style="color:${x.state === "correct" ? "var(--ok)" : x.state === "wrong" ? "var(--bad)" : "var(--muted)"}">${chosenText}</span></div>
      <div class="sol-line"><span class="k">Correct answer</span><span style="color:var(--ok)"><b>${rightText}</b></span></div>
      ${learningExplain(x.q, x.picked === undefined ? "Not attempted" : x.q.o[x.item.o[x.picked]])}
    </div>`;
  }).join("") || `<p class="muted">Nothing in this filter.</p>`;
  return `
  <div class="page-head">
    <div><h1>Detailed solutions · Test ${a.testId}</h1><p>Question-by-question review of your attempt submitted ${fmtDate(a.submittedAt)}.</p></div>
    <div class="row"><button class="btn" data-act="backScore">Back to scorecard</button></div>
  </div>
  <div class="tabs">
    ${["all", "correct", "wrong", "unattempted"].map(f => `<button data-act="solFilter" data-f="${f}" class="${solFilter === f ? "on" : ""}">${f === "all" ? "All 100" : f.charAt(0).toUpperCase() + f.slice(1)} (${items.filter(x => f === "all" || x.state === f).length})</button>`).join("")}
  </div>
  ${body}`;
}

/* Small visual study cards built from each topic's own notes */
function noteVisualAid(t, unitNo) {
  const title = (t.t || '').toLowerCase();
  const html = t.html || '';
  const textOnly = html.replace(/<[^>]*>/g, ' ').replace(/&nbsp;/g, ' ').replace(/\s+/g, ' ');
  let icon = '📚', label = 'CONCEPT SNAPSHOT', tint = 'peach';
  if (/cpu|hardware|memory|number system|binary|computer organisation/.test(title)) { icon='🖥️'; label='COMPUTER CORNER'; tint='blue'; }
  else if (/operating system|process|thread|scheduling|deadlock|file system/.test(title)) { icon='⚙️'; label='HOW IT WORKS'; tint='mint'; }
  else if (/network|internet|protocol|osi|tcp|security|cryptography/.test(title)) { icon='🌐'; label='NETWORK MAP'; tint='blue'; }
  else if (/database|sql|dbms|normalization/.test(title)) { icon='🗃️'; label='DATA DESK'; tint='lavender'; }
  else if (/program|algorithm|data structure|java|python|c\+\+|oop/.test(title)) { icon='💻'; label='CODE CORNER'; tint='mint'; }
  else if (/web|html|css|javascript|browser/.test(title)) { icon='🧩'; label='WEB WORKSHOP'; tint='pink'; }
  else if (/office|word|excel|powerpoint|spreadsheet/.test(title)) { icon='📝'; label='OFFICE TOOLKIT'; tint='peach'; }
  else if (/software|testing|engineering|development/.test(title)) { icon='🛠️'; label='BUILD & TEST'; tint='lavender'; }
  const box = document.createElement('div'); box.innerHTML = html;
  const lead = box.querySelector('.lead')?.textContent?.trim() || box.querySelector('p')?.textContent?.trim() || '';
  const memory = box.querySelector('.mn,.tip')?.textContent?.trim() || '';
  const firstHeading = box.querySelector('h4')?.textContent?.trim() || 'Key ideas';
  const snap = (lead || textOnly).replace(/\s+/g,' ').trim().slice(0,230);
  const exam = memory.replace(/\s+/g,' ').trim().slice(0,190);
  const mini = `<svg viewBox="0 0 160 94" role="img" aria-label="Cute ${label.toLowerCase()} illustration"><circle cx="80" cy="46" r="37" fill="white" opacity=".78"/><circle cx="80" cy="46" r="29" fill="currentColor" opacity=".10"/><text x="80" y="57" text-anchor="middle" font-size="36">${icon}</text><path d="M18 22l4 7 8 2-8 3-4 7-3-7-8-3 8-2zM137 68l3 5 6 2-6 2-3 6-3-6-6-2 6-2z" fill="#F7B94B"/><circle cx="130" cy="19" r="4" fill="#F49ABD"/><circle cx="31" cy="72" r="3" fill="#70CDBB"/></svg>`;
  return `<div class="note-visual-card ${tint}"><div class="note-visual-illustration">${mini}</div><div class="note-visual-copy"><span class="note-label">${label}</span><b>In a nutshell 💡</b><p>${esc(snap || firstHeading)}</p></div></div>` +
    (exam ? `<div class="note-exam-peek"><span>⭐ EXAM SPOTLIGHT</span><p>${esc(exam)}</p></div>` : '');
}

        <tr><th>Email</th><td>${esc(CU.email)}</td></tr>
        <tr><th>Sign-in method</th><td>${CU.provider === "google" ? "Google (simulated)" : "Email &amp; password"}</td></tr>
        <tr><th>Member since</th><td>${fmtDate(CU.createdAt)}</td></tr>
        <tr><th>Attempts stored</th><td>${s.total}</td></tr>
        <tr><th>Average score</th><td>${fmtScore(s.avg)} / 100</td></tr>
      </table>
      <div class="row wrap mt2">
        <button class="btn" data-act="export">Download my data (JSON)</button>
        <button class="btn btn-danger" data-act="logout">Sign out</button>
      </div>
    </div>
    <div class="card">
      <h3>Data controls</h3>
      <p class="small muted">Your profile, test attempts, question-level responses, syllabus ticks and notes status are stored under one key in this browser's local storage, structured as a document store (users &rarr; uid &rarr; data).</p>
      <div class="alert info small">Clearing browser data or using private mode will remove this account. Download a JSON backup if you want a copy.</div>
      <button class="btn btn-danger mt1" data-act="wipe">Delete all my attempts &amp; progress</button>
      <p class="tiny muted mt1">This removes attempts, syllabus ticks and notes marks. The account itself stays so you can start fresh.</p>
    </div>
  </div>`;
}

/* ================= MODALS ================= */
function showModal(html) {
  const host = document.getElementById("menuHost");
  if (!host) return;
  host.innerHTML = `<div class="overlay" data-act="closeOverlay"><div class="modal">${html}</div></div>`;
}
function closeModal() { const h = document.getElementById("menuHost"); if (h) h.innerHTML = ""; }
function submitModal() {
  if (!TEST) return;
  let a = 0, m = 0, u = 0;
  TEST.paper.forEach((_, i) => {
    if (TEST.answers[i] !== undefined) a++;
    else u++;
    if (TEST.marked[i]) m++;
  });
  showModal(`
    <h3>Submit Mock Test ${TEST.testId}?</h3>
    <p class="small muted">Once submitted you cannot change your responses. The scorecard and detailed solutions open immediately.</p>
    <table class="tbl">
      <tr><th>Answered</th><td>${a}</td></tr>
      <tr><th>Not answered</th><td>${u}</td></tr>
      <tr><th>Marked for review</th><td>${m}</td></tr>
      <tr><th>Time remaining</th><td>${TEST.mode === "exam" ? fmtClock(remaining()) : "Not applicable"}</td></tr>
    </table>
    <div class="modal-actions">
      <button class="btn" data-act="closeModal">Keep attempting</button>
      <button class="btn btn-primary" data-act="submitNow">Submit test</button>
    </div>`);
}
function menuModal() {
  showModal(`
    <div class="row" style="gap:.7rem">
      <div class="avatar" style="cursor:default">${(CU.name || "S").split(" ").map(x => x[0]).slice(0, 2).join("").toUpperCase()}</div>
      <div><b>${esc(CU.name)}</b><div class="tiny muted">${esc(CU.email)}</div></div>
    </div>
    <div class="mt2" style="display:grid;gap:.35rem">
      <button class="btn btn-block" data-act="nav" data-route="profile" style="justify-content:flex-start">Profile &amp; data</button>
      <button class="btn btn-block" data-act="nav" data-route="dashboard" style="justify-content:flex-start">Dashboard</button>
      <button class="btn btn-block btn-danger" data-act="logout" style="justify-content:flex-start">Sign out</button>
    </div>`);
}

/* ================= EVENTS ================= */
document.addEventListener("click", function (e) {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.getAttribute("data-act");

  if (act === "theme") { toggleTheme(); return; }
  if (act === "buddy") {
    const b = document.getElementById("studyBuddy");
    const pop = document.getElementById("buddyPop");
    if (b && pop) {
      const boosts = [
        "Small progress is still progress. Keep going, one topic at a time. 🌱",
        "You do not need a perfect day; just give today an honest effort. ✨",
        "Every question you practise makes the next one a little easier. 📚",
        "A slow study day is not a wasted day. Stay consistent. 🌼",
        "Focus on the next 25 minutes, not the entire syllabus. ⏳",
        "You have already started. That is a step worth building on. 💛",
        "Mistakes are feedback. Learn the concept and try again. 💡",
        "Your pace is allowed to be different. Keep your direction clear. 🧭",
        "One chapter, one concept, one question at a time. You can do this. 🌷",
        "Do what you can today; consistency will take care of the rest. ⭐",
        "You are preparing for your future. Make this session count. 🎯",
        "Take a breath, reset your focus, and begin with one small task. 🍀"
      ];
      let next = Math.floor(Math.random() * boosts.length);
      const previous = Number(b.dataset.lastBoostIndex);
      if (boosts.length > 1 && next === previous) next = (next + 1 + Math.floor(Math.random() * (boosts.length - 1))) % boosts.length;
      b.dataset.lastBoostIndex = String(next);
      pop.textContent = boosts[next];
      b.classList.add("open");
    }
    return;
  }
  if (act === "randomNote") {
    const all = NOTES_UNITS.flatMap(u => u.topics.map(t => ({u:u.u,id:t.id})));
    if (all.length) { const pick = all[Math.floor(Math.random()*all.length)]; openNote[pick.id] = true; render(); setTimeout(() => { const el = document.getElementById("nt_"+pick.id); if (el) scrollToEl(el, 10); }, 40); }
    return;
  }
  if (act === "menu") { menuModal(); return; }
  if (act === "closeOverlay") { if (e.target === el) closeModal(); return; }
  if (act === "closeModal") { closeModal(); return; }
  if (act === "authTab") { authMode = el.getAttribute("data-tab"); render(); return; }
  if (act === "login") {
    const err = doLogin(val("fEmail"), val("fPass"));
    if (err) { document.getElementById("authErr").innerHTML = '<div class="alert err">' + esc(err) + "</div>"; return; }
    return;
  }
  if (act === "signup") {
    const err = doSignup(val("fName"), val("fEmail"), val("fPass"), val("fPass2"));
    if (err) { document.getElementById("authErr").innerHTML = '<div class="alert err">' + esc(err) + "</div>"; return; }
    return;
  }
  if (act === "nav") { go(el.getAttribute("data-route")); closeModal(); closeNav(); return; }
  if (act === "navToggle") { toggleNav(); return; }
  if (act === "gotoTests") { go("tests"); return; }
  if (act === "logout") { closeModal(); logout(); return; }
  if (act === "decl") { const b = document.getElementById("startBtn"); if (b) b.disabled = !el.checked; return; }
  if (act === "instr") {
    const tid = parseInt(el.getAttribute("data-test"), 10);
    const mode = el.getAttribute("data-mode");
    if (mode === "practice") { beginTest(tid, mode); return; }
    window.__pendingStart = { testId: tid, mode: mode };
    go("instr"); return;
  }
  if (act === "beginTest") {
    const ps = pendingStart();
    if (!ps) { go("tests"); return; }
    beginTest(ps.testId, ps.mode); return;
  }
  if (act === "resume") { resumeTest(); return; }
  if (act === "discardActive") {
    if (!confirm("Discard the unfinished test? Your saved responses will be lost.")) return;
    UD.active = null; saveDB(); render(); toast("Unfinished test discarded."); return;
  }
  if (act === "pick") {
    if (!TEST) return;
    const pos = parseInt(el.getAttribute("data-pos"), 10);
    const practice = TEST.mode === "practice";
    if (practice && TEST.answers[TEST.idx] !== undefined) return;
    TEST.answers[TEST.idx] = pos;
    TEST.visited[TEST.idx] = true;
    persistActive();
    paintQuestion(); paintPalette();
    return;
  }
  if (act === "clear") {
    if (!TEST) return;
    if (TEST.mode === "practice" && TEST.answers[TEST.idx] !== undefined) return;
    delete TEST.answers[TEST.idx];
    persistActive(); paintQuestion(); paintPalette(); return;
  }
  if (act === "mark") {
    if (!TEST) return;
    TEST.marked[TEST.idx] = !TEST.marked[TEST.idx];
    persistActive(); paintQuestion(); paintPalette(); return;
  }
  if (act === "prev") { if (TEST && TEST.idx > 0) { TEST.idx--; TEST.visited[TEST.idx] = true; persistActive(); paintQuestion(); paintPalette(); } return; }
  if (act === "next") {
    if (!TEST) return;
    if (TEST.idx === 99) { submitModal(); return; }
    TEST.idx++; TEST.visited[TEST.idx] = true; persistActive(); paintQuestion(); paintPalette();
    window.scrollTo({ top: 0, behavior: "smooth" }); return;
  }
  if (act === "jump") { if (TEST) { TEST.idx = parseInt(el.getAttribute("data-i"), 10); TEST.visited[TEST.idx] = true; persistActive(); paintQuestion(); paintPalette(); } return; }
  if (act === "submitAsk") { submitModal(); return; }
  if (act === "submitNow") { closeModal(); finalizeTest(false); return; }
  if (act === "reattempt") {
    const tid = parseInt(el.getAttribute("data-test"), 10);
    const mode = el.getAttribute("data-mode");
    if (mode === "practice") { beginTest(tid, mode); return; }
    window.__pendingStart = { testId: tid, mode: mode };
    go("instr"); return;
  }
  if (act === "solutions") {
    const id = el.getAttribute("data-id");
    const a = UD.attempts.find(x => x.id === id);
    if (a) { currentAttempt = a; solFilter = "all"; go("solutions"); }
    return;
  }
  if (act === "openAttempt") {
    const id = el.getAttribute("data-id");
    const a = UD.attempts.find(x => x.id === id);
    if (a) { currentAttempt = a; go("scorecard"); }
    return;
  }
  if (act === "backScore") { go("scorecard"); return; }
  if (act === "solFilter") { solFilter = el.getAttribute("data-f"); render(true); return; }
  if (act === "toggleUnit") { const u = parseInt(el.getAttribute("data-u"), 10); openUnits[u] = !openUnits[u]; render(true); return; }
  if (act === "topic") {
    const id = el.getAttribute("data-id");
    if (el.checked) UD.syllabus[id] = true; else delete UD.syllabus[id];
    saveDB(); render(true); return;
  }
  if (act === "noteRead") {
    const id = el.getAttribute("data-id");
    if (el.checked) { UD.notes[id] = nowISO(); sparkleAt(el); } else delete UD.notes[id];
    saveDB(); render(true); return;
  }
  if (act === "noteToggle") {
    const id = el.getAttribute("data-id");
    openNote[id] = !openNote[id];
    render(true); return;
  }
  if (act === "openTopic") {
    const id = el.getAttribute("data-id");
    openNote[id] = true;
    go("notes");
    setTimeout(() => scrollToEl(document.getElementById("nt_" + id), 10), 140);
    return;
  }
  if (act === "notesAll") {
    const v = el.getAttribute("data-v") === "1";
    openNote = {};
    if (v) NOTES_UNITS.forEach(u => u.topics.forEach(t => { openNote[t.id] = true; }));
    render(true); return;
  }
  if (act === "jumpUnit") {
    const u = el.getAttribute("data-u");
    const target = document.getElementById("nu" + u);
    scrollToEl(target, 10);
    return;
  }
  if (act === "export") {
    const payload = { exportedAt: nowISO(), profile: { name: CU.name, email: CU.email, provider: CU.provider, createdAt: CU.createdAt }, data: UD };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "btsc-lab-assistant-backup.json";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    toast("Backup downloaded.");
    return;
  }
  if (act === "wipe") {
    if (!confirm("Delete all attempts, syllabus ticks and notes marks? This cannot be undone.")) return;
    UD.attempts = []; UD.syllabus = {}; UD.notes = {}; UD.active = null;
    saveDB(); render(); toast("Progress cleared."); return;
  }
});
document.addEventListener("input", function(e) {
  if (!e.target || e.target.id !== "noteSearch") return;
  const term = e.target.value.trim().toLowerCase();
  document.querySelectorAll(".ntopic").forEach(card => {
    const hit = !term || card.textContent.toLowerCase().includes(term);
    card.style.display = hit ? "" : "none";
  });
  document.querySelectorAll(".nunit").forEach(unit => {
    const visible = Array.from(unit.querySelectorAll(".ntopic")).some(card => card.style.display !== "none");
    unit.style.display = visible ? "" : "none";
  });
});
document.addEventListener("submit", function (e) { e.preventDefault(); });
document.addEventListener("keydown", function (e) {
  if (route !== "test" || !TEST) return;
  if (e.key === "ArrowRight") { if (TEST.idx < 99) { TEST.idx++; TEST.visited[TEST.idx] = true; persistActive(); paintQuestion(); paintPalette(); } }
  if (e.key === "ArrowLeft") { if (TEST.idx > 0) { TEST.idx--; TEST.visited[TEST.idx] = true; persistActive(); paintQuestion(); paintPalette(); } }
  if (["1", "2", "3", "4"].indexOf(e.key) >= 0) {
    const pos = parseInt(e.key, 10) - 1;
    const item = TEST.paper[TEST.idx];
    if (pos < item.o.length) {
      if (TEST.mode === "practice" && TEST.answers[TEST.idx] !== undefined) return;
      TEST.answers[TEST.idx] = pos; TEST.visited[TEST.idx] = true;
      persistActive(); paintQuestion(); paintPalette();
    }
  }
});
function val(id) { const el = document.getElementById(id); return el ? el.value : ""; }
function scrollToEl(el, extra) {
  if (!el) return;
  const nav = document.querySelector(".nav");
  const tr = document.querySelector(".ntracker");
  const off = (nav ? nav.offsetHeight : 60) + (tr ? tr.offsetHeight : 0) + (extra || 14);
  window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - off, behavior: "smooth" });
}
function toggleNav() {
  const links = document.getElementById("navLinks");
  const btn = document.getElementById("navBurger");
  if (!links || !btn) return;
  const open = links.classList.toggle("open");
  btn.textContent = open ? "✕" : "☰";
  btn.setAttribute("aria-expanded", open ? "true" : "false");
}
function closeNav() {
  const links = document.getElementById("navLinks");
  const btn = document.getElementById("navBurger");
  if (links) links.classList.remove("open");
  if (btn) { btn.textContent = "☰"; btn.setAttribute("aria-expanded", "false"); }
}

/* ================= BOOT ================= */
(function boot() {
  DB = loadDB();
  applyTheme(localStorage.getItem(THEME_KEY) || "light");
  let sess = null;
  try { sess = JSON.parse(localStorage.getItem(SESSION_KEY) || "null"); } catch (e) { sess = null; }
  if (sess && sess.uid && DB.users[sess.uid]) {
    CU = DB.users[sess.uid];
    UD = CU.data;
    if (!UD.attempts) UD.attempts = [];
    if (!UD.syllabus) UD.syllabus = {};
    if (!UD.notes) UD.notes = {};
    if (!UD.settings) UD.settings = {};
    applyTheme(UD.settings.theme || localStorage.getItem(THEME_KEY) || "light");
  }
  render();
})();

</script>
</body>
